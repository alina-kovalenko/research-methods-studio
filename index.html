ncy.","Numerical measures can be valid when they appropriately represent the intended construct.","Correct: consistent liking ratings do not establish valid measurement of understanding."],"source":{"doc":"P4","pages":"6"},"concept":"Reliable but invalid measurement"},{"id":"c19","topic":"collection","difficulty":"applied","prompt":"A survey asks, 'How much has our excellent new learning platform improved your studies?' What is the most direct revision to reduce bias?","options":["Remove all respondents who report no improvement.","Ask neutrally how the platform has affected studying, allowing positive, negative, or no effect.","Use the same leading question for every respondent and call the bias controlled.","Add a second similarly worded item to check answer consistency."],"answer":1,"explanation":"Lecture 4 requires the methodology to explain how research biases were mitigated. Neutral wording is an applied extension of that requirement, supported by Practice 4's emphasis on questionnaire design.","distractors":["Removing contrary responses would further bias the evidence.","Correct: neutral wording permits different experiences without presupposing improvement.","Standardization can reproduce the same bias consistently.","Consistent answers to similarly leading items would not remove the wording bias."],"source":{"doc":"L4","pages":"4"},"concept":"Leading questionnaire wording"},{"id":"c20","topic":"collection","difficulty":"challenge","prompt":"Extension beyond the slides: a survey about campus accessibility is distributed only through a sports club, with voluntary responses. Which limitation most directly affects a claim about all students?","options":["Calculating percentages removes any problem caused by recruitment.","Many students may be excluded or unlikely to respond, so the sample may systematically differ from the population.","Voluntary responses make the data qualitative regardless of question format.","The study lacks random assignment to survey answers."],"answer":1,"explanation":"Practice 4 emphasizes suitable sampling, questionnaire administration, and population inference in surveys. Coverage and self-selection are extensions that explain why the recruitment process matters even when many numerical responses are collected.","distractors":["Correct arithmetic cannot repair systematic omissions from the sample.","Correct: the recruitment and response processes can distort who is represented.","Participation choice does not determine whether the responses are numerical or textual.","Sampling respondents and assigning experimental conditions are different design operations."],"source":{"doc":"P4","pages":"14"},"concept":"Coverage and self-selection"},{"id":"c21","topic":"collection","difficulty":"applied","prompt":"A study compares an app used only by advanced students with a different app used only by beginners. Prior skill also affects the test outcome. What role does prior skill play?","options":["The dependent variable, because it existed before the study.","A possible confounding variable in the app-outcome comparison.","A controlled factor, because both groups contain students.","An irrelevant variable, because the research question names only the apps."],"answer":1,"explanation":"Lecture 4 says experiments require control of confounding variables. In this comparison, app choice and prior skill vary together, so a score difference cannot confidently be attributed to the app alone.","distractors":["The dependent variable is the measured outcome; temporal order alone does not define this role.","Correct: prior skill varies with app group and can affect the outcome.","Sharing a broad category does not equate the groups' relevant characteristics.","A factor can threaten causal interpretation even when omitted from the research question."],"source":{"doc":"L4","pages":"15–16"},"concept":"Confounding variables"},{"id":"c22","topic":"collection","difficulty":"challenge","prompt":"A cross-sectional survey finds a strong correlation between daily screen time and poor sleep. Which next statement best respects the evidence?","options":["The variables are associated; the survey alone does not identify the direction or cause of the relationship.","Using statistical software makes all alternative explanations negligible.","A stronger correlation would automatically convert the design into an experiment.","Poor sleep must be the dependent variable in a proven causal relationship."],"answer":0,"explanation":"Lecture 4 distinguishes correlational summaries in descriptive studies from cause-and-effect questions in experiments. The choice of statistical tool cannot by itself overcome the study's causal limitations.","distractors":["Correct: reverse direction and other explanations remain possible.","Software performs analyses but does not replace research design.","Correlation magnitude does not create manipulation or a controlled causal comparison.","Naming a measured outcome does not establish causation."],"source":{"doc":"L4","pages":"15–16, 21"},"concept":"Analysis cannot rescue causal design"},{"id":"c23","topic":"collection","difficulty":"challenge","prompt":"Lecture 4 lists probability sampling as a source for quantitative analysis. A convenience sample nevertheless supplies valid numerical waiting-time records. Which interpretation is most careful?","options":["The sample's numbers can be summarized statistically, while population generalization needs caution.","Quantitative analysis is impossible whenever sampling is non-probability.","Only thematic analysis is allowed because recruitment was convenient.","Numerical measurement automatically turns the convenience sample into a probability sample."],"answer":0,"explanation":"Lecture 4's sampling examples should not be treated as exclusive eligibility rules. Clarification beyond the slide: data form and the research question guide analysis, while sampling and other assumptions determine which generalizations are defensible.","distractors":["Correct: descriptive calculations are possible, but the sampling process limits broader inference.","Numerical data can be analyzed without probability sampling, though inferential claims may be restricted.","Sampling method does not mechanically dictate that numerical measurements be treated as text.","Measurement format does not alter how participants were selected."],"source":{"doc":"L4","pages":"20–21"},"concept":"Numerical analysis of non-probability samples"},{"id":"c24","topic":"collection","difficulty":"applied","prompt":"Two analysts use the same open-ended survey responses. One wants to understand recurring meanings; the other wants the frequency of predefined response categories. Which plan is best?","options":["Avoid analysis because open-ended survey responses are neither data nor measurements.","Use a qualitative interpretation for meanings and systematic coding plus counts for category frequencies.","Use counts for both because numerical coding makes interpretation unnecessary.","Require both analysts to use identical methods because the source data is identical."],"answer":1,"explanation":"Lecture 4 says data can often be analyzed both qualitatively and quantitatively. The example of survey meanings versus response frequencies shows why analytic purpose and preparation matter.","distractors":["Open-ended responses are data and can be prepared for qualitative or quantitative analysis.","Correct: the same source material can support different analyses when the question and coding justify them.","Coding involves judgments, and counts do not directly answer a question about meanings.","Different research questions may require different representations and analyses."],"source":{"doc":"L4","pages":"19"},"concept":"Matching analysis to the question"},{"id":"c25","topic":"collection","difficulty":"challenge","prompt":"Extension beyond the slides: an archive changes its definition of 'employed' halfway through a 20-year series. What should the researcher do before interpreting a trend?","options":["Treat all later values as primary data because the definition is newer.","Ignore the change because official data requires no preparation.","Add the years together to make the inconsistency disappear.","Examine and address the definition change, and qualify comparisons if necessary."],"answer":3,"explanation":"Lecture 4 warns that researchers do not control secondary-data generation and may need extra processing. A changed definition is an extension illustrating why metadata and comparability must be checked before drawing a trend conclusion.","distractors":["A definition change does not alter the analyst's relationship to the data source.","Secondary data still needs assessment for suitability and comparability.","Aggregation does not automatically correct incompatible measurement definitions.","Correct: an apparent trend may partly reflect changed measurement rather than changed employment."],"source":{"doc":"L4","pages":"14"},"concept":"Secondary-data comparability"},{"id":"c26","topic":"collection","difficulty":"applied","prompt":"While coding interviews, a researcher notices that their preferred explanation does not fit several accounts. Which response best follows Lecture 4's bias guidance?","options":["Remove those accounts because they reduce the clarity of the preferred explanation.","Count only passages that support the original explanation.","Rename the project quantitative to avoid interpretation.","Examine the conflicting accounts and reconsider the coding and assumptions."],"answer":3,"explanation":"Lecture 4 says qualitative analysis relies on researcher judgment and requires reflection on choices and assumptions. Investigating conflicting evidence helps avoid turning an initial expectation into an unsupported finding.","distractors":["Selective exclusion would bias the interpretation.","Frequency counting cannot correct a selectively constructed evidence base.","Changing a label does not remove judgments or bias.","Correct: reflective analysis takes disconfirming evidence seriously."],"source":{"doc":"L4","pages":"20"},"concept":"Reflexivity and selective coding"},{"id":"c27","topic":"collection","difficulty":"applied","prompt":"A researcher wants to understand how staff actually coordinate tasks during normal work, including actions they may not recall in interviews. Which collection method most directly serves that aim?","options":["Interviews asking staff to recall how they usually coordinate tasks.","A questionnaire about staff satisfaction with coordination.","Observation in the work setting.","An analysis of the official coordination policy alone."],"answer":2,"explanation":"Lecture 4 links observation to understanding how something occurs in its natural setting. It can yield counts, descriptive notes, or both, according to the research purpose.","distractors":["Interviews can reveal perceptions but may miss the unremembered actions the researcher wants to document.","Satisfaction reports do not directly record how coordination occurs in the workplace.","Correct: observation can document how behavior occurs in its natural context.","A policy describes intended procedures and may differ from actual everyday behavior."],"source":{"doc":"L4","pages":"17"},"concept":"Observation in context"},{"id":"c28","topic":"collection","difficulty":"challenge","prompt":"Extension beyond the slides: a team measures performance, introduces a new tool, and measures performance again after a busy season has ended. Why should a causal claim remain cautious?","options":["The study has no independent variable because performance was measured twice.","The use of numbers rules out confounding by workload.","The change in workload may explain some or all of the improvement.","Before-and-after data automatically proves the tool caused the change."],"answer":2,"explanation":"Lecture 4 emphasizes that experimental validity depends on the design and control of confounding. Applying this to an uncontrolled before-and-after study shows why introducing a tool does not guarantee that a subsequent improvement is its effect.","distractors":["The tool introduction can be the intended intervention even when the design is weak.","Numerical measurement does not remove competing causes.","Correct: another change occurred alongside the tool introduction and could affect the outcome.","Temporal sequence does not by itself exclude alternative explanations."],"source":{"doc":"L4","pages":"15–16"},"concept":"Limits of an uncontrolled intervention"},{"id":"c29","topic":"collection","difficulty":"challenge","prompt":"A small qualitative study offers detailed explanations of how participants navigate a service. Which statement best avoids overreading Lecture 4's 'not generalizable' table entry?","options":["Small qualitative studies cannot contribute any knowledge beyond the interviewed individuals.","Population percentages are not established, but contextual findings may inform understanding in other relevant settings.","Adding numerical codes automatically makes the sample representative.","Detailed quotations alone prove that the same proportions hold in the whole population."],"answer":1,"explanation":"Lecture 4's table highlights limits on broad generalization from qualitative research. Methodological clarification beyond the table: statistical population inference and contextual or conceptual transfer are different claims, and each needs its own justification.","distractors":["This confuses limited statistical generalization with the absence of broader conceptual insight.","Correct: transfer to other contexts requires reasoning about fit rather than an automatic numerical generalization.","Coding format does not change the sampling process.","Rich detail does not create a representative frequency estimate."],"source":{"doc":"L4","pages":"12"},"concept":"Qualitative scope and generalization"},{"id":"c30","topic":"collection","difficulty":"applied","prompt":"A report lists its survey software and final sample size but omits recruitment, question wording, analysis procedures, and the reasons for choosing them. What is the best revision?","options":["Explain how data was collected and analyzed, why the methods fit the question, and how bias was addressed.","Replace the missing procedures with a stronger claim that the method is reliable.","Add more result tables without explaining how the evidence was produced.","Report only the software version because the program determined the methodology."],"answer":0,"explanation":"Lecture 4 says methodology should include research type, collection and analysis, tools, bias mitigation, and reasons for the methods. This information lets readers evaluate reliability and validity rather than merely accept a claim of quality.","distractors":["Correct: the revision supplies both procedural detail and methodological justification.","An unsupported assurance does not let readers evaluate the method.","Additional findings do not fill the methodological gaps.","Tools are part of the procedure, not a substitute for research choices and justification."],"source":{"doc":"L4","pages":"3–4"},"concept":"Complete methodology reporting"}],"lessons":[{"topic":"foundations","title":"Research foundations: connect the question to the evidence","lead":"Lecture 1 introduces the whole research process. Study the decisions as a connected chain: the question determines the evidence needed, the design organizes its collection, and analysis supports claims of an appropriate scope. The worked examples below are practice applications, not studies reported by the lecturer.","sections":[{"title":"1. Move from a problem to an answerable investigation","body":"Research contributes to knowledge, innovation, academic growth, and practical problem-solving. Lecture 1 begins the planning process with identifying a research problem, making the question clear, focused, and researchable, and aligning it with objectives. A useful exam strategy is to ask what each sentence is doing in that process. Application beyond the slide wording: a problem identifies a difficulty or unresolved issue; a research question asks what the study will investigate; an objective states what the study intends to accomplish; and a hypothesis predicts an expected relationship or outcome. These are connected but cannot replace one another. A prediction is not a finding, and a broad topic is not yet a researchable question. The proposal should make the planned investigation understandable before data collection begins.","example":"Application beyond the slide wording: Problem—students miss feedback; question—how does reminder timing relate to feedback use? Objective—compare use across reminder schedules. Hypothesis—earlier reminders will be associated with greater use. The hypothetical prediction is supplied for practice; it is not an author claim from a real paper.","trap":"Do not label an objective as a result simply because it contains an action verb. Do not invent a hypothesis where a study states only a question.","source":{"doc":"L1","pages":"3, 5, 14"}},{"title":"2. Choose the approach by the kind of understanding required","body":"The lecture distinguishes qualitative research, quantitative research, and mixed methods. Qualitative research focuses on understanding concepts and experiences. Quantitative research involves numerical data and statistical analysis. Mixed methods combines qualitative and quantitative approaches. Begin with the purpose: understanding how people experience an event differs from estimating how frequently it occurs or testing a numerical relationship. The approach should fit that purpose. Application beyond the slide wording: the mere presence of people does not make a study qualitative, and comparing two groups does not make it mixed methods. A strong mixed-methods explanation states why the two kinds of evidence are useful together. Interviews often provide qualitative accounts, but the name of a collection tool alone is not a complete account of the research approach.","example":"Application beyond the slide wording: A project estimates how often students abandon an online course, interviews students about their reasons, and connects their accounts to the numerical pattern. The combined purpose supports a mixed-methods approach.","trap":"Do not infer the approach from sample size, whether humans are involved, or how many software packages were used.","source":{"doc":"L1","pages":"4, 8"}},{"title":"3. Review literature to build knowledge, not a source inventory","body":"The literature review helps the researcher understand the existing body of knowledge. Lecture 1 describes three connected activities: searching, reviewing, and synthesizing existing research. Google Scholar, IEEE Xplore, and PubMed are named as tools for finding literature. Searching retrieves possible sources, but it does not by itself establish what those sources collectively show. Application beyond the slide wording: synthesis compares studies, connects shared findings, examines disagreement, and explains how differences in methods or settings may matter. This process can reveal an unresolved issue that a new study could address. Keep the distinction between an absence of relevant evidence and a personal failure to find evidence. The lecture also lists inadequate literature review among common pitfalls, because weak understanding of prior work can undermine the investigation's rationale.","example":"Application beyond the slide wording: Rather than writing five isolated summaries of feedback studies, compare which formats worked, in which populations, and under which measurement conditions. State the remaining uncertainty without pretending that every difference is a new research gap.","trap":"A long reference list is not automatically a synthesis. A search engine locates material; it does not decide whether the material supports your argument.","source":{"doc":"L1","pages":"6, 18"}},{"title":"4. Separate the study design from the collection method","body":"Lecture 1 presents experimental, survey, and case-study designs. Experimental design investigates cause-and-effect relationships; survey design collects data from a sample of individuals; and case-study design examines a specific situation in depth. The next slide introduces surveys or questionnaires, interviews, and observations as ways of collecting data. Keep these levels distinct: a design organizes the investigation, while a collection method describes how particular evidence is obtained. Application beyond the slide wording: a questionnaire can appear within different designs, and an in-depth case study can use more than one source of evidence. The design label does not guarantee that the evidence answers the question. For a causal claim, inspect the comparison and competing explanations rather than assuming that the word 'experimental' settles the issue.","example":"Application beyond the slide wording: A study of one department's scheduling change may use staff interviews, observations, and records within a case-study design. A questionnaire is one possible instrument, not a complete design description.","trap":"Do not confuse studying a specific population with necessarily conducting a case study. The purpose and organization of the investigation matter.","source":{"doc":"L1","pages":"7–8"}},{"title":"5. Examine how the sample entered the study","body":"Sampling connects the people or units studied with the population the researcher wants to understand. Lecture 1 contrasts probability and non-probability sampling and stresses the importance of choosing the right method. Its statement that probability sampling gives every member an equal chance is an introductory simplification. Application beyond the slide wording: probability sampling uses known, nonzero selection probabilities; equal probabilities characterize simple random sampling but are not required in every probability design. Non-probability recruitment does not establish those probabilities and may depend on availability, voluntary response, or selected criteria. To evaluate a sampling claim, identify the target population, the selection process, and who may be missed. A large response count alone does not establish that a narrow or self-selected sample represents a broader population.","example":"Application beyond the slide wording: Five thousand volunteers from one gaming forum provide many observations, but the recruitment route still restricts whose experiences are represented. Reporting the sample size does not resolve that selection issue.","trap":"Do not turn 'equal chance' into the definition of every probability design, or treat a large sample as an automatic cure for selection bias.","source":{"doc":"L1","pages":"9"}},{"title":"6. Match analysis and visualization to the evidence","body":"The tools slide assigns SPSS to quantitative statistical analysis, R to statistical computing and graphics, and NVivo to qualitative analysis. The statistics slide then separates descriptive statistics, which summarize data, from inferential statistics, which draw conclusions from samples. Mean, median, and mode are examples of descriptive summaries. Data visualization supports understanding through visual representation; Excel and Tableau are the examples named in the lecture. These are different roles within a project, rather than interchangeable labels for research quality. Application beyond the slide wording: a sample mean describes the observed sample, while a claim about a population requires an inferential argument and suitable assumptions. Similarly, a polished chart must still communicate the data accurately. Software cannot repair a mismatch between the question, measurements, and analysis.","example":"Application beyond the slide wording: Reporting the median completion time of 80 respondents is descriptive. Using those observations to estimate the university population's completion time attempts inference and raises further sampling questions.","trap":"Do not treat an analysis package, a chart, or a statistically computed number as proof that the design or interpretation is sound.","source":{"doc":"L1","pages":"10–12"}},{"title":"7. Build ethics and clarity into the proposal","body":"Lecture 1 treats ethics as part of conducting research, naming informed consent, confidentiality, avoiding bias, and ethical approval processes or guidelines. The proposal slide lists a title, abstract, introduction, and methodology, and emphasizes clear objectives, hypotheses, and academic standards. Read these requirements together: a proposal should explain a coherent investigation and how it will handle participants and evidence responsibly. Application beyond the slide wording: a plan to share data must remain consistent with the consent and confidentiality conditions under which they were collected. Likewise, excluding observations solely because they contradict a preferred conclusion would introduce bias. Clear hypotheses are valuable when the design calls for predictions, but exploratory qualitative work can be organized around research questions. The lecture's brief proposal list is not every institution's complete submission template.","example":"Application beyond the slide wording: If participants were promised that identifiable responses would remain within the research team, a later wish to publish an open dataset does not by itself authorize releasing names.","trap":"Do not assume ethics can be postponed until publication. Do not force a directional hypothesis into a study whose purpose is open-ended exploration.","source":{"doc":"L1","pages":"13–14, 19"}},{"title":"8. Communicate, publish, and remain open to scrutiny","body":"The final lecture topics connect research with its audiences. Oral presentations need effective structure and delivery; posters should be informative and visually clear. Publication requires choosing an appropriate journal or conference and understanding submission procedures. The peer-review slide presents submission, review, revision, and acceptance, alongside responding to reviewer comments. Application beyond the slide wording: this is a simplified possible path, since rejection and repeated revisions also occur. Peer review supports quality control but cannot guarantee that every claim is correct. The lecture also identifies interdisciplinary work, big data and AI, and open access or data sharing as emerging trends. These developments expand research possibilities while leaving the earlier responsibilities intact: clear questions, adequate literature review, appropriate evidence collection and analysis, ethical practice, and clear communication.","example":"Application beyond the slide wording: A reviewer identifies an unclear selection procedure. A substantive response explains or improves the procedure and acknowledges any resulting limitation; changing the poster design would not address the criticism.","trap":"Do not treat publication or peer review as the end of critical appraisal. Data-sharing trends also do not erase confidentiality commitments.","source":{"doc":"L1","pages":"15–20"}}],"glossary":[{"term":"Research problem","meaning":"The difficulty or unresolved issue motivating investigation. Application beyond the slide wording: distinguish it from the question that makes the inquiry specific."},{"term":"Research question","meaning":"A clear, focused, researchable inquiry aligned with the study's objectives."},{"term":"Objective","meaning":"What the study intends to accomplish; it states the planned focus or task."},{"term":"Hypothesis","meaning":"A testable prediction about an expected relationship or outcome. Application beyond the slide wording: not every study requires an explicit predictive hypothesis."},{"term":"Qualitative research","meaning":"An approach focused on understanding concepts, experiences, or meanings."},{"term":"Quantitative research","meaning":"An approach involving numerical data and statistical analysis."},{"term":"Mixed methods","meaning":"A combination of qualitative and quantitative approaches; connecting their contributions strengthens the rationale for the combination."},{"term":"Literature synthesis","meaning":"Connecting and comparing existing studies rather than merely listing or separately summarizing them."},{"term":"Experimental design","meaning":"A design category used to investigate cause–effect relationships; the label alone does not guarantee a justified causal claim."},{"term":"Case study","meaning":"An in-depth investigation of a specific situation or case."},{"term":"Probability sampling","meaning":"Application beyond the slide wording: a sampling design with known, nonzero selection probabilities; these probabilities need not all be equal."},{"term":"Non-probability sampling","meaning":"Selection that does not establish known random inclusion probabilities, often based on availability or selected criteria."},{"term":"Descriptive statistics","meaning":"Summaries of observed data, such as mean, median, and mode."},{"term":"Inferential statistics","meaning":"Drawing conclusions using sample data, with the strength of the inference depending on design and assumptions."},{"term":"Confidentiality","meaning":"Protecting identifiable information according to the study's commitments and procedures."},{"term":"Peer review","meaning":"Scholarly evaluation intended to improve or assess research quality; it does not guarantee truth."}],"corrections":[{"claim":"Every probability sample gives every population member an equal chance.","clarification":"Application beyond the slide wording: equal chances describe simple random sampling, while other probability designs can use unequal but known, nonzero selection probabilities.","source":{"doc":"L1","pages":"9"}},{"claim":"Peer review ensures that published research is valid.","clarification":"Application beyond the slide wording: treat this as the purpose of quality control, not a guarantee. Published methods and claims still need scrutiny, and submissions may be rejected or revised repeatedly.","source":{"doc":"L1","pages":"17"}},{"claim":"Every research proposal must contain a directional hypothesis.","clarification":"Application beyond the slide wording: the proposal slide emphasizes hypotheses, but their necessity depends on the design. Exploratory studies may use research questions without a stated prediction.","source":{"doc":"L1","pages":"4–5, 14"}},{"claim":"A particular software package establishes a study's methodological quality.","clarification":"Application beyond the slide wording: software supports analysis; appropriateness still depends on the question, design, sampling, collection, and interpretation.","source":{"doc":"L1","pages":"5, 7–11, 18"}},{"claim":"Open-data trends authorize publishing all collected participant information.","clarification":"Application beyond the slide wording: sharing decisions must respect informed consent and confidentiality; the trend does not override those commitments.","source":{"doc":"L1","pages":"13, 19"}}]},{"topic":"articles","title":"Read an article as an argument: IMRAD and critical appraisal","lead":"Lecture 2 teaches how the parts of a research report work together and gives five tasks for analyzing a paper. Read for the connection between the authors' question, methods, findings, and claims. Separate what the paper explicitly states from what you infer, especially when no hypothesis is written.","sections":[{"title":"1. Use IMRAD as a map of functions","body":"IMRAD stands for Introduction, Methods, Results, and Discussion; the 'A' represents the conjunction 'and.' The lecture associates these sections with four questions: why was the research done, how was it done, what was found, and what does it mean? Use those functions to locate an argument even when the headings differ. The Introduction establishes purpose, necessity, and direction. Methods makes the investigation understandable. Results presents findings, while Discussion explains their meaning and relevance. The lecture also lists supporting materials such as questionnaires, interview guides, and consent forms. Application beyond the slide wording: references and appendices follow the required publication format rather than a universal placement rule. Likewise, the suggested 10–15% introduction length is a teaching guideline; clarity, concision, and the actual requirements matter.","example":"Application beyond the slide wording: 'We recorded response time after each trial' describes Methods. 'Median time decreased by two seconds' reports Results. 'The change may reflect easier navigation' offers Discussion.","trap":"Do not assign a sentence to a section merely because it contains a familiar word. Ask which function the sentence performs.","source":{"doc":"L2","pages":"2–4, 12, 18–20"}},{"title":"2. Separate the gap, problem, question, objective, and hypothesis","body":"The Introduction should establish the issue, justify studying it, and use literature to support its statements. Objectives specify the focus and what the study aims to achieve, while the review selects literature relevant to that focus. Application beyond the slide wording: a research gap is a relevant unresolved issue in existing knowledge; a problem describes the difficulty motivating inquiry; a question asks what the investigation will answer; an objective states the intended research task; and a hypothesis predicts an expected outcome. A single paragraph may connect all these roles, but they are not synonyms. When analyzing an article, preserve the authors' exact level of commitment. The class task asks for a 'hypothesis or proposed concept,' so a proposed method should not automatically be rewritten as an explicitly stated hypothesis.","example":"Application beyond the slide wording: 'Prior studies cover English only' describes literature; 'transfer to Kazakh is unknown' identifies a gap; 'we will test transfer' states an objective; 'accuracy will decline' would be a hypothesis only if actually stated or clearly labeled as your inference.","trap":"A question does not predict its answer, and an objective does not report a completed result. State 'no explicit hypothesis found' when that is what the paper supports.","source":{"doc":"L2","pages":"4–7, 9, 22"}},{"title":"3. Explain the framework, beneficiaries, and study-specific terms","body":"Lecture 2 presents a conceptual or theoretical framework as central to the study and discusses concepts, theories, and research diagrams. Application beyond the slide wording: the useful function of a framework is to explain how the important ideas connect and why those relationships are worth investigating. A diagram alone does not establish that reasoning, and a theory is more than a claim made by a famous author. The significance section identifies who may benefit and the kind of benefit they may receive. Definitions of terms should explain how the terms are used in this particular study, with lexical definitions added when useful. This operational emphasis is crucial when a broad concept, such as engagement, is represented by a specific measure. That measure may capture only part of the concept.","example":"Application beyond the slide wording: Defining engagement as activities completed per student during four weeks makes the measure inspectable. It does not imply that completion counts exhaust every possible meaning of engagement.","trap":"Do not substitute a dictionary definition for the study's actual use of a term, or confuse potential beneficiaries with observed effects.","source":{"doc":"L2","pages":"8, 10–11"}},{"title":"4. Assess design and participant selection as choices","body":"The Methods section should give readers a structured account of design, participants or subjects, materials, collection, and analysis. The study-design slide recommends naming the major approach first—quantitative, qualitative, or mixed—then the specific design, such as correlational research or phenomenology. The sample description should identify who was studied, explain why that group was chosen, and describe the sampling technique. These details are relevant to whether the methods can address the research question, which is an explicit class appraisal task. Application beyond the slide wording: terms such as 'participants' and 'respondents' do not determine the methodological tradition; a quantitative trial can have participants. Also distinguish a data-collection instrument from a design. Naming a questionnaire or software package does not explain the investigation's overall logic.","example":"Application beyond the slide wording: 'Quantitative correlational study of first-year students selected from a course roster' identifies more of the design than 'we used a survey.' The full paper must still explain the actual selection procedure.","trap":"Do not accept the sample size as a complete sampling description. Check the selection rationale and mechanism as well as the number studied.","source":{"doc":"L2","pages":"12–14, 22"}},{"title":"5. Look for enough procedural detail to inspect the work","body":"The materials slide requests technical information about equipment and software, including versions and whether code is available. The data-collection slide asks for chronological steps, defined variables, measurements, and their frequency. New methods need detailed descriptions; established methods may be described briefly with appropriate citations. The analysis slide distinguishes quantitative statistical tools from the methods used to analyze qualitative data. Together, these components allow readers to connect the evidence to the procedures that produced it. Lecture 2 also distinguishes substantive generative-AI assistance from superficial editing and asks for disclosure where applicable. Application beyond the slide wording: actual disclosure obligations depend on the applicable venue or institution. Neither a software name nor the lecture's broad claim about content analysis establishes that a particular analytical method is automatically suitable.","example":"Application beyond the slide wording: 'We used software to analyze interviews' is incomplete. A stronger account identifies the software, describes how the material was analyzed, and explains the decisions readers need to understand.","trap":"Do not confuse naming tools with describing procedures, or treat one commonly taught qualitative method as mandatory for every qualitative study.","source":{"doc":"L2","pages":"15–17"}},{"title":"6. Keep observed findings distinct from their interpretation","body":"Lecture 2 asks Results sections to highlight important trends, relationships, and findings in a logical sequence. Tables and figures can make those patterns visible, but the writer still needs to explain what the displays show. The lecture says findings may support or challenge a hypothesis; an unexpected direction remains a result that should be reported. Discussion then interprets meaning rather than simply repeating the numbers. The slides acknowledge that expectations vary across disciplines and also present a combined Results and Discussion heading. Application beyond the slide wording: functional clarity is more important than assuming every publication uses identical section boundaries. Keep three statements separate: what was measured, what pattern was observed, and why that pattern might have occurred. Only the second is the empirical finding itself.","example":"Application beyond the slide wording: 'Group A averaged 12 minutes and Group B 15' reports a finding. 'Reduced navigation burden may explain the difference' is an interpretation requiring justification and consideration of alternatives.","trap":"Do not hide results that conflict with the prediction, and do not treat a figure as permission to make a stronger claim than the design supports.","source":{"doc":"L2","pages":"18–20"}},{"title":"7. Judge claims, contribution, limitations, and future work","body":"The Discussion should explain meaning and importance, position findings within relevant literature, acknowledge limitations, consider alternative explanations, identify real-world relevance, and explore future research. Lecture 2 warns against overinterpretation, unwarranted speculation, inflated importance, and erroneous conclusions. The class tasks also ask whether results directly support the authors' claims and what the paper contributes. Application beyond the slide wording: a result is an observation from the study; a contribution explains what the work adds to knowledge or methods; a limitation constrains interpretation; and future work proposes an investigation still to be done. These roles should remain distinct. A benchmark improvement can support a limited technical advance without establishing universal superiority. Likewise, a plausible application is not the same as demonstrated success in the application setting.","example":"Application beyond the slide wording: A model's lower error on one dataset is a result. A supported new modeling approach may be a contribution. Testing only one dataset is a limitation, and evaluation in other settings is future work.","trap":"Do not translate an association into a causal claim without justification, or turn proposed applications into findings that the study never measured.","source":{"doc":"L2","pages":"19–20, 22"}},{"title":"8. Build an article analysis around five checks","body":"The group task on the final slide provides a practical reading sequence. First identify the primary problem or question and the stated hypothesis or proposed concept. Next examine the tools, algorithms, architectures, or experimental setup and whether the methodology suits the question. Then compare the actual findings with the authors' claims. Check how the Discussion relates the work to prior literature and acknowledges limitations. Finally explain the primary contribution and a possible application or future direction. Page 21 illustrates IMRAD using a green-tea trial description with 200 participants and brief memory and attention findings. Application beyond the slide wording: that uncited teaching example does not provide enough information to verify a real trial, recover an explicit hypothesis, judge effect sizes, or make clinical recommendations.","example":"Application beyond the slide wording: For each of the five checks, record the relevant passage or figure, write your interpretation, and mark missing information explicitly. This keeps evidence, author claims, and your inference separate.","trap":"Do not fill gaps in a paper with confident guesses. 'Not reported in the material provided' is a precise finding when the needed information is absent.","source":{"doc":"L2","pages":"21–22"}}],"glossary":[{"term":"IMRAD","meaning":"Introduction, Methods, Results, and Discussion: a structure organized around purpose, procedure, findings, and interpretation."},{"term":"Background","meaning":"The issue and rationale situated in existing literature, with support for relevant claims."},{"term":"Research gap","meaning":"Application beyond the slide wording: a relevant unresolved or insufficiently addressed issue in existing knowledge."},{"term":"Research problem","meaning":"The difficulty or issue that motivates investigation; not a label restricted to quantitative research."},{"term":"Research question","meaning":"What the investigation seeks to answer; it may be used in quantitative, qualitative, or mixed-methods research."},{"term":"Objective","meaning":"The study's intended focus and accomplishment."},{"term":"Hypothesis","meaning":"An expected outcome or relationship stated as a prediction; distinguish an explicit author statement from a reader's inference."},{"term":"Proposed concept","meaning":"An idea, method, architecture, or approach advanced by the paper; it need not take the form of a predictive hypothesis."},{"term":"Framework","meaning":"The conceptual or theoretical organization that guides the study and connects its important ideas."},{"term":"Operational definition","meaning":"An explanation of how a term is used, defined, or measured in the particular study."},{"term":"Significance of the study","meaning":"Who may benefit from the work and the kind of benefit anticipated."},{"term":"Methods","meaning":"The account of the design, sample or subjects, materials, collection procedures, and analysis."},{"term":"Result","meaning":"A finding produced from the study's evidence, rather than a planned activity or an explanation of its meaning."},{"term":"Discussion","meaning":"Interpretation of findings, their relation to existing work, limitations, significance, and future directions."},{"term":"Contribution","meaning":"What the paper adds to its field, supported by the study's argument and evidence."},{"term":"Limitation","meaning":"A feature or constraint that restricts the interpretation, certainty, or scope of the findings."},{"term":"Future work","meaning":"A proposed next investigation, kept distinct from results already demonstrated."}],"corrections":[{"claim":"Problem statements belong only to quantitative research, and research questions only to qualitative research.","clarification":"Application beyond the slide wording: both approaches can describe research problems and ask research questions. The slide's naming convention should not be applied as a universal rule.","source":{"doc":"L2","pages":"9"}},{"claim":"Only qualitative studies can call their human subjects participants.","clarification":"Application beyond the slide wording: participant is also used in quantitative research. The lecture's own trial illustration uses it; classify the study using its design and evidence.","source":{"doc":"L2","pages":"14, 21"}},{"claim":"Content analysis is automatically the most common or best method for all qualitative studies.","clarification":"Application beyond the slide wording: qualitative analysis includes multiple traditions and methods. The suitable choice depends on the research question, approach, and evidence; the slide's broad wording is not a universal ranking or requirement.","source":{"doc":"L2","pages":"17"}},{"claim":"Every research article must state a predictive hypothesis.","clarification":"Application beyond the slide wording: the class task asks for a hypothesis or proposed concept. Report an absent explicit hypothesis honestly, and label any inferred expectation as inference.","source":{"doc":"L2","pages":"22"}},{"claim":"References must always be placed inside appendices, and introductions must always occupy exactly 10–15% of a paper.","clarification":"Application beyond the slide wording: these are slide-level formatting examples or guidelines. Follow the required format while preserving appropriate citation, purpose, context, and concision.","source":{"doc":"L2","pages":"3–4"}},{"claim":"A theory is authoritative simply because a renowned author developed it, and every framework must fit one diagram convention.","clarification":"Application beyond the slide wording: assess the framework's explanatory role and fit with the question. The slide's simplified descriptions of theories and quantitative versus qualitative diagrams are not universal definitions.","source":{"doc":"L2","pages":"8"}},{"claim":"The lecture's generative-AI disclosure exception applies to every journal and institution.","clarification":"Application beyond the slide wording: page 16 states classroom guidance and uses 'where applicable.' For an actual submission, consult the applicable venue's or institution's policy; do not assume the editing exception is universal.","source":{"doc":"L2","pages":"16"}},{"claim":"The green-tea example establishes a verified treatment effect or an explicit hypothesis.","clarification":"Application beyond the slide wording: the slide is an uncited IMRAD teaching illustration. It provides neither enough study detail for empirical appraisal nor an explicit hypothesis to quote.","source":{"doc":"L2","pages":"21"}}]},{"topic":"databases","title":"Academic databases: choose, search, verify","lead":"Choose databases by the question and evidence needed. Build transparent searches, check access separately from discovery, and preserve the choices needed to repeat the search.","sections":[{"title":"Choose by research question and coverage","body":"An academic database is a searchable collection of scholarly records, but databases differ in subject scope, material types, indexing, and tools. Begin by translating the research question into its main concepts and asking what evidence those concepts require: journal articles, conference papers, standards, education reports, clinical studies, books, or historical sources. A subject-focused source can offer more specialized indexing; a multidisciplinary source can help connect fields. Searching one system is rarely enough for a broad review because no database indexes everything. Choose sources that complement one another, and check the assignment or review protocol for required databases. The lecture introduces Scopus, Web of Science, PubMed, ERIC, IEEE Xplore, ScienceDirect, DOAJ, and JSTOR as different starting points, not as interchangeable rankings.","example":"For classroom assessment and anxiety, search ERIC for education literature and PubMed or PsycINFO for relevant health and psychology work; use Scopus or Web of Science to broaden and trace citations.","trap":"A database described as multidisciplinary does not guarantee complete coverage of every field.","source":{"doc":"L3","pages":"3–8"}},{"title":"Match databases to content and purpose","body":"Scopus and Web of Science are multidisciplinary citation-indexing services: they support discovery across publishers and provide citation connections and analysis tools. PubMed is a free biomedical and life-sciences search resource; its records are citations and abstracts, and its results may link to publisher full text or to PMC. ERIC is a free education-focused digital library with journal and non-journal records, a thesaurus, and record-level peer-review and full-text controls. IEEE Xplore is especially useful in engineering and computing and includes journals, conference publications, standards, and books. JSTOR is a digital library containing journals, books, primary sources, and other materials, particularly useful in humanities and social sciences. These are practical starting points; verify a database’s current scope and the item types it indexes.","example":"A computer-engineering review that needs conference proceedings and standards should include IEEE Xplore; a history project needing primary sources can add JSTOR.","trap":"“Best database” depends on the question and inclusion criteria, not a single universal ranking.","source":{"doc":"L3","pages":"10–23, 30–32"}},{"title":"Separate indexing from full-text access","body":"Finding a citation and reading the full paper are separate steps. Scopus records metadata and citations from many publishers; ScienceDirect is a publisher platform for full-text articles and books, primarily from Elsevier and hosted partners. A Scopus record can link to a paper whose full text is elsewhere or behind a subscription. PubMed can be searched freely without providing every article as free text; PMC is a distinct free archive for articles deposited or selected for inclusion. ERIC exposes full text for some records, while other records point to external sources. IEEE Xplore and JSTOR also combine items with different access conditions. Try your library sign-in, the record’s access links, and legitimate open versions. Do not treat an abstract, a search result, or an open-access label on a journal as proof that this particular paper is immediately downloadable.","example":"A PubMed citation without a “Free in PMC” link can still be a valid record; follow the publisher link or check library access.","trap":"Free searching does not mean universal free full-text access.","source":{"doc":"L3","pages":"10, 16, 19, 22, 25, 28–31"}},{"title":"Build Boolean concept blocks","body":"Break a question into concepts, list synonyms for each concept, and combine the groups deliberately. OR joins alternatives within a concept and generally broadens recall. AND connects distinct concepts and generally narrows results. NOT excludes a term, but can remove useful papers that mention that term in another population, comparison, or context. Parentheses make the intended groups visible, such as (adolescent OR teenager) AND anxiety. Search platforms may apply different operator precedence and may have different field rules, so the same string can return different sets. Test the query with a known relevant paper when possible, inspect the search translation or history, and revise one concept at a time. For systematic work, preserve the exact query and explain significant exclusions rather than relying on an undocumented chain of search edits.","example":"(battery OR accumulator) AND recycling requires the topic of recycling and either term for the battery concept.","trap":"Do not use NOT as a shortcut for a population filter unless you have checked the false-negative risk.","source":{"doc":"P3","pages":"4"}},{"title":"Use phrases, fields, and date limits carefully","body":"Quotation marks commonly request a phrase, but phrase indexing and automatic term mapping differ by database. A title, author, abstract, or publication field can make a search more precise, while also excluding records whose metadata is incomplete. Use the selected database’s advanced-search controls or documented field tags rather than assuming that a command works everywhere. Week 3 shows since:YYYY, intitle:, and author: in a sample query; these are not a portable syntax standard. Google Scholar documents an author: operator and offers title, author, and publication fields in Advanced Search. Its help describes date limiting through a “Since Year” control and date sorting; it does not present since:YYYY as a universal database command. Record which field or interface control you actually used.","example":"In Google Scholar, use Advanced Search to specify title and author fields, then choose a date range in the interface; in PubMed, use its own field tags and date filters.","trap":"A search example from one interface should not be copied unchanged into every database.","source":{"doc":"P3","pages":"4"}},{"title":"Trace citations and assess records","body":"Citation tracing complements keyword searching. Backward searching follows the reference list of a useful paper to earlier work; forward searching uses a “Cited by” feature or citation index to locate later papers that cite it. Related-article tools can suggest similar records, but their ranking is not a systematic search strategy by itself. A highly cited paper may be influential, old, disputed, or simply relevant to a different question; citation count is not a measure of truth or methodological quality. Verify publication details, study design, population, methods, and relevance. For journals or sources, confirm indexing status in the database provider’s current official title list and check coverage years. Keep the database name and search date because the indexed set, citation links, and counts can change as records are added and corrected.","example":"From a relevant review, inspect its references for earlier studies and run a forward cited-by search in a citation index for subsequent studies.","trap":"A paper’s high citation count does not prove that it should have been cited by every later article.","source":{"doc":"P3","pages":"1"}},{"title":"Keep the workflow and citations auditable","body":"For every search, save the database, search date, exact query, fields, filters, limits, and number of records retrieved. This makes the work easier to repeat and helps explain why records were included or excluded. A result count is a snapshot, not a permanent property: databases update, merge duplicates, and revise records. Export citations and abstracts into a reference manager to organize sources, deduplicate records, annotate decisions, and generate a bibliography. Verify imported authors, titles, dates, page ranges, DOI, and source before citing because exports can be incomplete or inconsistent. Search and citation tools help locate and organize evidence; they do not determine whether a study is trustworthy or whether a passage may be copied. Follow course, publisher, institutional, and legal guidance for quotation, attribution, licenses, and permissions.","example":"Save a dated log with separate Scopus and PubMed queries, then export records and check metadata before inserting citations.","trap":"A phrase match can flag text for review, but it cannot by itself prove plagiarism or copyright infringement.","source":{"doc":"L3","pages":"33–40"}}],"glossary":[{"term":"Bibliographic database","meaning":"A searchable collection of records describing publications; it may link to full text without containing every full text."},{"term":"Citation index","meaning":"A database that connects records through cited references and later citing works."},{"term":"Full text","meaning":"The complete article, chapter, report, or other work, rather than its citation or abstract."},{"term":"Subject-specific database","meaning":"A database focused on a discipline or domain, often with specialized indexing or vocabulary."},{"term":"Multidisciplinary database","meaning":"A database covering scholarly records across multiple fields."},{"term":"Controlled vocabulary","meaning":"A maintained set of subject terms used to describe and retrieve records, such as MeSH in PubMed or ERIC descriptors."},{"term":"Boolean operator","meaning":"A logical connector such as AND, OR, or NOT used to combine or exclude search concepts."},{"term":"Phrase search","meaning":"A search for words together as a phrase, commonly requested with quotation marks; exact behavior varies by system."},{"term":"Forward citation searching","meaning":"Finding later works that cite a selected paper."},{"term":"Reference manager","meaning":"Software that saves and organizes references and helps create in-text citations and bibliographies."},{"term":"Open access","meaning":"A form of access that makes a scholarly work freely readable under specified conditions; it does not itself establish study quality."}],"corrections":[{"claim":"Lecture 3 labels IEEE Xplore, ScienceDirect, and JSTOR access options as “free.”","clarification":"Treat “free” as an oversimplification. Searching or selected content may be free, while full text for other items can depend on subscriptions, licenses, or individual access; verify the specific record.","source":{"doc":"L3","pages":"22, 25, 31"}},{"claim":"Lecture 3 says any document found in DOAJ can be accessed free of charge.","clarification":"DOAJ indexes open-access journals and article records; it is a directory, not the host for every full text. Follow the article link and check its license and availability at the publisher or repository.","source":{"doc":"L3","pages":"27–29"}},{"claim":"Lecture 3 describes PubMed as free and says it provides publisher full-text links or free PMC PDFs.","clarification":"PubMed is free to search, but it does not contain full text for every citation. PMC is a separate archive, and publisher links may require payment or institutional access.","source":{"doc":"L3","pages":"16"}},{"claim":"Lecture 3 and its examples give fixed database record counts, including Scopus, Web of Science, PubMed, ERIC, IEEE Xplore, DOAJ, and JSTOR.","clarification":"Counts are time-sensitive and may refer to different record types, collections, or coverage definitions. Learn the database’s scope and selection method; verify current figures from the provider only when a count is genuinely needed.","source":{"doc":"L3","pages":"10–14, 16, 19, 22, 25, 28, 31–32"}},{"claim":"Week 3 gives since:YYYY, intitle:, and author: as one advanced query example.","clarification":"These operators are not portable across academic databases. Google Scholar documents author: and offers title/date controls in Advanced Search, but documents date limiting through its interface rather than a universal since:YYYY query command; use each platform’s official syntax and filters.","source":{"doc":"P3","pages":"4"}},{"claim":"Week 3 suggests that finding more than ten copied words in a phrase search may show copyright infringement.","clarification":"A phrase match can locate similar text but does not prove plagiarism or infringement. Attribution, quotation, permission, license, amount, purpose, and applicable institutional and legal standards require contextual review.","source":{"doc":"P3","pages":"2"}},{"claim":"The lecture presents Paperpile as a recommended reference manager.","clarification":"Paperpile is an example rather than a requirement. Any suitable reference manager can help organize and cite records, but imported metadata still needs checking and the software does not appraise study quality.","source":{"doc":"L3","pages":"33–34"}}]},{"topic":"design","title":"Research approaches and study design","lead":"Choose a design by the question it can answer and the claim it can support. These notes cover Lecture 4 and Week-4 Practice; labeled extensions clarify limits that the slides compress or overstate.","sections":[{"title":"Methodology, design, and methods","body":"A methodology explains the approach taken, what the researcher did, why those choices fit the question, and how the quality of the evidence can be evaluated. Methods are the specific procedures for collecting and analyzing data. A design is the overall arrangement that connects the question, participants or cases, procedures, and intended conclusions. This three-level distinction is a study framework clarifying the lecture's overlapping terminology. For example, a qualitative methodological rationale can support a case-study design using interviews and document analysis. The Methods section must still give enough information about participants, materials, and procedures for another researcher to understand and repeat the work. Naming an approach is only the beginning; the justification must explain what useful evidence that approach will produce.","example":"Question: How did one department implement a new system? Approach: qualitative; design: case study; collection: interviews and records; analysis: thematic interpretation.","trap":"A software package, questionnaire, or interview schedule is a tool or procedure; it does not by itself constitute a complete methodology.","source":{"doc":"L4","pages":"2–6"}},{"title":"Choose the approach from the knowledge sought","body":"Qualitative research is appropriate when the question concerns ideas, experiences, interpretations, and meanings. Quantitative research represents relevant characteristics numerically and uses statistical analysis to describe patterns or test relationships. Mixed methods brings qualitative and quantitative work together when both contribute to the research purpose. These choices do not replace other classifications. A study can also be applied or pure, descriptive or exploratory, and historical or focused on the present. The important task is to say what kind of knowledge is required and how the selected evidence answers the question. Extension beyond the slides: a numerical dataset is not automatically representative, and a qualitative account is not automatically unstructured. Sample adequacy, measurement, and analytic quality require separate justification for either approach.","example":"'How many students use the service?' suggests numerical estimation. 'What does using it mean to students?' suggests qualitative inquiry.","trap":"Do not choose quantitative research merely because numbers look objective, or qualitative research merely because the sample is small.","source":{"doc":"L4","pages":"7–12"}},{"title":"Descriptive, correlational, and experimental questions","body":"Descriptive research documents a situation as it is, without deliberately changing the process being studied. A correlational study examines whether variables vary together and how strong that relationship is. Practice 4 gives correlation coefficients from minus one to plus one: the sign indicates direction, while magnitude indicates strength within the relevant correlation framework. An experimental study introduces or varies an intervention and measures an outcome. These are different inferential tasks. A description establishes what was observed; an association establishes a relationship in the data; a credible experimental comparison can support a causal interpretation. The terminology in the slides sometimes overlaps, especially when descriptive studies include correlations. Focus on what the researcher actually manipulates, measures, compares, and concludes rather than relying only on a design label.","example":"Profiling commute times is descriptive; relating commute time to attendance is correlational; assigning transport support and comparing attendance is experimental.","trap":"A strong negative correlation is a strong inverse association, not a weak relationship or an automatic causal effect.","source":{"doc":"P4","pages":"15–18"}},{"title":"Causal inference needs a credible comparison","body":"An experiment varies an independent variable and measures a dependent variable, with attention to other influences on the outcome. Practice 4 mentions randomized assignment as a feature often used in experiments. Extension beyond the slides: random assignment allocates recruited participants to conditions and supports comparability between those conditions; random sampling selects people from a target population and supports population inference. Neither procedure guarantees every aspect of validity. A confounding problem occurs when the treatment comparison also differs on another cause of the outcome. Existing groups may therefore differ even when the treatment has no effect. The causal-comparative slide should be read cautiously: comparing experience groups or applying a statistical test does not itself establish that experience caused the observed outcome difference.","example":"If only experienced teachers use a new method, teacher experience offers an alternative explanation for higher scores.","trap":"The words 'independent variable,' 'effect,' or 'significant' do not turn an observational comparison into an experiment.","source":{"doc":"P4","pages":"16–18"}},{"title":"Narrative, phenomenology, and grounded theory","body":"Narrative inquiry examines individuals' stories, including the sequence of events, characters, and changes across a life. Phenomenology investigates how people understand and experience a phenomenon, with attention to the meaning of those experiences. Grounded theory aims to develop an abstract explanation of a process from participants' actions, interactions, and perspectives. All three may use interviews, so the instrument alone cannot identify the strategy. Ask what the final account is intended to explain: a life story, lived meaning, or a theory of a process. Methodological clarification beyond the wording of the slides: grounded theory does not require literal absence of prior knowledge. Its emphasis on emergence means remaining open to what the data supports and examining assumptions instead of forcing all evidence into a fixed prior explanation.","example":"A nurse's career story suggests narrative inquiry; the meaning of caring for dying patients suggests phenomenology; a model of how nurses negotiate responsibilities suggests grounded theory.","trap":"A two-hour interview is not automatically phenomenology, and using codes is not enough to make a study grounded theory.","source":{"doc":"P4","pages":"7–9"}},{"title":"Ethnography, case study, and content analysis","body":"Ethnography investigates a culture-sharing group's practices and meanings through prolonged engagement, often combining observation with formal or informal interviews. A case study examines a particular issue, event, group, or context in depth, seeking patterns and lessons that may connect to theory. Content analysis systematically examines communication materials, such as books, films, or newspapers, for patterns, themes, and bias. These approaches differ primarily in their focus: shared culture, a specific contextual case, or a body of material. The practice slides present them as qualitative strategies, while Lecture 4 also notes that case studies and content analysis can use numerical evidence. Therefore, distinguish the object of inquiry from the form of data. The strongest design choice explains why the selected strategy fits the actual question.","example":"Team rituals suggest ethnography; one failed rollout suggests a case study; recurring portrayals in news articles suggest content analysis.","trap":"A case study is not defined simply by being small, and collecting documents does not automatically make a project ethnography.","source":{"doc":"P4","pages":"10–12"}},{"title":"Sequential mixed methods: either order is possible","body":"Practice 4 shows two sequential patterns. Quantitative collection and analysis can come first, followed by qualitative collection and analysis. Alternatively, qualitative collection and analysis can precede a quantitative phase. The ordering should have a reason. A numerical finding may identify people or issues that need deeper explanation, or qualitative findings may help develop relevant categories and questions for a later survey. These applications explain the diagram rather than add mandatory steps to every project. Extension beyond the slides: the phases should be connected explicitly so that one informs the other and the final interpretation addresses a shared research problem. Simply placing an unrelated interview study after a survey does not explain the value of the sequence. Timing describes when the phases occur; justification explains why.","example":"Survey scores reveal a surprising decline; follow-up interviews investigate how participants explain it. In the reverse sequence, interviews generate categories for a later questionnaire.","trap":"Sequential mixed methods does not mean that quantitative data must always be collected first.","source":{"doc":"P4","pages":"20–21"}},{"title":"Concurrent mixed methods: timing, priority, and integration","body":"In the concurrent diagram, quantitative and qualitative work occurs during the same broad study period. Each strand produces its own evidence, and the results are compared. Practice 4 allows the two strands to have equal emphasis or one to be dominant. Equal priority does not imply equal sample sizes, identical instruments, or equal numbers of pages in a report. Extension beyond the slides: specify the point of integration and explain how agreement, complementary findings, or disagreement will affect the overall interpretation. A study can compare survey estimates with interview explanations or use a supporting strand to clarify the main findings. Collecting two instruments of the same type is not automatically mixed methods, and collecting numbers and words without connecting them does not supply a coherent mixed-method rationale.","example":"During one semester, collect satisfaction ratings and interviews, then compare the numerical pattern with participants' explanations of it.","trap":"Concurrent describes the timing of the strands; dominant describes their relative emphasis. These are different design decisions.","source":{"doc":"P4","pages":"20–22"}}],"glossary":[{"term":"Methodology","meaning":"The explanation and justification of the approach, procedures, and quality decisions used in research."},{"term":"Research design","meaning":"The overall arrangement linking a question to evidence and defensible conclusions."},{"term":"Method","meaning":"A specific procedure for collecting or analyzing data."},{"term":"Descriptive research","meaning":"Research that documents a subject or situation without deliberately intervening."},{"term":"Correlational research","meaning":"Research examining whether and how strongly variables are associated."},{"term":"Experimental research","meaning":"Research that systematically varies an intervention and measures outcomes, with attention to alternative explanations."},{"term":"Narrative inquiry","meaning":"Inquiry centered on individuals' stories, sequences of events, and changes over time."},{"term":"Phenomenology","meaning":"Inquiry centered on the meaning of lived experiences."},{"term":"Grounded theory","meaning":"An approach developing theory of processes or interactions from systematically examined data."},{"term":"Ethnography","meaning":"The study and interpretation of a culture-sharing group's practices and meanings."},{"term":"Case study","meaning":"An in-depth investigation of a specific case in its context, potentially using several types of evidence."},{"term":"Content analysis","meaning":"Systematic examination of communication material for meanings, patterns, or frequencies."},{"term":"Sequential mixed methods","meaning":"Qualitative and quantitative strands carried out in an ordered sequence."},{"term":"Concurrent mixed methods","meaning":"Qualitative and quantitative strands conducted during the same broad period."},{"term":"Integration","meaning":"An explicit connection between strands that contributes to a shared research interpretation; this is a clarification beyond the slide definition."},{"term":"Random assignment","meaning":"Allocation of recruited participants to study conditions; different from sampling people from a population."}],"corrections":[{"claim":"Grounded theory requires starting with literally no initial understanding.","clarification":"Practice 4 page 9 overstates the emergent character of grounded theory. The methodological clarification is to examine assumptions and remain open to data, not to pretend researchers have no prior knowledge.","source":{"doc":"P4","pages":"9"}},{"claim":"A causal-comparative group difference establishes cause and effect.","clarification":"Practice 4 page 18 uses causal language too strongly. Without adequate control of alternative explanations, pre-existing group differences and statistical tests do not establish a causal effect.","source":{"doc":"P4","pages":"18"}},{"claim":"A larger quantitative sample necessarily represents the population.","clarification":"The table on Practice 4 page 19 overgeneralizes. Population claims depend on selection, coverage, participation, measurement, and context; numerical format and size alone do not supply representativeness.","source":{"doc":"P4","pages":"19"}},{"claim":"Mixed methods means using any two instruments.","clarification":"The slides combine qualitative and quantitative approaches and illustrate result comparison. An explicit integration rationale is a methodological extension: the strands should jointly address the problem rather than merely coexist.","source":{"doc":"P4","pages":"20–22"}},{"claim":"Random assignment and random sampling are interchangeable.","clarification":"The experimental slide mentions randomized assignment. The sampling-versus-assignment distinction is an extension: assignment concerns study conditions; sampling concerns entry into the study and population inference.","source":{"doc":"P4","pages":"16"}}]},{"topic":"collection","title":"Collecting, analyzing, and evaluating evidence","lead":"Match the source, instrument, recording procedure, and analysis to the research question. The slides provide the core choices; labeled extensions explain common threats to the claims made from the resulting data.","sections":[{"title":"Primary and secondary data are about provenance","body":"Primary data is original information collected for the research question through procedures such as surveys, interviews, observations, or experiments. Secondary data already exists because another researcher or organization collected it. Reanalyzing an existing dataset with a new question does not make its collection primary for the current analyst. Primary collection can be tailored to the question and gives more control over sampling and measurement, but usually requires time, money, and relevant training. Secondary sources can provide broad geographical coverage or long historical records more quickly, but the current researcher does not control how they were generated. The choice should therefore consider relevance, quality, coverage, and available resources. Newness of the question and newness of the dataset are separate issues.","example":"New interviews conducted for your project are primary. A downloaded census used to investigate a new trend is secondary.","trap":"Analyzing data yourself is not the same as collecting it yourself.","source":{"doc":"L4","pages":"13–14"}},{"title":"Match collection methods to the evidence needed","body":"Lecture 4 links surveys to population characteristics, interviews and focus groups to depth, observation to behavior in natural settings, and literature reviews to existing knowledge and trends. Case studies may combine several of these sources for a focused contextual inquiry. Treat the table as typical uses rather than rigid restrictions. Observation can produce numerical counts or descriptive accounts, and survey responses may be examined for frequencies or meanings. Extension beyond the slides: a focus group is especially useful when interaction and discussion among participants matter, while an interview can allow more private individual exploration. Choosing an instrument requires a clear account of what it will reveal. A convenient method is not sufficient if the resulting evidence fails to answer the question.","example":"Use observations to record interruptions as they occur, interviews to explore their perceived meaning, and a suitable survey to estimate how widespread reported experiences are.","trap":"The method name does not uniquely determine whether the data is qualitative or quantitative.","source":{"doc":"L4","pages":"17, 19"}},{"title":"Record carefully before interpreting","body":"Practice 4 presents qualitative work as collection, recording, and analysis with interpretation. A recording protocol can include the date, place, participant identification, instructions, introductory questions, main questions, probes, and closing statements. It distinguishes descriptive notes from reflective notes. Descriptive notes document events, dialogue, people, and setting; reflective notes record the researcher's thoughts and possible interpretations. Audio or video can also support recording. Once collected, the material must be prepared for the chosen analysis, with coding used to identify patterns and descriptions. Those patterns then need to be related and interpreted. Extension beyond the slides: keep an observable event separate from an inferred motive, and use neutral probes that ask participants to elaborate without feeding them the expected answer.","example":"Descriptive: 'The participant paused for ten seconds.' Reflective: 'The question may have been uncomfortable.' The second is an interpretation to examine.","trap":"A transcript or collection of quotations is recorded material; it is not yet a fully developed analysis.","source":{"doc":"P4","pages":"4–6"}},{"title":"Choose an analysis that answers the question","body":"Analysis depends on the type of evidence and how it is prepared. Statistical analysis can summarize frequencies, averages, and relationships in numerical data. Thematic analysis interprets patterns of meaning in interviews, focus groups, and other textual sources. Content analysis can examine either frequencies, such as the number of mentions of an issue, or meanings, such as how that issue is portrayed. Meta-analysis statistically combines resu
