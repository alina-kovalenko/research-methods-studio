at is the most defensible reason to search DOAJ for a freely available article?","options":["Every result has passed the same peer-review standard and is therefore methodologically sound","DOAJ indexes open-access journals and article records, helping locate open content; article quality still needs appraisal","DOAJ provides full text for all scholarly articles in all disciplines","DOAJ is a subscription citation index that calculates author h-index"],"answer":1,"explanation":"DOAJ is an open-access journal directory and searchable article index. Inclusion and open availability do not replace appraisal of a specific study’s methods, relevance, or journal information.","distractors":["Open access and methodological quality are separate attributes.","Correct: it is useful for discovery of OA material, followed by critical appraisal.","Its scope is not all scholarly articles, and it is not a universal full-text repository.","Those functions do not describe DOAJ."],"source":{"doc":"L3","pages":"27–29"},"concept":"DOAJ"},{"id":"b10","topic":"databases","difficulty":"challenge","prompt":"Which comparison between Scopus and ScienceDirect is accurate?","options":["Both are the same full-text database; Scopus is simply the free interface","ScienceDirect is the curated multidisciplinary citation index, while Scopus is Elsevier’s journal website","Scopus primarily indexes metadata and citations across publishers; ScienceDirect hosts full-text articles and books, mainly from Elsevier and partners","Scopus indexes only Elsevier publications, while ScienceDirect indexes all scholarly publishers"],"answer":2,"explanation":"Elsevier distinguishes Scopus, which indexes metadata and citation information across thousands of publishers, from ScienceDirect, which contains full-text journal and book content primarily published by Elsevier. Their coverage and access models are not identical.","distractors":["The two are related but distinct databases and platform functions.","The roles are reversed.","Correct: this is the key distinction documented by Elsevier.","Scopus is multi-publisher; ScienceDirect is not an all-publisher index."],"source":{"doc":"L3","pages":"10,24–26"},"concept":"Scopus_vs_ScienceDirect"},{"id":"b11","topic":"databases","difficulty":"core","prompt":"A search result is visible on a commercial platform, but its PDF shows a subscription prompt. What is the sound conclusion?","options":["The database is not free to search, so the record must be removed","The article is open access because the abstract is visible","The record was found, but this account lacks full-text entitlement for that item; try library access, an OA version, or interlibrary support","Only the original author can read the article"],"answer":2,"explanation":"Discovery interfaces can show metadata and abstracts even when full text is restricted. Check institutional access and legitimate open versions separately from whether the database permits searching.","distractors":["Search access and full-text entitlement are different; a paywall does not invalidate the record.","An abstract is not proof that the article is open access.","Correct: this treats discovery and reading as separate tasks.","Access depends on license, institution, and publisher terms, not authorship alone."],"source":{"doc":"L3","pages":"10,13,16,25,31"},"concept":"access_vs_discovery"},{"id":"b12","topic":"databases","difficulty":"core","prompt":"In a query, what does AND normally do?","options":["Narrows results to records containing both concepts","Broadens results to include records containing either concept","Excludes records containing the second concept","Searches only article titles"],"answer":0,"explanation":"AND combines concepts so that retrieved records must satisfy both conditions in the database’s search logic. It usually narrows results, though exact behavior depends on the platform and fields searched.","distractors":["Correct: AND requires both concepts.","OR is the usual operator for including either concept.","NOT or AND NOT expresses exclusion.","Title restriction requires a field control or field-specific syntax."],"source":{"doc":"P3","pages":"4"},"concept":"Boolean_AND"},{"id":"b13","topic":"databases","difficulty":"core","prompt":"You want articles using either “adolescent” or “teenager,” and also about anxiety. Which structure best expresses the concept groups?","options":["adolescent AND teenager AND anxiety","(adolescent OR teenager) AND anxiety","adolescent NOT teenager OR anxiety","adolescent AND (teenager OR anxiety)"],"answer":1,"explanation":"OR joins synonyms within one concept group, while AND connects that group to a second concept. Parentheses make the intended grouping explicit and prevent platform-specific precedence from changing the meaning.","distractors":["This requires both near-synonyms and may be overly restrictive.","Correct: either synonym is acceptable, and anxiety is required.","This mixes exclusion and alternatives in a way that does not express the concept groups.","This requires adolescent and either a synonym or anxiety, rather than either synonym plus anxiety."],"source":{"doc":"P3","pages":"4"},"concept":"Boolean_grouping"},{"id":"b14","topic":"databases","difficulty":"challenge","prompt":"A carefully designed search uses NOT to remove “adults” from “adolescent treatment.” What is the main risk?","options":["NOT can remove relevant studies that mention adults in a comparison group or abstract","NOT automatically searches reference lists","NOT converts the query into an exact phrase","NOT guarantees that all retrieved items are about adolescents only"],"answer":0,"explanation":"An exclusion operator acts on the searched record or fields and may remove a relevant paper merely because it mentions the excluded term. Prefer a positive, well-defined age filter when the database provides one, and test exclusions against known relevant records.","distractors":["Correct: exclusions can cause false negatives.","Reference-list searching is citation chaining, not the function of NOT.","Quotation marks or a phrase field control phrase searching.","NOT does not validate the remaining records or guarantee a precise population."],"source":{"doc":"P3","pages":"4"},"concept":"Boolean_exclusion"},{"id":"b15","topic":"databases","difficulty":"applied","prompt":"A paper uses an unfamiliar technical term and refers to a standard experimental procedure without explaining either. Which source strategy best follows Week 3 Task 3?","options":["Consult a relevant textbook, published standard, or reference book for the term and procedure","Infer the definitions only from the paper title and its citation count","Treat the first search-result snippet as the complete authoritative procedure","Use the term's most frequent meaning on social media without checking the discipline"],"answer":0,"explanation":"Week 3 Task 3 asks students to identify at least three technical terms and one experimental method, then find definitions in a textbook, published standard, or reference book. The task calls for an appropriate disciplinary source rather than an inference from popularity or an isolated search snippet.","distractors":["Correct: these are the source types specified for definitions and standard research methods in the practice task.","A title and citation count do not define a technical term or explain a standard procedure.","A search snippet may omit qualifications, procedural details, or the source context.","Popular usage may differ from a technical meaning in the discipline."],"source":{"doc":"P3","pages":"3"},"concept":"authoritative_definitions"},{"id":"b16","topic":"databases","difficulty":"core","prompt":"What is the intended purpose of quotation marks around a multiword phrase such as “energy storage”?","options":["To exclude every result with the word energy","To ask the search system to look for the phrase as a unit, subject to that system’s rules","To search only the cited references of a record","To guarantee that only peer-reviewed articles are returned"],"answer":1,"explanation":"Quotation marks commonly request phrase searching, which can improve precision when word order matters. Phrase indexing and automatic mapping vary by platform, so verify the search translation or test a known relevant record.","distractors":["A minus or NOT operation expresses exclusion.","Correct: quotes signal a phrase search in many systems.","Citation search is a separate feature.","Peer-review status requires a filter or record-level verification."],"source":{"doc":"P3","pages":"1–2,4"},"concept":"phrase_search"},{"id":"b17","topic":"databases","difficulty":"applied","prompt":"A student enters since:2020 into several databases because Week 3 shows it in an example query. What is the best correction?","options":["Keep it unchanged because since:YYYY is a universal database standard","Replace it with author:2020 in all databases","Use each database’s publication-date filter; Google Scholar documents a “Since Year” interface control, not a portable query operator","Remove the date restriction because academic databases cannot limit by date"],"answer":2,"explanation":"The practice sheet demonstrates since:YYYY as a search-query example, but search syntax is platform-specific. Google Scholar documents date limits through a “Since Year” control and advanced search; researchers should record the actual interface or syntax used for each source.","distractors":["Date syntax is not universal and may not be parsed as a date limit.","An author field does not represent a publication year.","Correct: use the interface control or verified database syntax and document it.","Date filters are commonly available, though implementation differs."],"source":{"doc":"P3","pages":"4"},"concept":"date_filter_portability"},{"id":"b18","topic":"databases","difficulty":"applied","prompt":"A student wants papers by a known author in Google Scholar. Which approach is explicitly supported in Scholar’s help?","options":["since:\"D Knuth\"","intitle:\"D Knuth\"","NOT author:\"D Knuth\"","author:\"D Knuth\""],"answer":3,"explanation":"Google Scholar documents the author: operator for author searching. Author names can be ambiguous or formatted differently, so cross-check the target author’s profile and the paper metadata.","distractors":["This is not the documented author-search syntax. Use the date controls for publication-date limits.","The title field would search paper titles; it does not identify an author.","This introduces an intended exclusion rather than the documented positive author query; do not assume Scholar interprets NOT as a Boolean operator.","Correct: this is the documented Scholar author operator."],"source":{"doc":"P3","pages":"4"},"concept":"author_search"},{"id":"b19","topic":"databases","difficulty":"challenge","prompt":"Week 3 suggests intitle:\"energy density\" in an example query. Which guidance is safest for a Google Scholar search?","options":["Assume intitle syntax works identically in Scholar and every database","Use Scholar’s advanced-search title field or a documented database title field; do not assume intitle is portable","Put author names in quotation marks and use them as a title filter","Avoid title searching because databases do not index titles"],"answer":1,"explanation":"Scholar help documents title searching through its advanced-search fields and shows quotation marks for a paper-title phrase; it does not establish intitle: as portable database syntax. Field labels and query syntax should be checked in the chosen platform.","distractors":["Search syntax differs by system, and this syntax is not a universal standard.","Correct: use the platform’s documented title control or syntax.","Author and title fields represent different metadata.","Titles are commonly searchable fields."],"source":{"doc":"P3","pages":"4"},"concept":"title_field_portability"},{"id":"b20","topic":"databases","difficulty":"applied","prompt":"What makes a database search reproducible enough for a class report or review?","options":["Save only the first page of results because search engines preserve it","Use the same typed string everywhere without checking field behavior","Record only the final number of results","Record each database, exact query, fields, filters, search date, and any limits applied"],"answer":3,"explanation":"A reproducible search record preserves the database and the actual search choices that produced the set, including query, fields, dates, and filters. Result counts can change as databases update, so the exact search and search date are more useful than a count alone.","distractors":["A result page alone may be transient and does not record how it was produced.","The same string can behave differently across platforms.","A count cannot reconstruct the query or filters.","Correct: this records the decisions needed to rerun or audit a search."],"source":{"doc":"P3","pages":"4"},"concept":"reproducibility"},{"id":"b21","topic":"databases","difficulty":"applied","prompt":"A research question concerns interventions published from 2019 through 2024. Which workflow is most defensible?","options":["Type 2019–2024 into the search box and assume it filters publication years","Use the database’s upload date because it is always the publication date","Exclude all undated results automatically without documenting the choice","Use the database’s publication-date range, verify the date field and boundary behavior, then record the selected range"],"answer":3,"explanation":"Date filters may refer to publication year, online publication date, record-added date, or another field. Choose the field that matches the research question, inspect the platform’s behavior, and report the limits and treatment of records with missing dates.","distractors":["A number range in free text does not reliably express a date filter.","Upload or indexing dates can differ from publication dates.","Exclusion is a methodological choice that should be justified and documented.","Correct: check the field and document how the range is applied."],"source":{"doc":"P3","pages":"4"},"concept":"date_filter"},{"id":"b22","topic":"databases","difficulty":"core","prompt":"Which technique best helps move from a useful article to earlier and later related literature?","options":["Follow the article’s reference list backward and use “Cited by” or citation indexes forward","Replace database searching with a paper’s abstract","Search only the journal’s latest issue","Use an h-index as the search query"],"answer":0,"explanation":"Backward citation searching examines the cited references; forward citation searching finds later records that cite the paper. These methods complement keyword and subject searching, but cited-by coverage varies by database.","distractors":["Correct: this combines backward and forward citation tracing.","An abstract summarizes one paper and does not trace its citation network.","A latest issue is a narrow publication browse, not citation chaining.","An h-index is a metric, not a query for related literature."],"source":{"doc":"P3","pages":"1"},"concept":"citation_tracing"},{"id":"b23","topic":"databases","difficulty":"challenge","prompt":"The most cited article in a search result predates a newer study but is not cited by it. What should the researcher conclude?","options":["It must have been mistakenly omitted from the newer paper","Its citation count proves it is methodologically superior and should have been cited","Check its relevance, methods, date, and the newer paper’s scope; citation count alone cannot establish that it should be cited","Cited-by links prove the older article is correct"],"answer":2,"explanation":"Citation counts measure citations in a particular index and time window; they do not prove quality, truth, or relevance to every study. The citation-comparison task in Week 3 is a prompt for critical comparison, not a rule that every highly cited earlier work belongs in every reference list.","distractors":["Noncitation alone does not prove an omission or error.","A metric cannot establish methodological superiority or relevance.","Correct: assess relevance and evidence in context.","Citations document scholarly linkage, not correctness."],"source":{"doc":"P3","pages":"1"},"concept":"citation_interpretation"},{"id":"b24","topic":"databases","difficulty":"applied","prompt":"Extension beyond the slides: two researchers named \"A. Kim\" appear in a citation database. What is the strongest way to disambiguate their records?","options":["Treat all records with the same displayed name as one author","Check affiliations, coauthors, subject areas, identifiers, and the author’s verified profile","Choose the profile with the higher h-index without checking publications","Use the most recent paper only"],"answer":1,"explanation":"Extension beyond the slides: names alone are often insufficient to identify an author. Compare affiliations, coauthors, topics, identifiers, and the author's own publication list, because profiles can contain missing or misattributed records (official Scopus help: https://www.elsevier.support/scopus/answer/what-is-the-scopus-author-identifier).","distractors":["Name collisions and name variants make this unreliable.","Correct: multiple independent signals support identity resolution.","An h-index cannot establish identity and may include erroneous records.","One paper is rarely enough to identify an entire author record."],"source":{"doc":"L3","pages":"10","url":"https://www.elsevier.support/scopus/answer/what-is-the-scopus-author-identifier"},"concept":"author_profiles"},{"id":"b25","topic":"databases","difficulty":"challenge","prompt":"Extension beyond the slides: a PubMed search for a biomedical concept misses papers using a recognized synonym. What is a strong next step?","options":["Remove all concept terms and search only by year","Assume the missing studies are not indexed","Use ERIC descriptors because all databases share the same thesaurus","Inspect PubMed’s search translation and consider MeSH plus text-word synonyms, while recording the strategy"],"answer":3,"explanation":"Extension beyond the slides: PubMed uses Automatic Term Mapping and MeSH, while field tags and quoted phrases can change mapping behavior. Inspect Search Details and consider controlled vocabulary plus text-word variants to improve recall, using the official PubMed guide: https://pubmed.ncbi.nlm.nih.gov/help/.","distractors":["A date-only search discards the research concept.","A failed query does not prove a study is absent from the database.","Subject vocabularies are database-specific and not interchangeable.","Correct: check the platform’s translation and combine appropriate controlled and natural-language terms."],"source":{"doc":"L3","pages":"16","url":"https://pubmed.ncbi.nlm.nih.gov/help/"},"concept":"controlled_vocabulary"},{"id":"b26","topic":"databases","difficulty":"core","prompt":"What is the main role of a reference manager such as the one recommended in Lecture 3?","options":["Replace database searching and evaluate every study automatically","Save, organize, and format references and help insert citations into writing","Guarantee every imported reference is accurate and complete","Grant access to publisher subscription articles"],"answer":1,"explanation":"A reference manager helps collect and organize bibliographic records and create citations and bibliographies. Researchers still need to verify imported metadata and choose an appropriate citation style; the tool does not provide research appraisal or access rights by itself.","distractors":["It supports workflow but does not replace search strategy or appraisal.","Correct: reference collection, organization, and citation are core functions.","Import errors and incomplete metadata can occur, so verification remains necessary.","A reference manager does not grant licenses."],"source":{"doc":"L3","pages":"33–34"},"concept":"reference_managers"},{"id":"b27","topic":"databases","difficulty":"applied","prompt":"A search on “renewable energy storage” returns few results. Which revision is most likely to broaden recall without abandoning the topic?","options":["Add synonyms with OR inside a group, then combine that group with a second concept using AND","Add every new term with AND","Use NOT to remove the phrase renewable energy","Limit to one author before checking synonyms"],"answer":0,"explanation":"Synonyms and alternate phrases joined with OR make a concept group more inclusive; AND then connects separate concepts. Test the revised query in the platform and review whether known relevant papers appear.","distractors":["Correct: this expands the synonym group while retaining the second concept.","Adding all terms with AND usually narrows retrieval.","NOT excludes rather than broadens results.","An early author limit can remove relevant work before the strategy is developed."],"source":{"doc":"P3","pages":"4"},"concept":"query_expansion"},{"id":"b28","topic":"databases","difficulty":"challenge","prompt":"Extension beyond the slides: before deciding that a journal is indexed in Scopus or Web of Science, what is the best verification step?","options":["Trust the journal’s own “indexed in” logo without checking dates","Search the journal title in Google Scholar and infer inclusion","Assume indexing in one database means indexing in the other","Check the current official source list or Master Journal List and confirm the title and coverage years"],"answer":3,"explanation":"Extension beyond the slides: indexing can begin or end and may cover only part of a journal's history. Check the provider's official title records and the relevant article year, using the Scopus source-list guidance at https://www.elsevier.com/products/scopus and Clarivate's Master Journal List at https://mjl.clarivate.com/.","distractors":["Publisher claims can be incomplete or outdated and need independent confirmation.","Scholar discovery does not prove inclusion in Scopus or Web of Science.","These are separate services with separate selection and coverage.","Correct: official index lists and coverage dates are the relevant evidence."],"source":{"doc":"L3","pages":"10,13","url":"https://www.elsevier.com/products/scopus"},"concept":"index_verification"},{"id":"b29","topic":"databases","difficulty":"applied","prompt":"A student filters an article directory to open-access journals and finds a relevant record. What remains to check?","options":["Nothing: open access means the article is peer reviewed and its findings are reliable","Whether the database will provide a citation count over 100","Whether the specific article is available, the journal and publication details, and whether the study is methodologically sound","Whether the record is indexed in every multidisciplinary database"],"answer":2,"explanation":"Open access describes a route to reading, not a guarantee of peer review, sound methods, or relevance. Verify the article and journal details, then appraise the evidence according to the research question.","distractors":["Open access is not a proxy for peer review or research quality.","Citation thresholds are arbitrary and cannot replace appraisal.","Correct: access, publication status, and evidence quality are separate checks.","Indexing in one resource does not imply inclusion elsewhere."],"source":{"doc":"L3","pages":"27–29"},"concept":"critical_appraisal"},{"id":"b30","topic":"databases","difficulty":"challenge","prompt":"Week 3 suggests pasting more than ten words from an article into a search engine and treating a matching result as possible infringement. What is the careful interpretation?","options":["A phrase search may locate similar text, but deciding plagiarism or infringement requires context, attribution, permission, and applicable rules","A phrase match alone establishes plagiarism and copyright infringement","Any quotation longer than ten words is automatically unlawful","A search engine can determine whether an author had permission"],"answer":0,"explanation":"Exact-phrase searching can identify text that merits closer review, but matching words alone do not establish misconduct or a legal violation. Quotation, attribution, license, amount, purpose, and applicable institutional and legal standards matter; the task should be used as a caution about copying, not as a verdict.","distractors":["Correct: a phrase match is a lead for contextual review, not proof of misconduct or infringement.","A text match alone does not establish plagiarism or infringement; context and applicable rules must be examined.","There is no universal ten-word rule that automatically decides legality.","A search engine cannot know the permissions or context of a use."],"source":{"doc":"P3","pages":"2"},"concept":"text_match_ethics"},{"id":"d01","topic":"design","difficulty":"applied","prompt":"A proposal justifies a qualitative approach, plans an in-depth study of one hospital, and specifies semi-structured interviews. Which mapping best distinguishes these decisions?","options":["Methodology: qualitative rationale; design: interview questions; method: hospital setting.","Methodology: case study; design: interviews; method: qualitative rationale.","Methodology: interviews; design: qualitative rationale; method: case study.","Methodology: qualitative rationale; design: case study; method: interviews."],"answer":3,"explanation":"Lecture 4 separates specific procedures from the explanation of how and why they were chosen. Practice 4 asks students to choose a design within an approach and justify its fit; this three-level mapping is a clarifying study framework.","distractors":["Interview questions belong to an instrument, and the setting alone is not a research method.","This reverses the study structure and the procedure and treats a rationale as a collection technique.","Interviews are a concrete method, while the rationale explains the methodological choice.","Correct: the rationale, overall study structure, and concrete data-collection procedure occupy different levels."],"source":{"doc":"L4","pages":"2–6"},"concept":"Methodology, design, and methods"},{"id":"d02","topic":"design","difficulty":"core","prompt":"Which addition most directly improves a Methods section that only says, 'We interviewed students and analyzed the responses'?","options":["Participant selection, interview procedure, materials, and analysis steps.","A list of possible policy benefits of the findings.","A statement that the findings agreed with expectations.","A longer account of why student wellbeing matters."],"answer":0,"explanation":"Lecture 4 says the Methods section should describe participants, design, materials, and procedures in enough detail for another researcher to duplicate the research. A broad method label alone is insufficient.","distractors":["Correct: these details help another researcher understand and reproduce the procedure.","Potential benefits do not specify participants, materials, or procedures.","This reports a result and does not provide procedural detail.","This strengthens the introduction but does not explain what the researchers actually did."],"source":{"doc":"L4","pages":"2"},"concept":"Replicable methods"},{"id":"d03","topic":"design","difficulty":"applied","prompt":"A researcher wants to understand how first-year students interpret the experience of leaving home. Which approach best fits this stated aim?","options":["Quantitative measurement of how many students left home.","Qualitative inquiry into students' accounts and meanings.","An experiment assigning students to leave or remain at home.","A numerical ranking of universities by enrollment size."],"answer":1,"explanation":"Lecture 4 recommends qualitative data for questions about experiences, ideas, and meanings. The approach should follow the kind of knowledge sought, rather than the availability of convenient numerical measures.","distractors":["This measures prevalence but does not directly answer how students interpret the experience.","Correct: the question concerns interpretation and lived meaning.","Manipulating residence would address an intervention effect rather than the stated interpretive question.","University size does not operationalize students' meanings or experiences."],"source":{"doc":"L4","pages":"10–11"},"concept":"Choosing an approach"},{"id":"d04","topic":"design","difficulty":"core","prompt":"Practice 4 classifies research by application, objectives, sought information, and time. Which description is internally compatible with that diagram?","options":["An applied study must be qualitative because it concerns practical problems.","A quantitative study cannot be exploratory because it already contains numbers.","An applied, descriptive, quantitative study of current commuting patterns.","A historical study cannot have a descriptive objective."],"answer":2,"explanation":"The diagram presents several dimensions of research classification rather than one mutually exclusive list. A study can therefore have an application, an objective, a data orientation, and a time focus simultaneously.","distractors":["Application and information type are separate dimensions.","The information type does not by itself determine the research objective.","Correct: these labels answer different classification questions and can coexist.","The time dimension does not exclude a descriptive objective."],"source":{"doc":"P4","pages":"2"},"concept":"Independent classification dimensions"},{"id":"d05","topic":"design","difficulty":"applied","prompt":"A university records the current distribution of students' commute times without changing transport arrangements. Its main goal is an accurate profile. Which design best fits?","options":["Experimental research.","Grounded theory.","Descriptive research.","Phenomenology."],"answer":2,"explanation":"Descriptive research collects information about a subject as it is. Measuring a variable does not itself turn the study into an experiment.","distractors":["No independent variable is manipulated to test an intervention.","The stated aim is a current numerical profile, not a theory of a social process.","Correct: the study documents the current situation without an intervention.","The study is not investigating the meaning of commuting as a lived experience."],"source":{"doc":"L4","pages":"15–16"},"concept":"Descriptive design"},{"id":"d06","topic":"design","difficulty":"applied","prompt":"In Practice 4's correlation framework, which interpretation of a coefficient of −0.82 is most defensible?","options":["Proof that increasing the first variable causes the second to decrease.","A strong inverse association: higher values of one variable tend to accompany lower values of the other.","A weak association because the coefficient is below zero.","An 82% reduction in the outcome whenever the predictor increases by one unit."],"answer":1,"explanation":"Practice 4 gives the correlation range as −1 to +1 and describes negative values as inverse relationships. The coefficient describes association; it does not on its own identify a causal effect.","distractors":["An association does not establish the direction or existence of causation.","Correct: the negative sign gives direction and the magnitude near one indicates a strong association.","Strength depends on magnitude, not whether the sign is positive.","A correlation coefficient is not a percentage treatment effect or a regression slope."],"source":{"doc":"P4","pages":"17"},"concept":"Correlation strength and direction"},{"id":"d07","topic":"design","difficulty":"challenge","prompt":"Students who attend optional revision sessions obtain higher scores, but prior motivation may influence both attendance and scores. What does this observational finding establish?","options":["Motivation has been controlled because it was mentioned in the report.","The relationship is experimental because one variable can be called independent.","Revision sessions caused the score improvement because attendance came first.","Attendance and scores are associated, with motivation a possible alternative explanation."],"answer":3,"explanation":"The study measures an existing relationship without assigning the intervention. Lecture 4 stresses control of confounding in experiments and warns that descriptive evidence cannot by itself establish causality.","distractors":["Identifying a possible confounder is not the same as controlling it.","Variable labels do not create an intervention or an experimental comparison.","Temporal ordering alone does not remove alternative explanations.","Correct: the observed association is compatible with a confounding explanation."],"source":{"doc":"L4","pages":"15–16"},"concept":"Association and causation"},{"id":"d08","topic":"design","difficulty":"applied","prompt":"A researcher varies the amount of practice time assigned to each group and measures subsequent typing accuracy. Which classification is correct?","options":["Practice time is a confounder solely because the researcher controls it.","Typing accuracy is the independent variable; assigned practice time is the dependent variable.","Assigned practice time is the independent variable; typing accuracy is the dependent variable.","Both variables are dependent because both are expressed numerically."],"answer":2,"explanation":"Lecture 4 describes experimentation as varying an independent variable and precisely measuring a dependent variable. The roles follow the study's causal question and intervention, not the measurement scale.","distractors":["The deliberately varied treatment is the independent variable, not automatically a confounder.","This reverses the manipulated factor and measured outcome.","Correct: the researcher varies practice time and measures accuracy as the outcome.","Numerical format does not determine a variable's role."],"source":{"doc":"L4","pages":"15"},"concept":"Experimental variables"},{"id":"d09","topic":"design","difficulty":"challenge","prompt":"Extension beyond the slides: volunteers are randomly assigned to two teaching methods. Which claim is justified by random assignment alone?","options":["It guarantees identical baseline characteristics in both groups.","It strengthens the treatment comparison within the recruited sample.","It eliminates the need to measure the learning outcome consistently.","It makes the volunteer sample representative of all students."],"answer":1,"explanation":"Practice 4 mentions randomized assignments in experimental research. The distinction from random sampling is an extension: sampling concerns who enters the study, while assignment concerns which study condition they receive.","distractors":["Randomization balances characteristics in expectation, not with certainty in every realized sample.","Correct: assignment helps make treatment groups comparable, supporting internal causal inference.","Random assignment does not correct unreliable or invalid outcome measurement.","Assignment allocates recruited participants; it does not select them from the target population."],"source":{"doc":"P4","pages":"16"},"concept":"Random sampling versus random assignment"},{"id":"d10","topic":"design","difficulty":"challenge","prompt":"A researcher compares job satisfaction in existing low-experience and high-experience employee groups without assigning experience. What is the strongest defensible interpretation?","options":["The design proves the causal effect of experience because a t-test compares means.","The study becomes an experiment once experience is labeled an independent variable.","Any difference must be due to experience because the outcome is the same in both groups.","A group difference may be identified, but experience is not established as its cause."],"answer":3,"explanation":"Practice 4 places this example under causal-comparative research. Methodological correction beyond the slide's wording: comparisons of pre-existing groups can explore possible explanations, but causal claims require stronger design and assumptions than a group difference alone.","distractors":["A statistical test does not remove confounding or create an intervention.","Labeling a variable does not manipulate it or assign people to its levels.","Measuring the same outcome does not make groups equivalent on other influences.","Correct: pre-existing groups may differ in other relevant respects."],"source":{"doc":"P4","pages":"18"},"concept":"Causal-comparative limits"},{"id":"d11","topic":"design","difficulty":"applied","prompt":"A researcher reconstructs how a teacher describes changes in professional identity across a 30-year career, emphasizing sequence, turning points, and characters. Which strategy fits best?","options":["Grounded theory.","Ethnography.","Narrative inquiry.","Phenomenology."],"answer":2,"explanation":"Practice 4 describes narrative research as examining individuals' stories and life changes in sequence. The career's chronology and turning points make narrative inquiry the most specific fit.","distractors":["Grounded theory aims to develop a theory of processes or interactions from data.","Ethnography centers on a culture-sharing group's practices and meanings.","Correct: the central object is a person's story and its development over time.","Phenomenology prioritizes the meaning of a lived experience, rather than the chronology of one life story."],"source":{"doc":"P4","pages":"7"},"concept":"Narrative inquiry"},{"id":"d12","topic":"design","difficulty":"applied","prompt":"Several participants describe what it means to experience prolonged isolation, and the researcher seeks the meaning of that lived experience. Which qualitative strategy best matches the aim?","options":["Content analysis of institutional policies.","Ethnography.","Phenomenology.","Narrative inquiry."],"answer":2,"explanation":"Practice 4 associates phenomenology with understanding events and experiences through participants' accounts. The purpose of the inquiry, rather than interview duration alone, identifies the strategy.","distractors":["Policy documents would not directly provide the participants' lived accounts requested here.","No culture-sharing group or prolonged study of cultural practices is specified.","Correct: the question concerns how participants experience and understand a phenomenon.","Narrative inquiry would make the sequencing of individual life stories central."],"source":{"doc":"P4","pages":"8"},"concept":"Phenomenology"},{"id":"d13","topic":"design","difficulty":"applied","prompt":"A team analyzes workers' accounts to develop an explanatory model of how new employees negotiate informal roles. The model is developed from observed actions and interactions. Which strategy is most appropriate?","options":["Phenomenology.","Narrative inquiry.","Descriptive survey research.","Grounded theory."],"answer":3,"explanation":"Practice 4 links grounded theory to abstract theories developed from processes, actions, and interactions. The key distinguishing aim here is theory development from field data.","distractors":["The goal is a process model rather than primarily the meaning of a lived experience.","The analysis is not primarily organized as individual life stories.","A survey profile would not by itself fulfill the stated theory-development aim.","Correct: the aim is to construct a theory of a process grounded in participants' data."],"source":{"doc":"P4","pages":"9"},"concept":"Grounded theory"},{"id":"d14","topic":"design","difficulty":"challenge","prompt":"Practice 4 says grounded theory starts 'without any initial understanding.' Which interpretation avoids taking that phrase too literally?","options":["Exclude anyone who already knows anything about the research topic.","Remain open to concepts emerging from data and examine prior assumptions.","Choose a theory in advance and code only evidence that confirms it.","Avoid collecting contextual information because it would create prior understanding."],"answer":1,"explanation":"The slide emphasizes concepts and theory emerging from data. Methodological clarification beyond its wording: researchers cannot become blank slates; the important discipline is to examine assumptions and avoid forcing findings into a fixed prior theory.","distractors":["Prior familiarity does not automatically disqualify a researcher.","Correct: emergence requires openness and reflexivity, not literal absence of all knowledge.","This forces data into a predetermined explanation and undermines the stated emergent aim.","Contextual information can be essential to interpreting participants' processes."],"source":{"doc":"P4","pages":"9"},"concept":"Grounded theory and prior knowledge"},{"id":"d15","topic":"design","difficulty":"applied","prompt":"A researcher spends months observing and interviewing members of a software team to interpret its shared rituals, language, and norms. Which strategy is the strongest fit?","options":["Ethnography.","A correlational survey.","Narrative inquiry.","Phenomenology."],"answer":0,"explanation":"Practice 4 describes ethnography as prolonged observation of culture-sharing groups. Interviews and participant or non-participant observation can support that cultural interpretation.","distractors":["Correct: prolonged engagement with a culture-sharing group is central to ethnography.","The study does not principally measure the strength of numerical relationships.","The research is not principally a chronological reconstruction of individual lives.","The primary focus is collective cultural practices, not only individuals' lived experience of one phenomenon."],"source":{"doc":"P4","pages":"10"},"concept":"Ethnography"},{"id":"d16","topic":"design","difficulty":"applied","prompt":"A researcher investigates one university's failed timetable rollout in depth using meeting records, interviews, and usage statistics. Which design best matches this focused inquiry?","options":["A population survey.","Narrative inquiry.","A randomized experiment.","Case study."],"answer":3,"explanation":"Practice 4 links case studies to issues, contexts, problems, and lessons from events. Lecture 4 also allows case studies to use either primary or secondary and qualitative or quantitative evidence.","distractors":["The aim is contextual depth in a particular case rather than estimating population characteristics.","Individual life stories are not the main object of inquiry.","The rollout conditions have not been randomly assigned or systematically manipulated.","Correct: one specific event in its organizational context is examined using several sources."],"source":{"doc":"P4","pages":"11"},"concept":"Case study"},{"id":"d17","topic":"design","difficulty":"applied","prompt":"A team systematically examines newspaper articles to identify recurring portrayals of artificial intelligence and patterns of bias. Which strategy directly fits the material and aim?","options":["Content analysis.","Phenomenology.","Ethnography.","Experimental research."],"answer":0,"explanation":"Practice 4 includes content analysis among qualitative strategies and names newspapers, books, and films as possible materials. Lecture 4 clarifies that content analysis can also be quantitative when the analytic focus is frequencies.","distractors":["Correct: the team systematically examines communication materials for patterns and themes.","The primary material is published communication rather than participants' accounts of lived experience.","The design does not involve prolonged observation of a culture-sharing group.","The researchers do not manipulate a variable and measure an intervention outcome."],"source":{"doc":"P4","pages":"12"},"concept":"Content analysis as a strategy"},{"id":"d18","topic":"design","difficulty":"challenge","prompt":"Two projects both use interviews with nurses. Project A reconstructs one nurse's career story; Project B investigates the meaning of providing end-of-life care across participants. Which pairing is best?","options":["A: narrative inquiry; B: phenomenology.","A: ethnography; B: grounded theory.","A: phenomenology; B: narrative inquiry.","A: grounded theory; B: ethnography."],"answer":0,"explanation":"A data-collection method does not uniquely identify a research strategy. Practice 4 distinguishes narrative stories over time from phenomenological understanding of events and experiences.","distractors":["Correct: A centers on a sequenced life story and B on the meaning of a lived experience.","Neither a culture-sharing group nor theory development is the stated central aim.","This reverses the defining aims of the two strategies.","The presence of interviews alone does not establish either a process-theory or cultural inquiry."],"source":{"doc":"P4","pages":"7–8"},"concept":"Distinguishing qualitative aims"},{"id":"d19","topic":"design","difficulty":"applied","prompt":"A survey first identifies an unexpected decline in satisfaction. Interviews are then designed to explain that finding, and both sets of results are interpreted together. Which design fits?","options":["A purely quantitative design, because the survey happened first.","Sequential mixed methods, with quantitative work followed by qualitative work.","A purely qualitative design, because interviews provide the explanation.","Concurrent mixed methods, because the final report contains both types of results."],"answer":1,"explanation":"Practice 4's sequential diagram shows quantitative collection and analysis followed by qualitative collection and analysis. Explaining a first-phase finding through follow-up interviews is an applied example of that sequence.","distractors":["The later qualitative phase contributes substantively to the overall study.","Correct: the first phase informs the later phase and the two contribute to a shared interpretation.","The quantitative phase remains an integrated part of the study.","Concurrent design concerns timing of the research phases, not the contents of the final report."],"source":{"doc":"P4","pages":"20–21"},"concept":"Sequential quantitative-to-qualitative design"},{"id":"d20","topic":"design","difficulty":"applied","prompt":"A team first interviews users to discover relevant concerns, uses the findings to build a questionnaire, and then estimates how common those concerns are. Which design fits best?","options":["A descriptive quantitative study only, because the last phase uses numbers.","Concurrent mixed methods, because the questionnaire contains interview-derived ideas.","A narrative study only, because participants initially tell stories.","Sequential mixed methods, with qualitative work followed by quantitative work."],"answer":3,"explanation":"Practice 4's sequential diagram explicitly allows the qualitative phase to precede the quantitative phase. The ordering should serve the question, such as developing relevant measures before estimating their distribution.","distractors":["This omits the substantive qualitative phase that shapes the instrument.","The phases occur in sequence rather than at the same time.","Interview accounts used to develop survey categories do not make the entire study narrative inquiry.","Correct: the qualitative phase informs a later quantitative phase."],"source":{"doc":"P4","pages":"21"},"concept":"Sequential qualitative-to-quantitative design"},{"id":"d21","topic":"design","difficulty":"applied","prompt":"During the same study period, researchers collect rating scales and interview accounts, analyze each, and compare the findings. Which label best fits?","options":["A quantitative study with secondary data.","A randomized experiment.","Concurrent mixed methods.","Sequential mixed methods."],"answer":2,"explanation":"Practice 4's concurrent diagram shows qualitative and quantitative work happening at the same time, followed by comparison of results. Timing and the relationship between strands are the defining features here.","distractors":["The interview strand is qualitative, and both forms of evidence are collected for this study.","Parallel timing does not imply an intervention or randomized assignment.","Correct: the qualitative and quantitative strands run in parallel and their findings are compared.","The scenario does not make one completed phase precede and inform the other."],"source":{"doc":"P4","pages":"22"},"concept":"Concurrent mixed methods"},{"id":"d22","topic":"design","difficulty":"core","prompt":"What does Practice 4's concurrent-design diagram indicate about the relative emphasis given to qualitative and quantitative strands?","options":["The later-published strand determines the study's priority.","They may have equal emphasis, or one may be dominant.","The quantitative strand must always be dominant.","They must always receive exactly equal emphasis."],"answer":1,"explanation":"Practice 4 labels concurrent designs as having equal or dominant components. A smaller supporting strand can still contribute to a mixed-method study when it is meaningfully connected to the main inquiry.","distractors":["Publication order is not the priority relationship illustrated in the diagram.","Correct: the diagram explicitly shows both equal and dominant arrangements.","The diagram also shows a qualitative-dominant arrangement.","Equal priority is one possibility rather than a universal requirement."],"source":{"doc":"P4","pages":"22"},"concept":"Mixed-method priority"},{"id":"d23","topic":"design","difficulty":"challenge","prompt":"Extension beyond the slides: a project collects an interview dataset and a numerical survey dataset but never connects their questions, analyses, or interpretations. What is the most important improvement before claiming a coherent mixed-method design?","options":["Convert every interview sentence into a number and discard its meaning.","Collect exactly the same number of interviews and questionnaires.","Specify how the qualitative and quantitative findings inform a shared conclusion.","Add a second survey so that there are more instruments."],"answer":2,"explanation":"Practice 4 says mixed methods combines approaches to improve understanding and illustrates comparison of concurrent findings. The explicit integration requirement is a methodological extension: merely collecting two kinds of data does not explain how they jointly answer the question.","distractors":["Mechanical conversion does not supply a justified relation between the two strands.","Equal sample counts are not a defining requirement of mixed methods.","Correct: integration gives the two strands a defined contribution to the same research problem.","The number of instruments does not establish integration of qualitative and quantitative evidence."],"source":{"doc":"P4","pages":"20–22"},"concept":"Integration in mixed methods"},{"id":"d24","topic":"design","difficulty":"challenge","prompt":"A researcher receives 5,000 numerical survey responses from followers of one popular student account and claims the sample must represent all university students. Which critique is strongest?","options":["Large sample size and numerical data do not remove selection problems.","The claim is correct because quantitative studies are automatically generalizable.","Representativeness depends only on whether the average is calculated correctly.","The only problem is that the survey should have used open-ended questions."],"answer":0,"explanation":"Practice 4's comparison table overstates the link between large quantitative samples and population representation. Clarification beyond that wording: generalization depends on the sampling and response processes as well as measurement and context.","distractors":["Correct: who is reached and who responds affect representativeness.","Quantitative format does not guarantee a representative sampling process.","A correctly calculated sample statistic can still misrepresent the target population.","Question format does not resolve coverage and self-selection problems."],"source":{"doc":"P4","pages":"19"},"concept":"Representativeness and numerical data"},{"id":"d25","topic":"design","difficulty":"applied","prompt":"Which statement best meets Practice 4's requirement to justify a design for a question about how one department implements a new policy?","options":["A case study supports detailed contextual understanding using staff accounts and implementation records.","A survey can rank departments by policy adoption without examining implementation in this department.","A staff experiment can test which policy message produces the largest immediate attitude change.","A correlational study can relate institution size to adoption rates across universities."],"answer":0,"explanation":"Practice 4 asks students to connect their question, methodology, design, data, participants, and justification. A strong rationale explains why the design produces evidence relevant to the particular aim.","distractors":["Correct: it connects the research aim, design, setting, and evidence.","A cross-department ranking does not directly address how implementation unfolded in the specified case.","This would answer a message-effect question rather than explain the department's implementation process.","An association across institutions does not directly explain the implementation process in this department."],"source":{"doc":"P4","pages":"23–25"},"concept":"Justifying a research design"},{"id":"d26","topic":"design","difficulty":"applied","prompt":"A researcher cannot alter an institution's admissions policy but can examine existing records before and after a policy change. Which statement should guide the design?","options":["Abandon the question because research is valid only when an experiment is possible.","Claim causation whenever the outcome changed after the policy.","Use the available observational evidence while identifying alternative explanations for any change.","Describe the project as a randomized experiment because the policy changed."],"answer":2,"explanation":"Lecture 4 requires the ability to vary the independent variable for an experiment and emphasizes confounding control. Applying that principle to an externally introduced policy is an extension: useful observational research remains possible, with conclusions limited by its design.","distractors":["Non-experimental designs can answer descriptive and associational questions.","Other changes over the same period may explain the outcome.","Correct: available records may be useful, but causal interpretation requires care.","A change over time is not equivalent to randomized assignment by the researcher."],"source":{"doc":"L4","pages":"15–16"},"concept":"Feasibility of experimentation"},{"id":"d27","topic":"design","difficulty":"challenge","prompt":"A new teaching method is used only by an experienced instructor, while the comparison method is used only by a novice instructor. What is the main design problem?","options":["There is no dependent variable because two instructors are involved.","Teaching method and instructor experience are entangled, so their effects cannot be separated confidently.","The use of two methods automatically controls all confounding variables.","The study is qualitative because instructor experience is a human characteristic."],"answer":1,"explanation":"Lecture 4 says experimental validity depends on controlling confounding variables. Here, the treatment comparison also changes instructor experience, so the outcome difference cannot be attributed confidently to method alone.","distractors":["A measured learning outcome can still be the dependent variable.","Correct: instructor experience offers an alternative explanation for the outcome difference.","Having comparison conditions does not make their other characteristics equivalent.","Human characteristics can be studied using quantitative or qualitative evidence."],"source":{"doc":"L4","pages":"15–16"},"concept":"Confounding by treatment delivery"},{"id":"d28","topic":"design","difficulty":"applied","prompt":"A project must estimate how widespread an accessibility problem is and understand why students experience it differently. Which plan most directly addresses both aims?","options":["Combine a suitable quantitative survey with qualitative interviews and connect the findings.","Use two numerical questionnaires and call the project mixed methods.","Conduct one unstructured interview and report its findings as population prevalence.","Count website visits and infer students' personal explanations from the total."],"answer":0,"explanation":"Practice 4 presents mixed methods as combining qualitative and quantitative approaches according to the question. The plan's explicit connection between prevalence estimates and explanations applies the integration principle beyond the slide's brief definition.","distractors":["Correct: prevalence and meaning require complementary evidence tied to the same problem.","Two instruments of the same general data orientation do not by themselves create mixed methods.","One account cannot support a population-frequency estimate.","Usage counts do not directly reveal participants' reasons or meanings."],"source":{"doc":"P4","pages":"20–22"},"concept":"When mixed methods adds value"},{"id":"d29","topic":"design","difficulty":"applied","prompt":"An in-depth case study combines archived records, new interviews, and numerical service statistics. Which statement is consistent with Lecture 4's table?","options":["Case studies can use primary and secondary evidence and qualitative and quantitative data.","Using numerical service statistics automatically makes the case study an experiment.","Case studies must use only primary qualitative interviews.","Using archived records means the design can no longer be a case study."],"answer":0,"explanation":"Lecture 4 treats case-study evidence as flexible on both provenance and data type. The design is identified by its in-depth focus on a specific group or context, not by one mandatory instrument.","distractors":["Correct: Lecture 4 marks both classifications as 'Either' for case studies.","Numerical evidence does not imply manipulation of an independent variable.","The lecture table does not impose either restriction.","The data source does not remove the design's focus on a specific case or context."],"source":{"doc":"L4","pages":"17"},"concept":"Case-study evidence flexibility"},{"id":"d30","topic":"design","difficulty":"challenge","prompt":"An article asks whether a training program causes better performance but reports only a one-time voluntary survey of program participants. Which critique most directly addresses the design-question mismatch?","options":["The article should replace every number with a participant quotation.","A longer literature review would by itself establish the causal effect.","The survey would prove causation if it contained more questions.","The design lacks a credible comparison for attributing performance to the program."],"answer":3,"explanation":"Practice 4 asks for critiques of design strengths, weaknesses, and possible improvements. Applying Lecture 4's causal-design distinction, the central weakness is that the available evidence does not support the strength of the causal claim.","distractors":["Changing the data format alone does not establish a credible causal comparison.","Background reading cannot repair the missing design basis for causal attribution.","Instrument length does not solve confounding or the absence of an appropriate comparison.","Correct: the causal question requires evidence that distinguishes program effects from alternative explanations."],"source":{"doc":"P4","pages":"25"},"concept":"Design critique and claim alignment"},{"id":"c01","topic":"collection","difficulty":"applied","prompt":"A team conducts new interviews and also analyzes a government census collected by another organization. How should these two sources be classified?","options":["Interviews: secondary; census: primary.","Both secondary, because participants supplied the information.","Interviews: primary; census: secondary.","Both primary, because the team analyzes both itself."],"answer":2,"explanation":"Lecture 4 defines primary data as original data collected for the research question and secondary data as already collected by others. The distinction concerns provenance, not whether the current researcher performs the analysis.","distractors":["This reverses the origin of the two datasets for this team.","Primary data commonly comes from participants but is collected for the current project.","Correct: the interviews are collected for this project, while the census already exists.","Conducting an analysis does not mean the analyst collected the original data."],"source":{"doc":"L4","pages":"13"},"concept":"Primary and secondary data"},{"id":"c02","topic":"collection","difficulty":"applied","prompt":"A question concerns population change across 50 years and several countries, and suitable census datasets already exist. Which initial strategy best fits Lecture 4's guidance?","options":["Assess and analyze the existing census datasets as secondary evidence.","Reject existing data solely because it was collected by someone else.","Run a short experiment to recreate the last 50 years of demographic change.","Interview a few current residents and treat their memories as complete census records."],"answer":0,"explanation":"Lecture 4 recommends considering secondary data for historical trends and large-scale patterns. The table also warns that researchers must assess and prepare these data because they do not control their original generation.","distractors":["Correct: existing records can cover long timescales and broad locations.","Secondary provenance does not by itself make data unsuitable.","An experiment cannot recreate the historical population record required by the question.","A few retrospective accounts do not provide the required population coverage."],"source":{"doc":"L4","pages":"13–14"},"concept":"Choosing secondary sources"},{"id":"c03","topic":"collection","difficulty":"applied","prompt":"A study needs a detailed measure of an experience that no existing dataset records. What is the strongest reason to collect primary data?","options":["The measures and sampling can be tailored to the research question.","Primary data always takes less time than accessing existing data.","Primary data removes the need to justify analysis choices.","Primary data is automatically free from measurement bias."],"answer":0,"explanation":"Lecture 4 lists question-specific data and control over sampling and measurement as primary-research strengths. These advantages have to be weighed against collection time, expense, and training needs.","distractors":["Correct: primary collection gives the researcher control over key data-generation decisions.","Lecture 4 identifies time and cost as common disadvantages of primary collection.","Analysis still needs to fit the question and the collected data.","Original collection can still contain biased questions or procedures."],"source":{"doc":"L4","pages":"14"},"concept":"Strengths of primary collection"},{"id":"c04","topic":"collection","difficulty":"core","prompt":"A student downloads an existing dataset and asks a new research question that its original authors did not examine. For this student's project, the data is:","options":["Qualitative, because the student interprets the findings.","Experimental, because a new analysis changes the result.","Primary, because the student's research question is original.","Secondary, even though the analysis question is new."],"answer":3,"explanation":"Lecture 4 defines the primary-secondary distinction by whether original data is collected for the project or existing data is used. Novel reasoning about a dataset does not make its collection primary for the new analyst.","distractors":["All analysis involves interpretation; qualitative status depends on the data and analytic approach.","Reanalysis does not manipulate a variable in the original data-generating process.","Originality of the question is different from original data collection.","Correct: a new analysis does not change the dataset's collection history."],"source":{"doc":"L4","pages":"13"},"concept":"New analysis of existing data"},{"id":"c05","topic":"collection","difficulty":"applied","prompt":"An observer counts interruptions in meetings and also writes detailed notes about their meanings and context. Which description is most accurate?","options":["All observation is qualitative because a human observer is present.","The counts are primary but the field notes are secondary.","All observation is quantitative because something is directly observed.","Observation can generate both quantitative counts and qualitative accounts."],"answer":3,"explanation":"Lecture 4 classifies observation as primary collection that may be qualitative or quantitative. The data form depends on what the observer records and how it is analyzed.","distractors":["Human observers can make structured numerical counts.","Both are newly collected by the observer for this study.","Direct observation can also produce rich descriptive field notes.","Correct: the same collection method can produce different forms of data."],"source":{"doc":"L4","pages":"17"},"concept":"Observation and data type"},{"id":"c06","topic":"collection","difficulty":"applied","prompt":"A researcher wants detailed accounts of why staff avoid a new software tool and needs to probe unexpected issues. Which collection method best fits?","options":["Semi-structured interviews with room for follow-up questions.","A single yes-or-no question with no follow-up.","A fixed count of how many accounts were created.","A meta-analysis of unrelated software trials."],"answer":0,"explanation":"Lecture 4 links interviews and focus groups to an in-depth understanding of a topic. Practice 4 also discusses interviews, main questions, and probes as part of qualitative collection and recording.","distractors":["Correct: interviews can elicit detailed meanings and allow relevant probing.","This provides little depth for unexpected explanations.","The count describes uptake but does not directly explore reasons.","Unrelated pooled findings do not directly elicit these staff members' accounts."],"source":{"doc":"L4","pages":"17"},"concept":"Interviews for depth"},{"id":"c07","topic":"collection","difficulty":"applied","prompt":"Extension beyond the slides: a researcher wants to hear how students debate and negotiate a shared view of campus transport. Which feature most favors a focus group over separate interviews?","options":["Group data eliminates the need for interpretation or coding.","The group format guarantees that every participant expresses the same view.","Interaction among participants becomes part of the evidence.","The researcher can assume the group is a representative population sample."],"answer":2,"explanation":"Lecture 4 identifies focus groups as a route to in-depth understanding. The specific role of participant interaction is an extension beyond its table; it explains why a group discussion may fit this particular research aim.","distractors":["Discussion data still requires careful preparation and analysis.","Focus groups may reveal differences, and group pressure can suppress some views.","Correct: a facilitated group discussion can reveal agreement, disagreement, and how views develop socially.","A group discussion does not automatically support population estimates."],"source":{"doc":"L4","pages":"17"},"concept":"Focus-group interaction"},{"id":"c08","topic":"collection","difficulty":"applied","prompt":"A questionnaire contains 1–5 satisfaction ratings and an open text question asking respondents to explain their ratings. Which plan best respects the different evidence?","options":["Analyze everything as qualitative data because respondents expressed opinions.","Summarize the ratings numerically and analyze the explanations for meanings and patterns.","Discard the explanations because surveys cannot produce qualitative data.","Analyze everything as numerical data because it came from a questionnaire."],"answer":1,"explanation":"Lecture 4 says survey responses may be studied for meanings or for response frequencies. The analysis depends on the data and question, rather than the survey label alone.","distractors":["Opinions recorded on a numerical scale can be summarized quantitatively.","Correct: the analysis is matched to each response form and purpose.","Lecture 4 explicitly allows qualitative analysis of survey responses.","An instrument can contain open-ended responses that support qualitative interpretation."],"source":{"doc":"L4","pages":"19–20"},"concept":"Survey responses and analysis"},{"id":"c09","topic":"collection","difficulty":"challenge","prompt":"Practice 4's survey slide calls surveys a frequently used 'qualitative' approach while placing them in a quantitative diagram and discussing statistical population estimates. What should a student conclude?","options":["All surveys are experiments because they ask participants to respond.","A survey cannot contain both fixed-response and open-ended items.","All surveys are qualitative, even when they only record numerical ratings.","The label is inconsistent; surveys can collect quantitative and/or qualitative data depending on their questions and analysis."],"answer":3,"explanation":"The word 'qualitative' conflicts with the diagram and the statistical survey description on this page. Lecture 4 pages 19–20 confirms that survey responses can support both numerical and qualitative analysis, so the wording should not be memorized as a strict definition.","distractors":["Asking questions does not itself manipulate an independent variable.","Questionnaires can contain both forms of response.","This treats the inconsistent word as a universal rule and ignores the data format.","Correct: this reconciles the typo with the slide's statistical description and Lecture 4's analysis guidance."],"source":{"doc":"P4","pages":"14"},"concept":"Correcting the survey label"},{"id":"c10","topic":"collection","difficulty":"applied","prompt":"An observer writes, 'Three participants stopped speaking when the manager entered,' followed by, 'I suspect they feared criticism.' How should the two notes be distinguished?","options":["The first is descriptive; the second is reflective interpretation.","The first is reflective; the second is a direct observation.","The second is more objective because it explains the participants' motivation.","Both are direct observations because they appear in the same field notebook."],"answer":0,"explanation":"Practice 4 recommends separating descriptive notes from the researcher's reflective thoughts. Keeping these layers distinct helps readers see what was observed and what was inferred.","distractors":["Correct: the first records an observed event and the second records the researcher's inference.","Fear is inferred here, whereas the change in speaking behavior was observed.","An explanation of motivation requires evidence and should not be treated as established by intuition.","Location in a notebook does not make an inference directly observed evidence."],"source":{"doc":"P4","pages":"5"},"concept":"Descriptive and reflective notes"},{"id":"c11","topic":"collection","difficulty":"applied","prompt":"Extension beyond the slides: after a participant says a service was 'difficult,' which follow-up most directly invites clarification without assuming a cause?","options":["'Was it difficult because the staff were unhelpful?'","'How badly did management fail you?'","'You agree the new system caused the problem, don't you?'","'Can you describe what made it difficult for you?'"],"answer":3,"explanation":"Practice 4 includes probes in interview protocols. The distinction between neutral and leading probes is an applied extension: a useful probe expands the participant's account without prescribing its content.","distractors":["This suggests a specific explanation that the participant has not provided.","This presupposes both failure and responsibility.","This pressures agreement and embeds a causal assumption.","Correct: this asks the participant to elaborate without supplying an explanation."],"source":{"doc":"P4","pages":"5"},"concept":"Neutral interview probing"},{"id":"c12","topic":"collection","difficulty":"applied","prompt":"A team has recordings and field notes but has not organized or examined them. Which sequence most closely follows Practice 4?","options":["Count files and treat the count as the meaning of participants' experiences.","Publish all recordings without analysis because raw data explains itself.","Prepare the data, code patterns and descriptions, relate them, then interpret their meanings.","Choose a conclusion, remove conflicting accounts, and select quotations to support it."],"answer":2,"explanation":"Practice 4 says data should first be prepared, then analyzed with methods appropriate to the qualitative strategy. Coding supports patterns and descriptions, which must be related and interpreted rather than simply listed.","distractors":["File counts do not answer the interpretive question.","Recording is not equivalent to analysis and interpretation.","Correct: this follows the slide's progression from preparation through coding to interpretation.","This substitutes confirmation seeking for systematic qualitative analysis."],"source":{"doc":"P4","pages":"6"},"concept":"Preparing qualitative data"},{"id":"c13","topic":"collection","difficulty":"applied","prompt":"The goal is to identify recurring patterns of meaning across interview accounts of remote work. Which analysis method is the most direct fit in Lecture 4's table?","options":["Statistical comparison of predefined category frequencies.","Meta-analysis.","Thematic analysis.","Chronological reconstruction of one participant's life story."],"answer":2,"explanation":"Lecture 4 recommends thematic analysis for patterns and meanings in textual data. Its analysis table specifically includes interviews and focus groups as relevant sources.","distractors":["Category counts answer frequency questions, while this question asks for recurring patterns of meaning.","Meta-analysis statistically combines results across studies rather than interpreting these interview accounts.","Correct: the table links thematic analysis to general themes in interviews, focus groups, and texts.","A narrative focus on one life sequence differs from identifying themes across these accounts."],"source":{"doc":"L4","pages":"22"},"concept":"Thematic analysis"},{"id":"c14","topic":"collection","difficulty":"applied","prompt":"One project counts how often news articles mention privacy; another interprets how those articles frame privacy. Which classification is most accurate?","options":["Both must be qualitative because the original material consists of words.","The first is quantitative content analysis; the second is qualitative content analysis.","The first is an experiment; the second is a survey.","Both must be quantitative because their procedures are systematic."],"answer":1,"explanation":"Lecture 4 explicitly describes content analysis as either quantitative or qualitative. It contrasts word frequencies with word meanings to illustrate the difference.","distractors":["Text can be coded into numerical frequencies as well as interpreted for meaning.","Correct: one examines frequencies and the other examines meaning.","Neither counting existing articles nor interpreting them implies intervention or respondent questioning.","Systematic procedures are also part of rigorous qualitative analysis."],"source":{"doc":"L4","pages":"22"},"concept":"Qualitative and quantitative content analysis"},{"id":"c15","topic":"collection","difficulty":"applied","prompt":"A study asks for the average waiting time, the distribution of delays, and the association between waiting time and satisfaction ratings. Which analysis family directly fits?","options":["Phenomenological interpretation alone.","An unstructured literature review with no analysis of the collected data.","Narrative reconstruction alone.","Quantitative statistical analysis."],"answer":3,"explanation":"Lecture 4 says quantitative analysis can examine frequencies, averages, and correlations in descriptive studies. Numerical analysis does not require the study to be an experiment.","distractors":["Interpretation of lived meaning would answer a different question.","The requested summaries require analyzing the relevant measurements.","A chronological life story does not directly estimate these numerical summaries.","Correct: averages, frequencies, and associations among numerical measures are statistical questions."],"source":{"doc":"L4","pages":"21"},"concept":"Statistical analysis"},{"id":"c16","topic":"collection","difficulty":"core","prompt":"A researcher wants to statistically combine comparable numerical results from many existing studies. Which method in Lecture 4's table fits best?","options":["Participant observation.","Meta-analysis.","Narrative inquiry into one person's life.","A focus group."],"answer":1,"explanation":"Lecture 4 describes meta-analysis as quantitative analysis of results from a collection of studies. It requires suitable underlying study data; merely listing published conclusions is not a statistical synthesis.","distractors":["Participant observation collects evidence in a setting rather than statistically pools existing studies.","Correct: this method statistically synthesizes results across studies.","A life-story inquiry has a different unit and purpose.","A focus group collects participants' discussion rather than combines study results."],"source":{"doc":"L4","pages":"22"},"concept":"Meta-analysis"},{"id":"c17","topic":"collection","difficulty":"core","prompt":"Which pairing most closely matches Practice 4's basic distinction?","options":["Validity: agreement with the hypothesis; reliability: statistically significant results.","Validity: publishing first; reliability: citing many papers.","Validity: checking accuracy; reliability: checking consistency.","Validity: collecting large samples; reliability: choosing interviews."],"answer":2,"explanation":"Practice 4 uses accuracy checking to explain validity and consistency across researchers or projects to explain reliability. These are simplified starting points for evaluating whether procedures and interpretations support the intended conclusions.","distractors":["A preferred or significant finding is not itself evidence of valid or reliable research.","Publication timing and reference counts do not define these research-quality concepts.","Correct: the slide connects validity with accuracy and reliability with consistent results.","Neither concept is defined by one sample size or collection method."],"source":{"doc":"P4","pages":"6"},"concept":"Validity and reliability"},{"id":"c18","topic":"collection","difficulty":"challenge","prompt":"Extension beyond the slides: a survey intended to measure course understanding repeatedly asks only whether students like the lecturer. Scores are highly stable. What is the strongest concern?","options":["Stable scores prove that course understanding was measured accurately.","Reliability cannot be discussed for questionnaire responses.","The survey must be invalid solely because its responses are numerical.","The measure may be reliable while failing to measure the intended construct."],"answer":3,"explanation":"Practice 4 separates accuracy from consistency. This example extends that distinction to measurement: an instrument can repeatedly measure the wrong thing for the research question.","distractors":["Consistency does not show that the instrument measures the intended concept.","Questionnaire measures can be examined for consiste
