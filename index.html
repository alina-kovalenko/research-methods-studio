function overview(){const stats=C.topicStats(state.attempts,D.questions);return `<section class="hero"><div><div class="eyebrow">Your course. A focused practice plan.</div><h1>Understand the study.<br>Defend the answer.</h1><p>Go beyond memorising definitions. Learn the distinctions, test your judgement, and practise finding gaps and hypotheses in article excerpts.</p><div class="button-row">${btn('Start practising','nav','green','data-view="practice"')}${btn('Explore the study guide','nav','secondary','data-view="learn"')}</div></div><div class="hero-graphic"><svg viewBox="0 0 260 260" role="img" aria-label="Practice exam: 70 percent single-answer multiple choice and 30 percent written article analysis"><circle cx="130" cy="130" r="99" fill="none" stroke="#665ca6" stroke-width="28"/><circle cx="130" cy="130" r="99" fill="none" stroke="#315b49" stroke-width="28" stroke-dasharray="435.4 622" transform="rotate(-90 130 130)"/><text x="130" y="115" text-anchor="middle" fill="#202830" font-size="47" font-family="Manrope" font-weight="600">70 / 30</text><text x="130" y="146" text-anchor="middle" fill="#526258" font-size="13" font-family="Manrope">practice exam mix</text><text x="130" y="167" text-anchor="middle" fill="#526258" font-size="11" font-family="Manrope">one correct MCQ answer</text></svg><div class="hero-legend"><span><i class="swatch"></i>Multiple choice</span><span><i class="swatch purple"></i>Article analysis</span></div></div></section><div class="stat-strip"><div class="stat"><strong>${D.questions.length}</strong><span>Single-answer questions</span></div><div class="stat"><strong>${D.cases.length}</strong><span>Article-style cases</span></div><div class="stat"><strong>5</strong><span>Exam topics covered</span></div><div class="stat"><strong>40</strong><span>Tasks per mock exam</span></div></div><div class="section-title"><h2>Your five exam topics</h2><span class="small muted">Read · apply · review</span></div><div class="topic-grid">${stats.map(s=>{const m=META[s.topic];return `<article class="topic-card"><span class="topic-number">${m.n} / COURSE TOPIC</span><h3>${m.title}</h3><p>${m.description}</p><div class="card-bottom"><span>${s.seen} of ${s.total} practised</span>${btn('Study topic ↗','learn-topic','secondary small',`data-topic="${s.topic}"`)}</div><div class="mini-track"><span style="width:${s.seen/s.total*100}%"></span></div></article>`;}).join('')}<article class="feature-note"><span class="eyebrow">The article question</span><h3>Gap. Question.<br>Hypothesis. Evidence.</h3><p>Work through original excerpts with written answers, evidence quotes and point-by-point rubrics.</p>${btn('Open article lab ↗','nav','lime small','data-view="articles"')}</article></div><div class="section-title"><h2>A useful order of study</h2></div><div class="study-map"><div><h3>01 · Diagnose with 20 mixed questions</h3><p>Use the explanations to find distinctions you confuse, rather than rereading every definition.</p></div><div><h3>02 · Read the relevant guide sections</h3><p>Focus on worked examples and “exam traps”. Lecture page references make it easy to check the original.</p></div><div><h3>03 · Analyse at least three contrasting cases</h3><p>Try an experiment, a qualitative study and mixed methods. Do not invent a hypothesis when none is stated.</p></div><div><h3>04 · Take a timed mock, then review</h3><p>The practice format is 28 MCQs and 12 written prompts. Written work uses honest self-assessment, not automatic keyword grading.</p></div></div>`;}
function visual(t){if(t==='foundations')return `<div class="visual"><h3>The logic of a defensible study</h3><div class="flow">${[['Problem','Why does this matter?'],['Gap','What is not known?'],['Question','What will this study ask?'],['Design','What evidence can answer it?'],['Claim','What does that evidence support?']].map(([a,b],i)=>`${i?'<span class="flow-arrow" aria-hidden="true">→</span>':''}<div class="flow-step"><b>${a}</b><span>${b}</span></div>`).join('')}</div><p class="source">A hypothesis, when appropriate, is a testable prediction tied to the question. It is not required in every exploratory study.</p></div>`;
if(t==='articles')return `<div class="visual"><h3>IMRAD: four different jobs</h3><div class="flow">${[['Introduction','Why this study? Gap, question, objective.'],['Methods','How was it done? Design, sample, measures, analysis.'],['Results','What was observed? Findings with evidence.'],['Discussion','What does it mean? Interpretation, limits, alternatives.']].map(([a,b],i)=>`${i?'<span class="flow-arrow" aria-hidden="true">→</span>':''}<div class="flow-step"><b>${a}</b><span>${b}</span></div>`).join('')}</div></div>`;
if(t==='databases')return `<div class="visual"><h3>Build concepts before writing the query</h3><div class="flow"><div class="flow-step"><b>Concept A</b><span>("retrieval practice" OR "practice testing")</span></div><span class="flow-arrow">AND</span><div class="flow-step"><b>Concept B</b><span>(retention OR learning)</span></div><span class="flow-arrow">AND</span><div class="flow-step"><b>Concept C</b><span>(students OR undergraduates)</span></div></div><p class="source">Generic Boolean logic, not a universal copy-paste command. Adapt fields, phrase handling and date filters to the selected database.</p></div>`;
if(t==='design')return `<div class="visual"><h3>Match the question to the evidence</h3><div class="table-wrap"><table class="compare"><thead><tr><th>Question asks about…</th><th>Possible design</th><th>Key caution</th></tr></thead><tbody><tr><td>Effect of an assigned intervention</td><td>Experiment; randomized when feasible</td><td>Assignment, attrition and confounding matter.</td></tr><tr><td>Association between measured variables</td><td>Correlational observation</td><td>Association alone does not establish causation.</td></tr><tr><td>Meaning of a lived experience</td><td>Phenomenology</td><td>Choose by purpose, not just because interviews appear.</td></tr><tr><td>Why a numerical pattern occurs</td><td>Explanatory sequential mixed methods</td><td>Quantitative findings inform qualitative follow-up; integrate both.</td></tr></tbody></table></div></div>`;
return `<div class="visual"><h3>Three independent decisions about data</h3><div class="flow"><div class="flow-step"><b>Form</b><span>Quantitative / qualitative<br>What information is recorded?</span></div><div class="flow-step"><b>Provenance</b><span>Primary / secondary<br>Was it collected for this study?</span></div><div class="flow-step"><b>Intervention</b><span>Observational / experimental<br>Was a condition manipulated?</span></div></div><p class="source">Example: a new one-time numeric survey can be primary, quantitative and observational at the same time. A survey is not automatically an experiment.</p></div>`;}
function learn(){const lesson=D.lessons.find(l=>l.topic===topic)||D.lessons[0];return head('Study guide',META[topic].title,'Substantive explanations, applied examples and the traps most likely to cost marks.',`<div class="button-row"><button class="btn secondary small" data-action="nav" data-view="allnotes">All printable notes</button>${btn('Print this topic','print','secondary small')}</div>`)+`<div class="tab-row">${C.topics.map(t=>`<button data-action="learn-topic" data-topic="${t}" class="${topic===t?'active':''}">${META[t].short}</button>`).join('')}</div><p class="lesson-lead">${esc(lesson.lead)}</p>${visual(topic)}<div class="button-row">${btn('Practise this topic','topic-practice','green',`data-topic="${topic}"`)}${btn('Expand all explanations','expand-lessons','secondary small')}</div>${lesson.sections.map((s,i)=>`<details class="lesson-section" ${i===0?'open':''}><summary>${esc(s.title)}</summary><p class="body">${esc(s.body)}</p>${s.example?`<div class="example"><strong>Applied example</strong>${esc(s.example)}</div>`:''}${s.trap?`<div class="trap"><strong>Exam trap</strong>${esc(s.trap)}</div>`:''}${source(s.source)}</details>`).join('')}${lesson.corrections?.length?`<section><div class="section-title"><h2>Lecture wording: important nuances</h2></div><p class="small muted">Know your lecturer’s terminology, while avoiding these overgeneralizations in an analytical answer.</p>${lesson.corrections.map(c=>`<div class="notice"><strong>${esc(c.claim)}</strong><p>${esc(c.clarification)}</p>${source(c.source)}</div>`).join('')}</section>`:''}<div class="section-title"><h2>Terminology that changes the answer</h2></div><dl class="glossary">${(lesson.glossary||[]).map(g=>`<div><dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd></div>`).join('')}</dl>`;}
function allnotes(){return head('Complete study guide','Study, then put it into practice.','All five topics, worked examples, diagrams, terminology and source notes in one place.',`<div class="button-row">${btn('Print study guide','print','secondary small')}${btn('Open question bank','nav','green small','data-view="practice"')}</div>`)+`<section class="panel"><h2>The article-answer checklist</h2><ol class="step-list"><li><span><strong>Gap:</strong> identify the specific missing evidence or understanding, rather than the broad practical problem.</span></li><li><span><strong>Question and objective:</strong> state what the study asks and what it aims to accomplish.</span></li><li><span><strong>Hypothesis:</strong> identify a stated prediction. If absent, say so and label any hypothesis you propose.</span></li><li><span><strong>Design:</strong> classify the approach and justify the design using the procedures described.</span></li><li><span><strong>Data:</strong> identify the sample, recruitment, variables or qualitative focus, and measurements. Mark missing details as not reported.</span></li><li><span><strong>Claims:</strong> compare the conclusion with the evidence, identify a concrete limitation and propose a targeted improvement.</span></li></ol><div class="notice warn"><strong>High-cost confusions</strong><p>Correlation is not causation. Random sampling is not random assignment. Reliability is not validity. Two collection methods do not establish mixed methods without integration. A research gap differs from a limitation of the current study.</p></div><div class="button-row">${btn('Practise article analysis','nav','secondary small','data-view="articles"')}</div></section>`+D.lessons.map(l=>`<section><div class="section-title"><h2>${esc(l.title)}</h2></div><p class="lesson-lead">${esc(l.lead)}</p>${visual(l.topic)}${l.sections.map(s=>`<article class="lesson-section"><h3>${esc(s.title)}</h3><p class="body">${esc(s.body)}</p><div class="example"><strong>Applied example</strong>${esc(s.example)}</div><div class="trap"><strong>Exam trap</strong>${esc(s.trap)}</div>${source(s.source)}</article>`).join('')}<h3 style="margin-top:28px">Lecture wording: important nuances</h3>${l.corrections.map(c=>`<div class="notice"><strong>${esc(c.claim)}</strong><p>${esc(c.clarification)}</p>${source(c.source)}</div>`).join('')}<div class="section-title"><h3>Terminology</h3></div><dl class="glossary">${l.glossary.map(g=>`<div><dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd></div>`).join('')}</dl><div class="button-row">${btn('Practise this topic','topic-practice','green',`data-topic="${l.topic}"`)}</div></section>`).join('')+`<section><div class="section-title"><h2>Sources</h2></div><p class="small muted">References use physical PDF page numbers, counting covers.</p><dl class="glossary">${Object.entries(DOCS).map(([key,label])=>`<div><dt>${esc(key)}</dt><dd>${esc(label)}</dd></div>`).join('')}</dl><div class="button-row">${btn('Course sources & official clarifications','nav','secondary','data-view="sources"')}</div></section>`;}
function practiceSetup(){return head('Question bank','Learn by making the distinction.','Every question has one best answer. Most require applying an idea to a study rather than recalling a definition.')+`<div class="split"><section class="panel"><h2>Build a practice session</h2><div class="filters"><label class="field">Topic<select id="practice-topic"><option value="all">All five topics</option>${C.topics.map(t=>`<option value="${t}">${META[t].short}</option>`).join('')}</select></label><label class="field">Level<select id="practice-level"><option value="all">All levels</option><option value="core">Core distinctions</option><option value="applied">Applied</option><option value="challenge">Challenge</option></select></label><label class="field">Questions<select id="practice-count"><option>10</option><option selected>20</option><option>30</option><option value="all">All matching questions</option></select></label></div>${btn('Start session','start-practice','green')}<p class="source">Answer choices are shuffled. Check each answer to see the reasoning and the relevant lecture pages.</p>${state.practice?`<div class="notice green">You have a saved session at question ${Math.min(state.practice.index+1,state.practice.items.length)} of ${state.practice.items.length}.<div class="button-row">${btn('Resume session','resume-practice','secondary small')}</div></div>`:''}</section><aside class="panel"><h3>Use errors as clues</h3><ul><li>Read the exact wording: “associated with” does not mean “causes”.</li><li>Identify the design from what researchers did.</li><li>Check why each distractor fails, even when you answered correctly.</li><li>Bookmark uncertain questions for a second pass.</li></ul><div class="notice">Immediate explanations belong to practice mode. Mock exams withhold them until submission.</div></aside></div>`;}
function optionsHTML(q,item,graded=false){return `<fieldset class="options"><legend class="sr-only">Choose one answer</legend>${item.order.map((originalIndex,displayIndex)=>`<label class="option ${graded&&originalIndex===q.answer?'correct':''} ${graded&&item.selected===originalIndex&&originalIndex!==q.answer?'incorrect':''}"><input type="radio" name="answer" value="${originalIndex}" ${item.selected===originalIndex?'checked':''} ${graded?'disabled':''}><span class="option-letter">${'ABCD'[displayIndex]}</span><span>${esc(q.options[originalIndex])}${graded&&originalIndex===q.answer?' <strong>· Correct</strong>':''}${graded&&originalIndex===item.selected&&originalIndex!==q.answer?' <strong>· Your answer</strong>':''}</span></label>`).join('')}</fieldset>`;}
function feedback(q,item){const correct=item.selected===q.answer;return `<div class="feedback ${correct?'':'wrong'}" role="status"><h3>${correct?'Correct. Here is the reasoning.':item.selected===null?'Unanswered. Here is the reasoning.':'Not quite. Focus on the distinction.'}</h3><p>${esc(q.explanation)}</p><details class="rationales"><summary>Why each answer does or does not fit</summary>${item.order.map((i,j)=>`<p><strong>${'ABCD'[j]}. ${esc(q.options[i])}</strong><br>${esc(q.distractors[i])}</p>`).join('')}</details>${source(q.source)}</div>`;}
function practice(){if(!state.practice||state.practice.showSetup)return practiceSetup();const p=state.practice;if(p.index>=p.items.length){const score=C.gradeMCQ(p.items,byId);return head('Practice completed','A useful session. Now close the gaps.')+`<section class="panel"><div class="result-number">${score.correct}<span class="muted"> / ${score.total}</span></div><p>Correct answers in this session. Revisit the reasoning before taking another set.</p><div class="button-row">${btn('Review missed questions','session-mistakes','green')}${btn('Build a new session','practice-setup','secondary')}${btn('Open article lab','nav','secondary','data-view="articles"')}</div></section>`;}
const item=p.items[p.index],q=byId[item.qid];return head('Question bank','Practice with feedback.','One best answer. Check it when you are ready.',btn('Session settings','practice-setup','secondary small'))+`<section class="panel"><div class="q-progress"><span>Question ${p.index+1} of ${p.items.length}</span><span>${p.items.filter(x=>x.checked&&x.selected===byId[x.qid].answer).length} correct so far</span></div><div class="question-top"><div><span class="pill">${META[q.topic].short}</span> <span class="pill purple">${q.difficulty}</span></div><button class="link-button" data-action="bookmark" data-id="${q.id}">${state.bookmarks.includes(q.id)?'★ Bookmarked':'☆ Bookmark'}</button></div><h2 class="q-title">${esc(q.prompt)}</h2>${optionsHTML(q,item,item.checked)}${item.checked?feedback(q,item):''}<div class="question-actions"><span class="small muted">${esc(q.concept)}</span>${item.checked?btn(p.index===p.items.length-1?'Finish session':'Next question →','next-practice','green'):btn('Check answer','check-practice','green',item.selected===null?'disabled':'')}</div></section>`;}
function rubricHTML(prompt,item={},mode='lab'){const context=mode==='exam'?`data-index="${item.index}"`:`data-case="${caseId}" data-prompt="${prompt.id}"`;return `<div class="model-answer"><p>${esc(prompt.answer)}</p><ul>${prompt.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><blockquote><strong>Evidence in the passage</strong><br>“${esc(prompt.evidence)}”</blockquote><p class="source">Self-assessment: 1 = all criteria met; ½ = partly met; 0 = missing or unsupported. Reasonable equivalent wording is valid.</p><div class="selfgrade" aria-label="Self-assess this answer">${[[0,'0 · Needs work'],[.5,'½ · Partial'],[1,'1 · Meets criteria']].map(([n,t])=>`<button data-action="grade-${mode}" ${context} data-score="${n}" class="${item.selfScore===n?'selected':''}" aria-pressed="${item.selfScore===n}">${t}</button>`).join('')}</div></div>`;}
function articles(){const c=caseById[caseId];const saved=state.articles[caseId]||{};return head('Article lab','Read for evidence. Write with precision.','Twelve original teaching cases, each with six analytical tasks. These are fictional studies, not published research findings.')+`<div class="filters"><label class="field">Choose an article-style case<select id="article-select">${D.cases.map((c,i)=>`<option value="${c.id}" ${c.id===caseId?'selected':''}>${String(i+1).padStart(2,'0')} · ${esc(c.title)}</option>`).join('')}</select></label>${btn('Show analysis checklist','article-checklist','secondary')}</div><div id="article-checklist" hidden class="notice"><strong>A six-part answer</strong><p>1. Gap: what specific evidence or understanding is missing?<br>2. Question: what does this study ask, and what is its objective?<br>3. Hypothesis: explicitly stated, inferred, or absent?<br>4. Design: what did the researchers actually do?<br>5. Data: who/what was studied, how selected, and what measured?<br>6. Claim: does the evidence support it, and what alternative explanation remains?</p><p class="source">A small sample is not automatically a fatal flaw. Explain which inference is limited and why. Missing details should be marked “not reported”.</p></div><div class="article-layout"><article class="panel passage-panel"><span class="pill purple">Original fictional practice case</span><h2>${esc(c.title)}</h2><p class="passage">${esc(c.passage)}</p><div class="notice green">Write your own answer before opening the model response. Article answers are self-assessed; the site does not pretend to grade free text automatically.</div>${source(c.refs)}</article><section>${c.prompts.map((p,i)=>{const s=saved[p.id]||{};return `<article class="panel article-task"><h3>${i+1}. ${esc(p.prompt)}</h3><label class="sr-only" for="${p.id}">Your answer to task ${i+1}</label><textarea id="${p.id}" data-article="${caseId}" data-prompt="${p.id}" placeholder="State the answer, then point to evidence in the passage…">${esc(s.text||'')}</textarea><details ${s.revealed?'open':''} data-reveal="${p.id}"><summary>Compare with the model answer and rubric</summary>${rubricHTML(p,s)}</details></article>`;}).join('')}</section></div>`;}
function examSetup(){const exam=state.exam;return head('70% MCQ · 30% article analysis','A realistic practice format.','The 70/30 split follows your description. Question count, timing and marking here are practice settings, not a confirmed teacher rubric.')+`<div class="split"><section class="panel"><h2>40 tasks. One focused sitting.</h2><ul><li><strong>28 single-answer MCQs</strong>, balanced across all five topics.</li><li><strong>12 written prompts</strong> about two randomly selected article cases.</li><li>MCQs: 1 point each. Written prompts: self-assessed 0, ½ or 1 point each.</li><li>No answer explanations until you submit or time expires.</li></ul><div class="filters"><label class="field">Practice time limit<select id="exam-minutes"><option value="45">45 minutes</option><option value="60" selected>60 minutes</option><option value="90">90 minutes</option><option value="0">Untimed</option></select></label>${btn('Start a new mock exam','start-exam','green')}</div><p class="source">A new mock replaces the current saved mock. Starting or navigating does not erase your question-bank progress. Your answers autosave in this browser.</p></section><aside class="panel"><h3>Before you begin</h3><p class="small">Use evidence from each excerpt. If a hypothesis, sampling method or design detail is missing, say it is not reported.</p>${exam?`<div class="notice green">${exam.finished?'Your last mock is available for review.':'A mock exam is already in progress. The timer continues while you are away.'}<div class="button-row">${btn(exam.finished?'Open results':'Resume mock','resume-exam','secondary small')}</div></div>`:''}<div class="notice">Written scores are self-reported. They are a revision aid and do not predict your teacher’s mark.</div></aside></div>`;}
function timerText(){const e=state.exam;if(!e?.deadline)return 'Untimed';const n=C.remaining(e.deadline);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function writtenItemHTML(item,reveal){const c=caseById[item.caseId],p=c.prompts.find(p=>p.id===item.promptId);return `<span class="pill purple">Article analysis · ${esc(p.kind)}</span><details class="exam-excerpt" open><summary>${esc(c.title)} · original fictional passage</summary><p>${esc(c.passage)}</p></details><h2 class="q-title">${esc(p.prompt)}</h2><label class="sr-only" for="exam-answer">Your written answer</label><textarea class="answer" id="exam-answer" ${reveal?'readonly':''} placeholder="Write an evidence-based answer…">${esc(item.text||'')}</textarea>${reveal?rubricHTML(p,{...item,index:state.exam.index},'exam'):''}`;}
function exam(){const e=state.exam;if(!e||e.showSetup)return examSetup();if(e.finished&&e.showResults!==false)return examResults();const item=e.items[e.index];return head(e.finished?'Submitted mock · answer review':'Mock exam in progress',`Task ${e.index+1} of ${e.items.length}`,e.finished?'MCQ answers are graded. Use the rubric to self-assess each written response.':'One answer per MCQ. You can move between tasks before submission.',`<div class="exam-meta">${!e.finished?`<span class="timer" id="timer" aria-label="Time remaining">${timerText()}</span>`:''}${btn(e.finished?'Results summary':'Save & return later',e.finished?'exam-results':'exam-setup','secondary small')}</div>`)+`<div class="exam-layout"><section class="panel">${item.kind==='mcq'?`<div class="question-top"><span class="pill">${META[byId[item.qid].topic].short}</span><span class="pill purple">Single answer</span></div><h2 class="q-title">${esc(byId[item.qid].prompt)}</h2>${optionsHTML(byId[item.qid],item,e.finished)}${e.finished?feedback(byId[item.qid],item):''}`:writtenItemHTML(item,e.finished)}<div class="question-actions">${btn('← Previous','exam-prev','secondary',e.index===0?'disabled':'')}${e.index<e.items.length-1?btn('Next →','exam-next','green'):e.finished?btn('Results summary','exam-results','green'):btn('Submit mock exam','confirm-submit','green')}</div>${confirmExam&&!e.finished?confirmSubmitHTML():''}</section><aside class="panel exam-aside"><h3>Your answer sheet</h3><p class="muted">1–28 · MCQ<br>29–40 · Article analysis</p><div class="exam-nav">${e.items.map((x,i)=>`<button data-action="exam-jump" data-index="${i}" class="${x.kind==='mcq'?(x.selected!==null?'done':''):(x.text?.trim()?'done':'')} ${i===e.index?'current':''}" aria-label="Task ${i+1}${x.kind==='mcq'?(x.selected!==null?', answered':', unanswered'):(x.text?.trim()?', answer drafted':', unanswered')}">${i+1}</button>`).join('')}</div><p class="source">Shaded = answered or drafted.<br>Dark = current task.</p>${!e.finished?`<div class="button-row">${btn('Submit exam','confirm-submit','secondary small')}</div>`:''}</aside></div>`;}
function confirmSubmitHTML(){const un=state.exam.items.filter(x=>x.kind==='mcq'?x.selected===null:!x.text?.trim()).length;return `<div class="confirm-box" role="alert"><strong>Submit this mock?</strong><p>${un} task${un===1?'':'s'} ${un===1?'is':'are'} unanswered. Answers will be locked after submission.</p><div class="button-row">${btn('Submit and see results','submit-exam','green small')}${btn('Keep working','cancel-submit','secondary small')}</div></div>`;}
function examResults(){const e=state.exam,score=C.examScore(e,byId);return head('Mock exam results',score.complete?`${score.percent}% · combined practice score`:'MCQs scored. Written review is next.','The combined score uses 70% MCQ marks and 30% self-assessed article marks.')+`<div class="result-grid"><section class="panel"><span class="eyebrow">Automatically marked</span><div class="result-number">${score.mcq.correct}<span class="muted"> / 28</span></div><p>Single-answer multiple choice</p><div class="button-row">${btn('Review MCQ answers','review-exam','secondary small','data-index="0"')}</div></section><section class="panel"><span class="eyebrow">Self-assessed with rubrics</span><div class="result-number">${score.writtenGraded===score.writtenTotal?score.writtenPoints:'—'}<span class="muted"> / 12</span></div><p>${score.writtenGraded} of 12 written prompts assessed</p><div class="button-row">${btn('Review written answers','review-exam','green small',`data-index="${Math.max(28,e.items.findIndex(x=>x.kind==='written'&&x.selfScore===null))}"`)}</div></section></div><div class="notice">${score.complete?'Written marks are your own assessment against the displayed criteria, not an automatic evaluation or a predicted exam grade.':'Your final percentage appears only after all 12 written answers are self-assessed. Read your answer, compare the rubric criteria, then choose 0, ½ or 1.'}</div>${e.expired?'<p class="small muted">This mock was submitted automatically when the timer expired.</p>':''}<div class="button-row">${btn('New mock settings','exam-setup','secondary')}${btn('Review weak topics','nav','secondary','data-view="review"')}${btn('Export this result','export-exam','secondary')}</div>`;}
function review(){const stats=C.topicStats(state.attempts,D.questions);const wrong=D.questions.filter(q=>state.attempts[q.id]&&!state.attempts[q.id].correct),book=D.questions.filter(q=>state.bookmarks.includes(q.id));let list=(reviewMode==='bookmarks'?book:wrong).filter(q=>!search||`${q.prompt} ${q.concept}`.toLowerCase().includes(search.toLowerCase()));return head('Review & progress','Turn uncertain answers into clear ones.','Topic progress uses your latest graded answer to each unique question, not repeated attempts.')+`<div class="table-wrap panel"><table class="compare"><thead><tr><th>Topic</th><th>Practised</th><th>Latest correct</th><th>Accuracy on practised items</th></tr></thead><tbody>${stats.map(s=>`<tr><td>${META[s.topic].short}</td><td>${s.seen} / ${s.total}</td><td>${s.correct}</td><td>${s.seen?Math.round(100*s.correct/s.seen)+'%':'Not started'}</td></tr>`).join('')}</tbody></table></div><div class="section-title"><h2>Your review queue</h2></div><div class="tab-row"><button class="${reviewMode==='mistakes'?'active':''}" data-action="review-mode" data-mode="mistakes">Needs work · ${wrong.length}</button><button class="${reviewMode==='bookmarks'?'active':''}" data-action="review-mode" data-mode="bookmarks">Bookmarked · ${book.length}</button></div><label class="sr-only" for="review-search">Search review questions</label><input class="search-box" type="search" id="review-search" value="${esc(search)}" placeholder="Find a question or concept…"><div class="button-row">${btn('Practise this queue','practice-queue','green',list.length?'':'disabled')}${btn('Export all progress','export-progress','secondary')}</div>${list.length?`<div class="review-list">${list.map(q=>`<article class="review-row"><div><strong>${esc(q.prompt)}</strong><p>${META[q.topic].short} · ${esc(q.concept)}</p></div>${btn('Practise','one-question','secondary small',`data-id="${q.id}"`)}</article>`).join('')}</div>`:`<div class="panel empty" style="margin-top:24px"><h2>${search?'No matching questions':reviewMode==='bookmarks'?'No bookmarks yet':'No questions waiting for review'}</h2><p>${search?'Try a different word.':'Complete some practice questions and your review queue will appear here.'}</p></div>`}<div class="section-title"><h2>Privacy and storage</h2></div><p class="data-note">Answers and progress stay in local storage on this browser and device. Private browsing, clearing site data or changing browsers can remove or hide that progress. Export a copy if you want a record. No account or AI text-grading service receives your answers.</p><div class="button-row">${btn('Clear saved progress…','ask-reset','danger small')}</div><div id="reset-confirm" hidden class="confirm-box"><p>This removes all saved answers, bookmarks, practice sessions and exams from this browser. It cannot be undone.</p><div class="button-row">${btn('Clear all progress','reset-progress','danger small')}${btn('Cancel','cancel-reset','secondary small')}</div></div>`;}
function sources(){return head('Sources & accuracy','Grounded in your course.','PDF page numbers count from the first page of each supplied file, including covers.')+`<section class="panel"><h2>Your six course documents</h2><ul class="source-list"><li><strong>Lecture 1_RMT.pdf · 21 pages</strong>Foundations, the research process, approaches, questions, hypotheses and scholarly communication.</li><li><strong>Lecture 2 (1).pdf · 22 pages</strong>IMRAD, methods reporting, results and discussion; the five article-analysis tasks on page 22.</li><li><strong>Lecture 3.pdf · 41 pages</strong>Academic databases, subject coverage, search and reference management.</li><li><strong>Lecture 4 (2).pdf · 23 pages</strong>Methodology, data collection and analysis.</li><li><strong>Week-3. Practice.pdf · 5 pages</strong>Search strategy, citation comparison and database exercises.</li><li><strong>Week-4. Practice.pdf · 26 pages</strong>Qualitative strategies, quantitative and mixed designs; design justification and critique.</li></ul><p class="small muted">This preparation site contains original explanations and questions. Lecture PDFs are not redistributed here.</p></section><div class="section-title"><h2>How to interpret the practice material</h2></div><div class="notice"><strong>Questions and article passages are original teaching material.</strong><p>The 12 article cases and all numerical results inside them are fictional. They are designed to practise your lecturer’s analytical tasks, not to report real scientific findings.</p></div><div class="notice green"><strong>Lecture references identify the conceptual basis.</strong><p>Some applications go beyond the exact slide wording. The guide flags important simplifications, including sampling versus assignment, free search versus full-text access and correlation versus causation. Database record counts change and are not treated as facts to memorize.</p></div><div class="notice warn"><strong>Mock-exam settings are an approximation.</strong><p>You confirmed that MCQs have one correct answer and make up 70%. This site uses a 28/12 task split with equal maximum points. Exact exam duration, article-task count and your teacher’s written-answer rubric are not confirmed.</p></div><div class="section-title"><h2>Official database clarifications</h2></div><div class="panel"><ul class="source-list">${(D.verification||[]).map(x=>`<li><strong>${esc(x.title||x.name||x.organization||x.provider||'Official documentation')}</strong>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:''}<p class="small muted">${esc(Array.isArray(x.verified_facts)?x.verified_facts.join(' '):x.fact||x.summary||'')}</p></li>`).join('')}</ul></div>`;}
function render(){if(!['overview','learn','practice','articles','exam','review','sources','allnotes'].includes(view))view='overview';$('#app').innerHTML=shell(({overview,learn,practice,articles,exam,review,sources,allnotes})[view]());bind();}
function createPractice(questions){if(!questions.length){toast('No questions match those filters. Try another level or topic.');return;}state.practice={items:questions.map(C.newItem),index:0,showSetup:false};save();go('practice');}
function record(q,item){if(item.selected===null)return;state.attempts[q.id]={correct:item.selected===q.answer,selected:item.selected,at:new Date().toISOString(),attempts:(state.attempts[q.id]?.attempts||0)+1};}
function submitExam(expired=false){const e=state.exam;if(!e||e.finished)return;e.finished=true;e.expired=expired;e.showResults=true;e.showSetup=false;e.finishedAt=new Date().toISOString();e.items.filter(x=>x.kind==='mcq').forEach(x=>record(byId[x.qid],x));state.history.unshift({at:e.finishedAt,mcq:C.gradeMCQ(e.items,byId),expired});state.history=state.history.slice(0,30);confirmExam=false;save();if(view==='exam')render();else toast('Your mock timer ended. Answers have been saved and submitted.');}
function exportJSON(data,name){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function action(name,el){switch(name){
case'nav':go(el.dataset.view);break;
case'learn-topic':topic=el.dataset.topic;go('learn');break;
case'topic-practice':createPractice(C.selectQuestions(D.questions,{topic:el.dataset.topic,count:20}));break;
case'print':$$('.lesson-section').forEach(x=>x.open=true);window.print();break;
case'expand-lessons':$$('.lesson-section').forEach(x=>x.open=true);break;
case'practice-setup':if(state.practice)state.practice.showSetup=true;save();go('practice');break;
case'start-practice':createPractice(C.selectQuestions(D.questions,{topic:$('#practice-topic').value,difficulty:$('#practice-level').value,count:$('#practice-count').value}));break;
case'resume-practice':state.practice.showSetup=false;save();go('practice');break;
case'check-practice':{const p=state.practice,item=p.items[p.index];if(item.selected===null||item.checked)return;item.checked=true;record(byId[item.qid],item);save();render();break;}
case'next-practice':state.practice.index++;save();render();window.scrollTo({top:0,behavior:'instant'});break;
case'bookmark':{const id=el.dataset.id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();el.textContent=state.bookmarks.includes(id)?'★ Bookmarked':'☆ Bookmark';break;}
case'session-mistakes':{const ids=state.practice.items.filter(x=>x.selected!==byId[x.qid].answer).map(x=>x.qid);if(ids.length)createPractice(C.selectQuestions(D.questions,{ids,count:'all'}));else toast('You answered every question correctly. Try an article case next.');break;}
case'article-checklist':$('#article-checklist').hidden=!$('#article-checklist').hidden;break;
case'grade-lab':{const c=el.dataset.case,p=el.dataset.prompt;state.articles[c]??={};state.articles[c][p]??={};state.articles[c][p].selfScore=Number(el.dataset.score);state.articles[c][p].revealed=true;save();const y=window.scrollY;render();window.scrollTo(0,y);break;}
case'exam-setup':if(state.exam)state.exam.showSetup=true;save();go('exam');break;
case'start-exam':{if(state.exam&&!state.exam.finished&&!el.dataset.confirmed){const box=document.createElement('div');box.className='confirm-box';box.innerHTML=`<p>A mock is in progress. Starting another replaces it.</p><div class="button-row">${btn('Replace current mock','replace-exam','danger small')}${btn('Resume instead','resume-exam','secondary small')}</div>`;el.disabled=true;el.parentElement.after(box);box.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));return;}const minutes=Number($('#exam-minutes').value);const items=C.examQuestions(D.questions,28).map(C.newItem);C.shuffle(D.cases).slice(0,2).forEach(c=>c.prompts.forEach(p=>items.push({kind:'written',caseId:c.id,promptId:p.id,text:'',selfScore:null})));state.exam={items,index:0,deadline:minutes?Date.now()+minutes*60000:null,startedAt:new Date().toISOString(),finished:false,showSetup:false};save();go('exam');break;}
case'replace-exam':{const start=$('[data-action="start-exam"]');start.dataset.confirmed='true';action('start-exam',start);break;}
case'resume-exam':state.exam.showSetup=false;save();go('exam');break;
case'exam-prev':case'exam-next':state.exam.index+=name==='exam-next'?1:-1;confirmExam=false;save();render();window.scrollTo({top:0,behavior:'instant'});break;
case'exam-jump':state.exam.index=Number(el.dataset.index);confirmExam=false;save();render();window.scrollTo({top:0,behavior:'instant'});break;
case'confirm-submit':confirmExam=true;render();$('.confirm-box')?.scrollIntoView({block:'nearest'});break;
case'cancel-submit':confirmExam=false;render();break;
case'submit-exam':submitExam();window.scrollTo({top:0,behavior:'instant'});break;
case'exam-results':state.exam.showResults=true;save();render();window.scrollTo({top:0,behavior:'instant'});break;
case'review-exam':state.exam.index=Number(el.dataset.index);state.exam.showResults=false;state.exam.showSetup=false;save();render();window.scrollTo({top:0,behavior:'instant'});break;
case'grade-exam':{state.exam.items[Number(el.dataset.index)].selfScore=Number(el.dataset.score);save();const y=scrollY;render();scrollTo(0,y);break;}
case'export-exam':exportJSON({note:'Original practice mock. Written scores are self-assessed.',score:C.examScore(state.exam,byId),exam:state.exam},'research-methods-mock-result.json');break;
case'review-mode':reviewMode=el.dataset.mode;search='';render();break;
case'practice-queue':{const ids=D.questions.filter(q=>(reviewMode==='bookmarks'?state.bookmarks.includes(q.id):state.attempts[q.id]&&!state.attempts[q.id].correct)&&(!search||`${q.prompt} ${q.concept}`.toLowerCase().includes(search.toLowerCase()))).map(q=>q.id);createPractice(C.selectQuestions(D.questions,{ids,count:'all'}));break;}
case'one-question':createPractice([byId[el.dataset.id]]);break;
case'export-progress':exportJSON(state,'research-methods-progress.json');break;
case'ask-reset':$('#reset-confirm').hidden=false;break;
case'cancel-reset':$('#reset-confirm').hidden=true;break;
case'reset-progress':state=blank();save();render();toast('Saved progress cleared.');break;
}}
function bind(){$$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b)));$$('input[name="answer"]').forEach(input=>input.addEventListener('change',()=>{const item=view==='exam'?state.exam.items[state.exam.index]:state.practice.items[state.practice.index];if(view==='exam'&&state.exam.finished||item.checked)return;item.selected=Number(input.value);save();if(view==='practice'){const b=$('[data-action="check-practice"]');if(b)b.disabled=false;}else{const n=$(`[data-action="exam-jump"][data-index="${state.exam.index}"]`);n?.classList.add('done');n?.setAttribute('aria-label',`Task ${state.exam.index+1}, answered`);}}));
$('#article-select')?.addEventListener('change',e=>{caseId=e.target.value;state.activeCase=caseId;save();render();});
$$('textarea[data-article]').forEach(t=>t.addEventListener('input',()=>{const c=t.dataset.article,p=t.dataset.prompt;state.articles[c]??={};state.articles[c][p]??={};state.articles[c][p].text=t.value;save();}));
$$('details[data-reveal]').forEach(d=>d.addEventListener('toggle',()=>{state.articles[caseId]??={};state.articles[caseId][d.dataset.reveal]??={};state.articles[caseId][d.dataset.reveal].revealed=d.open;save();}));
$('#exam-answer')?.addEventListener('input',e=>{if(state.exam.finished)return;state.exam.items[state.exam.index].text=e.target.value;save();const b=$(`[data-action="exam-jump"][data-index="${state.exam.index}"]`);b?.classList.toggle('done',!!e.target.value.trim());b?.setAttribute('aria-label',`Task ${state.exam.index+1}${e.target.value.trim()?', answer drafted':', unanswered'}`);});
$('#review-search')?.addEventListener('input',e=>{const at=e.target.selectionStart;search=e.target.value;render();$('#review-search').focus();try{$('#review-search').setSelectionRange(at,at);}catch{}});
}
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){$('#main')?.focus();return;}view=location.hash.slice(1)||'overview';render();});
setInterval(()=>{const e=state.exam;if(!e||e.finished)return;if(e.deadline&&C.remaining(e.deadline)<=0){submitExam(true);return;}const timer=$('#timer');if(timer){timer.textContent=timerText();timer.classList.toggle('urgent',e.deadline&&C.remaining(e.deadline)<300);}},1000);
render();if(state.exam&&!state.exam.finished&&state.exam.deadline&&C.remaining(state.exam.deadline)===0)submitExam(true);
})();
</script></body>
</html>
