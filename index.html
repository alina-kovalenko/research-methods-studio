:root{--paper:#f5f4ef;--white:#fffefa;--ink:#202830;--muted:#636b71;--line:#dcded6;--green:#315b49;--pale:#e4ece5;--lime:#d9eb98;--purple:#665ca6;--lavender:#eae7f5;--red:#a14236;--blue:#325d88;--radius:18px}

<body><a class="skip" href="#main">Skip to content</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>window.RMT_DATA = {"version":1,"questions":[{"id":"f01","topic":"foundations","difficulty":"applied","prompt":"A university wants to understand how first-year students experience uncertainty when choosing a major. Which plan best fits the lecture's qualitative approach?","options":["Use interviews to explore students' decision-making experiences.","Compare the average uncertainty scores of two year groups.","Test whether uncertainty scores predict examination marks.","Estimate the percentage of students who change their major."],"answer":0,"explanation":"Lecture 1 describes qualitative research as focused on concepts and experiences. The choice follows the purpose of the investigation, rather than the prestige of a particular tool.","distractors":["Correct: the purpose is to understand experiences and meanings through detailed accounts.","This numerical comparison fits a quantitative purpose more closely.","Testing a numerical relationship is a quantitative task.","Estimating a percentage primarily requires quantitative data."],"source":{"doc":"L1","pages":"4, 8"},"concept":"Qualitative approach"},{"id":"f02","topic":"foundations","difficulty":"applied","prompt":"A researcher collects numerical response times and uses statistical analysis to compare two interfaces. How should this study be classified from the information given?","options":["A literature review, because the interfaces have prior designs.","Qualitative, because users interact with the interfaces.","Quantitative, because it analyzes numerical measurements.","Mixed methods, because two interfaces are compared."],"answer":2,"explanation":"The lecture links quantitative research to numerical data and statistical analysis. The number of interfaces or the involvement of people does not determine whether the study is mixed methods.","distractors":["The study collects primary measurements rather than primarily synthesizing literature.","Human involvement alone does not make a study qualitative.","Correct: the described evidence and analysis are numerical and statistical.","Two comparison conditions do not constitute two research approaches."],"source":{"doc":"L1","pages":"4"},"concept":"Quantitative approach"},{"id":"f03","topic":"foundations","difficulty":"applied","prompt":"A project first measures how often students abandon an online course, then interviews selected students to explain the patterns and connects both sets of findings. Which approach is the best fit?","options":["Quantitative only, because the project begins with counts.","Qualitative only, because interviews occur at the end.","A case study only, because the project concerns students.","Mixed methods, combining counts and interview accounts."],"answer":3,"explanation":"Lecture 1 defines mixed methods as a combination of qualitative and quantitative approaches. Application beyond the slide wording: explicitly connecting the two sets of findings makes the rationale for that combination clear.","distractors":["The later qualitative inquiry is part of the described research, so this is incomplete.","This overlooks the numerical stage and its contribution to the overall study.","Studying a particular population does not by itself establish a case-study design.","Correct: the project combines quantitative and qualitative evidence to address one problem."],"source":{"doc":"L1","pages":"4"},"concept":"Mixed methods integration"},{"id":"f04","topic":"foundations","difficulty":"applied","prompt":"A proposal's objective is to compare first-year students' attendance across morning and afternoon laboratory sessions this semester. Which research question is most closely aligned?","options":["Why do university students prefer some teaching styles over others?","What policy should every university adopt to improve academic success?","How has the university's total enrollment changed over ten years?","How does attendance compare across the specified sessions this semester?"],"answer":3,"explanation":"The lecture emphasizes clear, focused, researchable questions aligned with objectives. The best question preserves what the proposal actually intends to compare.","distractors":["This changes the outcome and expands the focus beyond the stated attendance comparison.","This is broader than the defined comparison and cannot be answered by that objective alone.","Enrollment trends do not address attendance in the specified sessions.","Correct: the question matches the population, comparison, outcome, and period in the objective."],"source":{"doc":"L1","pages":"5"},"concept":"Question–objective alignment"},{"id":"f05","topic":"foundations","difficulty":"challenge","prompt":"A team asks, 'How does all technology affect all learners everywhere?' Which revision best addresses the problem identified on the research-question slide?","options":["What will be the complete future of education in the next century?","How is weekly learning-platform use associated with first-year students' course completion at University X this semester?","How does modern technology transform every aspect of learning, work, communication, motivation, society, and well-being across the world?","Why is technology unquestionably beneficial for every university learner?"],"answer":1,"explanation":"The lecture requires clarity, focus, and researchability. Application beyond the slide wording: defining the population, setting, variables, and period is one practical way to make a broad topic manageable.","distractors":["This remains too broad and poorly specified for the proposed empirical study.","Correct: this identifies a setting, population, measurable relationship, and period that can be investigated.","This expands the scope and leaves the central terms broad.","This assumes the answer and retains an unjustifiably universal scope."],"source":{"doc":"L1","pages":"5, 18"},"concept":"Researchability and scope"},{"id":"f06","topic":"foundations","difficulty":"challenge","prompt":"Consider these draft statements: (1) Students struggle to locate relevant sources. (2) How does search training affect source-selection accuracy? (3) To compare accuracy before and after training. (4) Accuracy will be higher after training. Which is the hypothesis?","options":["Statement 2, because it asks what the research will investigate.","Statement 3, because it specifies the planned research task.","Statement 4, because it predicts the expected relationship.","Statement 1, because it identifies the practical difficulty."],"answer":2,"explanation":"The lecture links problems, research questions, objectives, and hypotheses in planning. Application beyond the slide wording: their functional distinction is problem = difficulty, question = inquiry, objective = intended task, and hypothesis = testable prediction.","distractors":["That is the research question; it asks rather than predicts.","That is the objective; it describes what the study aims to accomplish.","Correct: it states an expected outcome that can be compared with evidence.","That is the motivating problem, rather than a prediction about study outcomes."],"source":{"doc":"L1","pages":"5, 14"},"concept":"Problem, question, objective, hypothesis"},{"id":"f07","topic":"foundations","difficulty":"applied","prompt":"A student writes one paragraph summarizing each source but never compares the studies. Which revision most directly adds the synthesis emphasized in the lecture?","options":["Replace the summaries with a longer list of database search terms.","Compare studies' shared findings and methodological differences.","Add more quotations while leaving each study in isolation.","Arrange the same source summaries alphabetically by author surname."],"answer":1,"explanation":"The literature-review slide lists searching, reviewing, and synthesizing existing research. Application beyond the slide wording: comparing patterns and disagreements is a practical way to move from isolated summaries to synthesis.","distractors":["Search terms document retrieval, but do not synthesize existing findings.","Correct: synthesis connects sources and identifies patterns, agreement, and disagreement.","More quotation does not by itself connect or critically compare sources.","This changes organization but does not create relationships between studies."],"source":{"doc":"L1","pages":"6"},"concept":"Literature synthesis"},{"id":"f08","topic":"foundations","difficulty":"core","prompt":"Which set of resources is specifically named in Lecture 1 for finding research literature?","options":["Google Scholar, IEEE Xplore, and PubMed.","NVivo, Tableau, and IEEE Xplore.","Excel, Tableau, and SPSS.","SPSS, R, and NVivo."],"answer":0,"explanation":"Lecture 1 separates literature-search resources from analysis and visualization tools. Selecting a tool should start with the task it needs to perform.","distractors":["Correct: all three are listed as literature-review tools.","This mixes analysis, visualization, and literature-search tools.","These are associated with visualization or statistical analysis in the lecture.","These are introduced as analysis tools, not the listed literature-search resources."],"source":{"doc":"L1","pages":"6, 10, 12"},"concept":"Research-tool roles"},{"id":"f09","topic":"foundations","difficulty":"applied","prompt":"A team aims to investigate whether a new teaching activity changes performance. Which design category in Lecture 1 most directly matches that cause-and-effect aim?","options":["A case study documenting one department's history.","A literature review listing previously used classroom tools.","Survey design describing students' current preferences.","Experimental design."],"answer":3,"explanation":"The research-design slide identifies experiments with cause–effect investigations. Application beyond the slide wording: calling a study experimental is not enough; its allocation, comparison conditions, and possible competing explanations still require scrutiny.","distractors":["This provides contextual depth rather than the described test of an activity's effect.","This summarizes prior work rather than carrying out the proposed effect investigation.","Such a survey describes responses; the stated plan does not test the activity's effect.","Correct: the lecture associates experimental design with investigating cause–effect relationships."],"source":{"doc":"L1","pages":"7"},"concept":"Experimental purpose"},{"id":"f10","topic":"foundations","difficulty":"applied","prompt":"Researchers want an in-depth understanding of how one hospital department introduced a scheduling system in its particular organizational context. Which listed design best matches that focus?","options":["A statistical analysis of population-wide accident rates.","An experiment comparing randomized intervention groups.","Case-study design.","A survey estimating preferences across a national population."],"answer":2,"explanation":"The defining feature here is close examination of a specific situation in depth. Application beyond the slide wording: a case study may use several sources of evidence; the design is not defined by just one collection instrument.","distractors":["This changes both the focus and the form of evidence in the scenario.","The scenario specifies contextual depth, not an assigned intervention comparison.","Correct: the lecture describes a case study as an in-depth analysis of a specific situation.","This emphasizes broad estimation rather than the single department's context."],"source":{"doc":"L1","pages":"7"},"concept":"Case-study purpose"},{"id":"f11","topic":"foundations","difficulty":"applied","prompt":"A team needs comparable answers from several hundred students about the frequency of specific study habits. Which data-collection method from the lecture is the most direct match?","options":["A questionnaire with identical frequency items for all respondents.","A review of abstracts about national examination policies.","An open-ended life-history interview with one selected student.","An observer's narrative of one classroom discussion."],"answer":0,"explanation":"Lecture 1 presents surveys and questionnaires as structured collection methods for groups. The chosen method should provide the kind of evidence needed for the research question.","distractors":["Correct: the lecture associates surveys and questionnaires with structured collection from groups.","This collects existing literature, not the specified student responses.","This supplies depth about one person rather than comparable group responses.","This records a particular event rather than the requested individual habit frequencies."],"source":{"doc":"L1","pages":"8"},"concept":"Questionnaire fit"},{"id":"f12","topic":"foundations","difficulty":"applied","prompt":"Researchers record how often library visitors use a help desk while watching the behavior directly. Which data-collection method is described?","options":["Observation.","Interviewing.","Literature synthesis.","Questionnaire administration."],"answer":0,"explanation":"The lecture defines observation as direct recording of behaviors or occurrences. Asking visitors later to report their behavior would involve a different form of data collection.","distractors":["Correct: the researchers directly record behavior as it occurs.","No participant is being asked to describe an experience or answer an interview prompt.","The evidence comes from observed behavior rather than prior publications.","No structured self-report instrument is described."],"source":{"doc":"L1","pages":"8"},"concept":"Observation"},{"id":"f13","topic":"foundations","difficulty":"challenge","prompt":"Lecture 1 describes probability sampling as giving every population member an equal chance. Which interpretation is most accurate when studying sampling more generally?","options":["Any sample with a large enough size becomes a probability sample.","Equal chances describe simple random sampling; probability sampling requires known, nonzero selection probabilities.","Selecting whoever replies first gives every population member a known chance.","Probability sampling requires every selected person to have the same measured outcome."],"answer":1,"explanation":"Application beyond the slide wording: the equal-chance statement on page 9 is a simplification. Probability designs can use unequal probabilities, provided selection probabilities are known and nonzero for population units covered by the design.","distractors":["Increasing sample size does not change a nonrandom selection mechanism.","Correct: this preserves the introductory example while correcting its overly broad definition.","Response order does not supply known population inclusion probabilities.","Selection probability concerns inclusion, not equality of research outcomes."],"source":{"doc":"L1","pages":"9"},"concept":"Probability-sampling qualification"},{"id":"f14","topic":"foundations","difficulty":"applied","prompt":"A researcher recruits available classmates because they can be contacted quickly, without random selection from a defined population. What is the most defensible classification?","options":["An experimental design.","Non-probability sampling.","Mixed-methods research.","Simple random sampling."],"answer":1,"explanation":"The lecture contrasts probability sampling with samples chosen using particular criteria. Application beyond the slide wording: recruiting available classmates is a convenience form of non-probability sampling.","distractors":["The recruitment method does not establish whether an intervention is manipulated.","Correct: availability determines inclusion and the design does not establish known random selection probabilities.","Sampling convenience does not determine whether qualitative and quantitative approaches are combined.","Availability is not equivalent to drawing randomly from a population list."],"source":{"doc":"L1","pages":"9"},"concept":"Non-probability sampling"},{"id":"f15","topic":"foundations","difficulty":"challenge","prompt":"A team surveys 5,000 volunteers from one gaming forum and claims to represent all adults. Which critique best addresses the sampling issue?","options":["The claim becomes valid if the results are presented in a professional chart.","The large response count does not resolve forum-volunteer selection bias.","The claim becomes valid if the sample mean is calculated in SPSS.","The sample must be qualitative because volunteers chose to take part."],"answer":1,"explanation":"The sampling slide stresses choosing an appropriate method. Application beyond the slide wording: increasing the number of respondents does not automatically correct selection bias or justify generalizing from a narrow recruitment source.","distractors":["Presentation quality does not establish population representation.","Correct: the selection mechanism and population coverage remain relevant even when many responses are collected.","Statistical software does not repair how participants entered the sample.","Voluntary participation does not determine the research approach."],"source":{"doc":"L1","pages":"9, 18"},"concept":"Sample size versus selection"},{"id":"f16","topic":"foundations","difficulty":"core","prompt":"Which proposed pairing matches the research tools and purposes given in Lecture 1?","options":["NVivo for qualitative analysis; SPSS for statistical analysis.","NVivo for random participant recruitment; SPSS for informed consent.","NVivo for conference selection; SPSS for interview scheduling.","NVivo for literature searching; SPSS for journal submission."],"answer":0,"explanation":"The tools slide names SPSS for quantitative statistical analysis, R for statistical computing and graphics, and NVivo for qualitative analysis. A tool supports an analysis; naming it does not specify the full analytical procedure.","distractors":["Correct: these are the roles assigned to the two tools on the slide.","The tools do not substitute for the sampling and ethics procedures described elsewhere.","These are administrative tasks, not the listed analysis roles.","Neither role matches the slide's descriptions."],"source":{"doc":"L1","pages":"10"},"concept":"Analysis-tool selection"},{"id":"f17","topic":"foundations","difficulty":"applied","prompt":"A report gives the median and most common commute time among the 80 students who answered its questionnaire. It makes no claim about other students. What type of statistical work is this?","options":["An experimental intervention.","Inferential statistics.","Qualitative content analysis.","Descriptive statistics."],"answer":3,"explanation":"Lecture 1 distinguishes summarizing observed data from drawing conclusions using samples. Mean, median, and mode are given as examples of descriptive statistics.","distractors":["Calculating sample summaries does not introduce or evaluate an intervention.","No inference beyond the observed respondents is described.","The described summaries concern numerical commute times, not coded textual content.","Correct: the report summarizes the observed sample using the median and mode."],"source":{"doc":"L1","pages":"11"},"concept":"Descriptive statistics"},{"id":"f18","topic":"foundations","difficulty":"applied","prompt":"Two reports use the same student sample. Report A states its mean score. Report B uses that sample to estimate the mean score of the university's student population. What is the key distinction?","options":["Both are qualitative because students supplied the data.","A is descriptive; B attempts population inference.","Both are experiments because they compare numerical values.","Report A is inferential; Report B is descriptive."],"answer":1,"explanation":"The lecture presents descriptive statistics as summaries and inferential statistics as conclusions drawn from samples. Application beyond the slide wording: the credibility of Report B's inference depends on the sampling design and analytical assumptions.","distractors":["The identity of the data providers does not determine whether the analysis is qualitative.","Correct: A summarizes observed data, while B extends a claim to a population.","No assigned intervention or experimental comparison is described.","This reverses the roles of sample summary and population inference."],"source":{"doc":"L1","pages":"11"},"concept":"Description versus inference"},{"id":"f19","topic":"foundations","difficulty":"challenge","prompt":"A student reports, 'I used R, so my study is valid.' Which response best follows the lecture's wider research process?","options":["The claim would be justified if the same data were also opened in NVivo.","The claim is false because R cannot analyze numerical data.","The claim would be justified if SPSS replaced R.","Tool choice alone does not establish methodological quality."],"answer":3,"explanation":"Lecture 1 treats tools as part of research alongside questions, design, collection, and analysis. Its pitfalls slide warns about weak collection and analysis; using a named program does not remove those risks.","distractors":["Using more packages does not demonstrate quality or methodological fit.","The lecture explicitly describes R as statistical-computing software.","Changing software does not establish that the research decisions are appropriate.","Correct: software is one support within a chain of research decisions."],"source":{"doc":"L1","pages":"5, 7–11, 18"},"concept":"Tools versus methodological quality"},{"id":"f20","topic":"foundations","difficulty":"applied","prompt":"A chart is intended to help readers compare attendance in four courses. Which revision best serves the visualization purpose described in the lecture?","options":["Replace the values with decorative icons whose sizes are unrelated to attendance.","Remove the labels so that the chart appears less crowded.","Use a clearly labeled visual that makes the course values easy to compare.","Use a more elaborate chart even if course labels become unreadable."],"answer":2,"explanation":"The lecture says visualization should enhance understanding of data. Application beyond the slide wording: clear labels and a display suited to the comparison help that purpose; decoration alone does not.","distractors":["The display would no longer communicate the comparison faithfully.","Readers need to know what the displayed values represent.","Correct: the slide emphasizes improving understanding through visual representation.","Visual complexity can defeat the stated goal of understanding."],"source":{"doc":"L1","pages":"12"},"concept":"Purposeful visualization"},{"id":"f21","topic":"foundations","difficulty":"challenge","prompt":"Participants agree to answer a survey after being told that only the research team will see identifiable responses. A team member proposes publishing the raw named responses with an open dataset. What is the best response?","options":["Publish the names if the dataset contains a large number of respondents.","Check consent and confidentiality before releasing names.","Publish the names because data sharing is an emerging research trend.","Publish the names if the analysis has already been peer reviewed."],"answer":1,"explanation":"The ethics slide names informed consent and confidentiality, while a later slide names data sharing as a trend. Application beyond the slide wording: these commitments must be considered together; openness does not automatically authorize releasing identifiable information.","distractors":["A larger dataset does not cancel obligations regarding identifiable data.","Correct: the planned release conflicts with the confidentiality commitment described in the scenario.","A general trend does not override the specific consent and confidentiality conditions.","Peer review does not change what participants agreed to."],"source":{"doc":"L1","pages":"13, 19"},"concept":"Consent, confidentiality, and sharing"},{"id":"f22","topic":"foundations","difficulty":"applied","prompt":"A project team writes its desired conclusion first and plans to exclude every observation that disagrees. Which lecture principle is most directly violated?","options":["Combining research approaches.","Choosing a relevant publication venue.","Creating an informative poster.","Avoiding bias in research."],"answer":3,"explanation":"Lecture 1 explicitly includes avoiding bias among ethical considerations. Application beyond the slide wording: exclusions should have a defensible methodological basis rather than be chosen merely to protect a preferred conclusion.","distractors":["The problem is selective evidence handling, regardless of the approaches used.","Venue fit matters, but it is not the immediate problem in the proposed evidence handling.","Poster design does not address the biased exclusion rule.","Correct: selectively retaining only supportive evidence biases the investigation."],"source":{"doc":"L1","pages":"13, 18"},"concept":"Avoiding selective evidence"},{"id":"f23","topic":"foundations","difficulty":"core","prompt":"Which set most closely matches the proposal components explicitly listed in Lecture 1?","options":["Title, abstract, introduction, and methodology.","Final findings, reviewer reports, acceptance letter, and journal issue.","Poster, oral presentation, bibliography quiz, and peer ranking.","Dataset, software license, invoice, and conference timetable."],"answer":0,"explanation":"The proposal slide lists a title, abstract, introduction, and methodology. It also stresses clear objectives and hypotheses and alignment with academic standards, rather than implying that this short list exhausts every institution's requirements.","distractors":["Correct: these are the listed key components.","These describe later research or publication materials rather than the listed proposal components.","This does not match the proposal components on the slide.","These may be project materials, but they are not the listed proposal structure."],"source":{"doc":"L1","pages":"14"},"concept":"Proposal structure"},{"id":"f24","topic":"foundations","difficulty":"challenge","prompt":"A qualitative proposal aims to explore experiences of returning to university after a long absence. Its objectives and open-ended questions are clear, but it does not predict an outcome. How should the lecture's emphasis on hypotheses be interpreted?","options":["Assess whether the design needs a hypothesis; do not invent one merely to fill a heading.","Reject the proposal because every valid study must contain a directional hypothesis.","Treat the objectives as confirmed results because no hypothesis is stated.","Convert each interview question into a numerical prediction, regardless of the research aim."],"answer":0,"explanation":"Application beyond the slide wording: page 14 highlights clear hypotheses, but not every design requires an explicit predictive hypothesis. The earlier emphasis on focused questions and qualitative understanding supports assessing coherence with the actual aim.","distractors":["Correct: exploratory aims can be organized around questions without a predicted outcome.","The lecture's emphasis should not be expanded into that universal rule.","Objectives describe intended work, not findings.","This would force the inquiry into a form not justified by the stated aim."],"source":{"doc":"L1","pages":"4–5, 14"},"concept":"Hypotheses are design-dependent"},{"id":"f25","topic":"foundations","difficulty":"applied","prompt":"A conference poster contains complete interview transcripts in tiny text, and visitors cannot identify the research question or finding. Which change most directly addresses the presentation guidance?","options":["Remove the findings so that the poster has more empty space.","Add more raw transcripts to demonstrate the volume of work completed.","Make the question, approach, and key findings easy to follow.","Replace the research content with an attractive background image."],"answer":2,"explanation":"Lecture 1 emphasizes effective structure, informative posters, and clear communication. Application beyond the slide wording: selecting the essential research story for the audience is more useful than displaying every raw observation.","distractors":["Space alone does not make the research informative.","Increasing detail would intensify the stated communication problem.","Correct: this supports the lecture's emphasis on informative presentation and clear communication.","Visual appeal without substantive information fails the stated purpose."],"source":{"doc":"L1","pages":"15"},"concept":"Research communication"},{"id":"f26","topic":"foundations","difficulty":"applied","prompt":"A team must choose between two journals: one fits its research topic and readership; the other has an unrelated scope but a more attractive website. Which consideration best matches the lecture?","options":["The visual design of the journal website alone.","Whether the journal uses the same analysis software as the authors.","The venue's fit with the research and intended scholarly audience.","Whether the venue allows the team to omit its methods."],"answer":2,"explanation":"The publishing slide begins with choosing the right journal or conference. Application beyond the slide wording: matching subject scope and readership is a practical way to assess that choice.","distractors":["Website appearance does not establish whether the venue is appropriate for the work.","Authors' software does not ordinarily define the scholarly fit of a venue.","Correct: the lecture stresses choosing the right journal or conference.","Omitting necessary methods would weaken the research report rather than improve venue fit."],"source":{"doc":"L1","pages":"16"},"concept":"Publication-venue fit"},{"id":"f27","topic":"foundations","difficulty":"core","prompt":"Which sequence matches the simplified peer-review cycle shown in Lecture 1?","options":["Revision → submission → acceptance → review.","Acceptance → revision → review → submission.","Submission → review → revision → acceptance.","Review → acceptance → submission → revision."],"answer":2,"explanation":"The slide presents submission, review, revision, and acceptance as a simplified cycle. Application beyond the slide wording: actual submissions may be rejected or go through multiple revision rounds, so acceptance is not guaranteed.","distractors":["This places review after acceptance rather than before the revision decision shown.","This reverses the general direction of the slide's publication workflow.","Correct: this is the order presented on the slide.","Review and acceptance do not precede the manuscript's submission in the displayed cycle."],"source":{"doc":"L1","pages":"17"},"concept":"Peer-review cycle"},{"id":"f28","topic":"foundations","difficulty":"challenge","prompt":"An article has passed peer review, so a student concludes that its findings must be correct and no further critical reading is needed. Which response is most defensible?","options":["Peer review replaces the need to describe how the data were collected.","Peer review proves that the findings apply to every population.","Peer review means later studies cannot reasonably disagree.","Review is quality control; the evidence still needs scrutiny."],"answer":3,"explanation":"Application beyond the slide wording: the slide says peer review 'ensures' quality and validity, but this should be read as its intended quality-control role. Review can miss errors and does not exempt a paper from critical appraisal.","distractors":["Readers still need the methods to understand and assess the evidence.","Generalizability depends on the study, not simply its review status.","New evidence or different contexts can challenge published findings.","Correct: review is a critical safeguard, not a guarantee that every claim is true."],"source":{"doc":"L1","pages":"17"},"concept":"Limits of peer review"},{"id":"f29","topic":"foundations","difficulty":"applied","prompt":"A study has an attractive title and a well-designed poster, but its research question is vague, its literature coverage is thin, and its measurements do not address the question. What is the most useful priority?","options":["Repair the question, literature coverage, and measurement alignment.","Add advanced visualization software before revisiting the research design.","Submit quickly so reviewers can determine what the study was meant to investigate.","Increase the number of decorative figures without changing the analysis."],"answer":0,"explanation":"Lecture 1 explicitly identifies unclear questions, inadequate literature review, and poor collection or analysis as pitfalls. Fixing those issues addresses the research's foundation rather than only its presentation.","distractors":["Correct: these are the substantive weaknesses named among the lecture's common pitfalls.","A new display tool will not resolve the misalignment of question and evidence.","Peer review does not substitute for developing a coherent study.","Visual polish does not repair unclear questions or inadequate evidence."],"source":{"doc":"L1","pages":"18"},"concept":"Diagnosing research weaknesses"},{"id":"f30","topic":"foundations","difficulty":"applied","prompt":"A team combines educational theory with machine learning, analyzes a large dataset, and plans to share a responsibly prepared dataset. Which lecture theme does this most directly illustrate?","options":["A guarantee that the work needs no peer review.","A reason to omit clear questions because the dataset is large.","Interdisciplinary work, AI, and data-sharing trends.","A replacement of research design by software selection."],"answer":2,"explanation":"Lecture 1 identifies interdisciplinary research, big data and AI, and open access/data sharing as emerging trends. These developments sit within the research process; they do not eliminate the need for coherent questions, methods, and ethics.","distractors":["Emerging methods do not remove the value of critical review.","Dataset scale does not make research questions unnecessary.","Correct: the scenario combines the three emerging trends named on the slide.","The lecture does not present new tools as a substitute for a research design."],"source":{"doc":"L1","pages":"19–20"},"concept":"Emerging research trends"},{"id":"a01","topic":"articles","difficulty":"applied","prompt":"An article has four passages: why a question matters; how data were obtained; what was observed; and how the findings should be understood. Which sequence best matches IMRAD?","options":["Introduction → Results → Methods → Discussion.","Discussion → Methods → Introduction → Results.","Introduction → Methods → Results → Discussion.","Methods → Introduction → Discussion → Results."],"answer":2,"explanation":"Lecture 2 connects the Introduction with why, Methods with how, Results with what was found, and Discussion with what it means. Recognizing a passage's function is more reliable than merely spotting familiar vocabulary.","distractors":["This places the account of observations before the passage explaining how data were obtained.","This confuses the purpose-setting and interpretation passages.","Correct: the four functions follow the sequence represented by IMRAD.","This does not match the functions in the order stated."],"source":{"doc":"L2","pages":"2, 4, 12, 18–19"},"concept":"IMRAD functions"},{"id":"a02","topic":"articles","difficulty":"applied","prompt":"An introduction claims that remote laboratory teaching is ineffective but gives no references or evidence. Which revision best addresses the lecture's background-of-study guidance?","options":["Support the claim with relevant evidence and a study rationale.","Add unrelated references to increase the citation count.","Move the claim into a table so it appears to be a finding.","Repeat the claim with stronger language to establish a confident tone."],"answer":0,"explanation":"The background slide asks writers to identify the issue, give a rationale, and use literature to support statements. The emphasis is on an evidence-based background, not just a more forceful assertion.","distractors":["Correct: the background should situate the issue and support its statements using literature.","References need to support the relevant statements, not merely accumulate.","Formatting an unsupported assertion does not turn it into evidence.","Confidence does not substitute for support."],"source":{"doc":"L2","pages":"4–5"},"concept":"Evidence in the background"},{"id":"a03","topic":"articles","difficulty":"challenge","prompt":"A draft states: 'Many published systems were evaluated in English only. Whether their accuracy transfers to Kazakh remains untested. We will evaluate the same systems on Kazakh texts.' Which sentence most directly identifies a research gap?","options":["Many published systems were evaluated in English only.","The draft contains no research gap unless a prediction is added.","We will evaluate the same systems on Kazakh texts.","Whether their accuracy transfers to Kazakh remains untested."],"answer":3,"explanation":"Application beyond the slide wording: a research gap is a relevant unresolved or insufficiently addressed issue in existing knowledge. It helps connect the lecture's literature-based background to the study's focus and objectives, but differs from the planned research activity.","distractors":["This describes the existing literature; the next sentence makes the unresolved issue explicit.","A gap can be identified without stating a predictive hypothesis.","This is the planned objective or task rather than the knowledge gap itself.","Correct: this states the specific unresolved knowledge issue that motivates the study."],"source":{"doc":"L2","pages":"4–7, 22"},"concept":"Research gap versus objective"},{"id":"a04","topic":"articles","difficulty":"applied","prompt":"A draft says, 'This study aims to compare two feedback formats for first-year programming students.' What role does this sentence primarily perform?","options":["It states a directional hypothesis.","It reports a result.","It establishes a limitation.","It states the objective."],"answer":3,"explanation":"The objectives slide defines objectives as the focus of the study and what it will achieve. A comparison objective should not be mistaken for either an observed result or a prediction of which condition will perform better.","distractors":["It does not predict which feedback format will produce a higher outcome.","No observation from completed data analysis is reported.","It states an intended task, not a constraint on interpreting findings.","Correct: it specifies the study's intended focus and accomplishment."],"source":{"doc":"L2","pages":"6"},"concept":"Objective"},{"id":"a05","topic":"articles","difficulty":"applied","prompt":"A literature review includes many famous papers but few address the research question. Which change most directly follows Lecture 2?","options":["Replace all research papers with dictionary definitions.","Select and discuss sources according to their relevance to the study.","Keep the sources because author reputation alone establishes relevance.","Remove comparison between sources to make the review shorter."],"answer":1,"explanation":"Lecture 2 asks for literature and studies dealing with the topic being investigated, followed by a relevance check. A useful review supports the actual question rather than functioning as a display of prestigious citations.","distractors":["Definitions cannot replace evidence and studies dealing with the topic.","Correct: the slide explicitly asks writers to check relevance.","Reputation does not make a paper responsive to the current question.","Removing comparison does not solve the relevance problem."],"source":{"doc":"L2","pages":"7"},"concept":"Literature relevance"},{"id":"a06","topic":"articles","difficulty":"challenge","prompt":"A paper lists several variables but gives no explanation of why they should be connected. What would a conceptual or theoretical framework most usefully add?","options":["A guarantee that the proposed relationships will be supported.","A rationale connecting the study's key concepts.","A replacement for describing sampling and data collection.","A second report of the sample's numerical outcomes."],"answer":1,"explanation":"The framework slide emphasizes concepts or theory as a central part of research. Application beyond the slide wording: a framework earns its place by explaining the relationships being investigated; a diagram alone does not supply that reasoning.","distractors":["A framework guides investigation but does not determine the evidence in advance.","Correct: a framework should make the study's conceptual reasoning explicit.","Conceptual reasoning does not substitute for a methods account.","Outcomes belong to the findings; they do not by themselves explain the organizing rationale."],"source":{"doc":"L2","pages":"8"},"concept":"Framework function"},{"id":"a07","topic":"articles","difficulty":"applied","prompt":"A study investigates 'engagement.' Which definition best illustrates the operational definition requested by the lecture?","options":["Engagement is expected to improve after the intervention.","Engagement is a general state of being interested in, involved in, or committed to an activity.","Engagement means platform activities completed per student over four weeks.","Engagement is an important concept in modern education."],"answer":2,"explanation":"An operational definition specifies how a term is used in the study. Application beyond the slide wording: this measure operationalizes one aspect of engagement; it should not automatically be treated as a complete definition of the broader concept.","distractors":["This is a prediction, not a definition of how engagement is operationalized.","This is a general lexical definition rather than a study-specific operational definition.","Correct: this states how the term is used and measured in this particular investigation.","This states importance without specifying the term's use or measurement."],"source":{"doc":"L2","pages":"11"},"concept":"Operational definition"},{"id":"a08","topic":"articles","difficulty":"applied","prompt":"Which sentence best fits the 'Significance of the Study' function described in Lecture 2?","options":["The median score rose from 61 to 68 in the observed sample.","The team recorded weekly scores using the same rubric for six weeks.","Coordinators may use the findings to target extra feedback.","The study asked whether feedback timing was associated with revision quality."],"answer":2,"explanation":"The significance slide asks who will benefit and what kind of benefit they may receive. Proposed usefulness should remain proportionate to what the study can support.","distractors":["This reports a finding.","This describes a data-collection procedure.","Correct: it identifies a potential beneficiary and the kind of benefit.","This states the research question rather than who might benefit."],"source":{"doc":"L2","pages":"10"},"concept":"Study significance"},{"id":"a09","topic":"articles","difficulty":"challenge","prompt":"A quantitative article explicitly states a research question, and a qualitative article describes a research problem. A student says both must be mislabeled because of Lecture 2's wording. What is the best correction?","options":["Any paper with a problem statement must analyze numerical variables.","A qualitative study must avoid explaining why the research is necessary.","Both approaches can state research problems and questions.","A quantitative study is prohibited from using any sentence ending in a question mark."],"answer":2,"explanation":"Application beyond the slide wording: page 9 distinguishes labels for teaching purposes, but the distinction is not a universal prohibition. Judge whether the problem, question, objectives, and approach are coherent rather than treating the terms as exclusive.","distractors":["The presence of a problem statement does not determine the study's data or analysis.","Qualitative studies also need a research rationale and focus.","Correct: these functions are not exclusive to one methodological tradition.","The punctuation of a research question does not make a quantitative design invalid."],"source":{"doc":"L2","pages":"9"},"concept":"Research-problem terminology"},{"id":"a10","topic":"articles","difficulty":"core","prompt":"A reader wants to check whether an article provides enough information to understand how the investigation was carried out. Which set belongs primarily in Methods?","options":["Article title, author affiliations, keywords, and journal issue number.","Study design, participants, materials, data collection, and data analysis.","Rationale, gap, significance, and the historical context of the topic.","Main findings, limitations, implications, and future research priorities."],"answer":1,"explanation":"The Methods slide links a clear structure with readers' ability to follow the investigation and with reproducibility. It lists design, subjects or participants, materials, collection, and analysis as typical components.","distractors":["These are bibliographic or front-matter elements rather than the methods account.","Correct: these are the typical Methods components listed in Lecture 2.","These primarily establish the Introduction's context and purpose.","These span Results and Discussion rather than describing the full procedure."],"source":{"doc":"L2","pages":"12"},"concept":"Methods completeness"},{"id":"a11","topic":"articles","difficulty":"applied","prompt":"Which Methods opening follows the sequence recommended on the study-design slide?","options":["'We used a quantitative approach with a correlational design.'","'We used a questionnaire, so no broader approach needs to be stated.'","'Our statistically significant result proves the study design was appropriate.'","'We used SPSS, therefore the study was an experiment.'"],"answer":0,"explanation":"Lecture 2 recommends beginning with the major approach—quantitative, qualitative, or mixed—and then naming the specific design. Correlational research is given as a quantitative example, and phenomenology as a qualitative example.","distractors":["Correct: it states the broad approach and then the specific design.","An instrument does not replace stating the major approach and specific design.","A reported outcome is not a description or justification of the design.","A software package does not establish the study design."],"source":{"doc":"L2","pages":"13"},"concept":"Approach versus design"},{"id":"a12","topic":"articles","difficulty":"challenge","prompt":"A randomized trial calls its human volunteers 'participants.' Does that word alone make the study qualitative?","options":["No; examine the design and evidence to classify the approach.","Yes; every study using that word must rely on qualitative interviews.","Yes; randomized trials cannot use participants as a sample.","No; the word proves the study must use mixed methods instead."],"answer":0,"explanation":"Application beyond the slide wording: page 14's respondents/participants distinction is not universal. Lecture 2's own trial illustration on page 21 uses 'participants,' so classification should rest on methods rather than this naming rule.","distractors":["Correct: participant is not a term reserved exclusively for qualitative studies.","The term does not establish the data-collection method.","Randomized trials can involve human participants.","The label does not demonstrate a combination of research approaches."],"source":{"doc":"L2","pages":"14, 21"},"concept":"Participant terminology"},{"id":"a13","topic":"articles","difficulty":"applied","prompt":"A Methods section says only, 'We recruited 40 people.' Which addition most directly addresses the respondents/participants slide?","options":["The sample's identity, selection rationale, and sampling method.","Which result the authors hoped would appear in the final tables.","Why the journal's cover design appealed to the authors.","How many citations appear in the literature review."],"answer":0,"explanation":"The number of people is only part of a useful sample description. Lecture 2 also asks authors to explain why the group was chosen and how members were selected.","distractors":["Correct: the lecture asks for the sample, its selection rationale, and the sampling technique.","Expected outcomes do not explain who entered the study or how they were selected.","This is unrelated to participant selection.","Citation count does not describe the recruitment process."],"source":{"doc":"L2","pages":"14"},"concept":"Sample description and rationale"},{"id":"a14","topic":"articles","difficulty":"applied","prompt":"A computational article reports, 'We analyzed the data using software,' but gives no name, version, or code-availability information. Which revision best follows the materials-and-equipment slide?","options":["Name the software version and clarify code availability.","Report only the final accuracy score as evidence of the software used.","Replace the phrase with 'industry-leading software' without naming it.","Move the software sentence into Discussion and leave it unchanged."],"answer":0,"explanation":"Lecture 2 asks for software names and versions and clarity about whether code is available. The general aim is a methods account that readers can inspect and, where appropriate, reproduce.","distractors":["Correct: these details help readers understand the computational materials actually used.","A score does not identify the tools or their versions.","A promotional description does not supply reproducible technical details.","Relocating an incomplete description does not fix the missing information."],"source":{"doc":"L2","pages":"12, 15"},"concept":"Computational-method reporting"},{"id":"a15","topic":"articles","difficulty":"applied","prompt":"A paper states that measurements were collected, but omits their timing, frequency, and the sequence of procedures. Which change most directly follows the data-collection slide?","options":["List the authors' qualifications instead of the measurement schedule.","Add a longer statement of the project's importance.","Add more findings without explaining how they were produced.","Specify the steps, timing, variables, and measurement frequency."],"answer":3,"explanation":"The data-collection slide asks for specific steps in chronological order, defined variables, measurements, and frequency. This allows readers to connect the reported observations to the procedure that produced them.","distractors":["Credentials do not replace a transparent procedure.","Importance does not explain how measurements were obtained.","More results leave the procedure unclear.","Correct: these are the details the slide explicitly requests."],"source":{"doc":"L2","pages":"16"},"concept":"Transparent data collection"},{"id":"a16","topic":"articles","difficulty":"applied","prompt":"An article uses one well-established protocol and a second protocol newly developed for this study. Which reporting strategy best follows Lecture 2?","options":["Explain the established protocol in detail and omit the new one until another paper cites it.","Briefly describe and cite the established protocol, and explain the new protocol in detail.","Describe only whichever protocol produced the more favorable result.","Name both protocols without explanation because Methods should always be as short as possible."],"answer":1,"explanation":"Lecture 2 says new methods and protocols should be described in detail, whereas well-established methods may be briefly described and appropriately cited. The distinction balances completeness with unnecessary repetition.","distractors":["The new method especially needs enough description for readers to understand it.","Correct: the slide distinguishes concise cited descriptions of established methods from fuller descriptions of new ones.","Reporting should not depend on whether the outcomes support a preferred conclusion.","Concision cannot justify omitting information needed to understand the procedure."],"source":{"doc":"L2","pages":"16"},"concept":"New versus established protocols"},{"id":"a17","topic":"articles","difficulty":"challenge","prompt":"Under the guidance stated in Lecture 2, which use of generative AI most clearly calls for disclosure rather than falling within the slide's superficial-editing exception?","options":["Using AI only to fix spelling errors without changing wording or meaning.","Using AI to help interpret the collected data.","Using AI only to standardize formatting without changing the content.","Using AI only to correct punctuation without changing meaning."],"answer":1,"explanation":"Lecture 2 distinguishes substantive AI assistance from superficial editing and names interpretation as a substantive use. Application beyond the slide wording: this is the lecture's stated guidance, not a universal current publication policy; an actual submission must follow its venue's applicable requirements.","distractors":["Spelling correction falls within the superficial editing examples in the slide.","Correct: the slide explicitly includes analysis and interpretation among substantive uses to disclose where applicable.","Formatting is included in the slide's superficial editing exception.","Punctuation is one of the superficial editing examples listed as exempt in the slide."],"source":{"doc":"L2","pages":"16"},"concept":"AI-disclosure scope in the lecture"},{"id":"a18","topic":"articles","difficulty":"challenge","prompt":"An interview study explains how transcripts were coded and interpreted, but contains no statistical test. Which appraisal is most consistent with Lecture 2?","options":["Assume it is valid because the authors used interviews.","Reject it automatically because all Data Analysis sections must use statistical tests.","Require content analysis solely because the lecture calls it the most common method.","Assess whether its qualitative analysis method is appropriate and clearly described."],"answer":3,"explanation":"Lecture 2 separates quantitative statistical tools from the method used to analyze qualitative data. Application beyond the slide wording: no single qualitative analysis method is automatically required; suitability depends on the question, approach, and evidence.","distractors":["A collection method alone does not demonstrate analytical quality.","The lecture distinguishes quantitative statistical tools from qualitative analysis methods.","The slide's broad statement does not establish content analysis as mandatory or universally best.","Correct: the slide requests the method of qualitative analysis, rather than requiring a statistical test for every design."],"source":{"doc":"L2","pages":"17"},"concept":"Qualitative-analysis reporting"},{"id":"a19","topic":"articles","difficulty":"applied","prompt":"A paper reports, 'Mean completion time was 12 minutes in Group A and 15 minutes in Group B.' It later argues, 'The difference may reflect the reduced navigation burden.' Where do these sentences primarily belong under the lecture's IMRAD distinction?","options":["The first in Discussion; the second in Results.","Both in Methods because each mentions the groups.","The first in Results; the second in Discussion.","Both in Introduction because the sentences concern the study topic."],"answer":2,"explanation":"Results report what the data show; Discussion explains possible meaning and importance. Lecture 2 also notes disciplinary variation, so this is a functional distinction rather than a claim that every journal separates the sections identically.","distractors":["This reverses the lecture's distinction between findings and interpretation.","Mentioning groups does not make a statement procedural.","Correct: the first reports an observation, while the second proposes an interpretation.","A shared topic does not make findings and interpretation background material."],"source":{"doc":"L2","pages":"18–20"},"concept":"Finding versus interpretation"},{"id":"a20","topic":"articles","difficulty":"challenge","prompt":"A study predicted that Method A would outperform Method B, but its data show the reverse. Which reporting choice best follows the Results guidance?","options":["Describe the study as confirming the hypothesis because one method performed better.","Rewrite the original prediction as though the observed direction had been expected.","Report the contrary finding and discuss its relation to the hypothesis.","Remove the comparison because a hypothesis determines which outcomes are relevant."],"answer":2,"explanation":"Lecture 2 explicitly includes results that support or challenge a hypothesis. A report should preserve the distinction between what was expected and what was observed, then address the discrepancy in interpretation.","distractors":["The predicted direction matters; an opposite finding does not confirm that prediction.","This would misrepresent the relationship between the prior prediction and observed result.","Correct: the slide asks writers to present findings that support or challenge the hypothesis.","A prediction does not justify suppressing evidence that challenges it."],"source":{"doc":"L2","pages":"18–19"},"concept":"Contradictory findings"},{"id":"a21","topic":"articles","difficulty":"challenge","prompt":"An observational study finds that frequent platform users have higher examination scores. Its Discussion claims, 'Increasing platform use will cause every student to improve.' What is the strongest critique?","options":["The claim should be moved to Results, where causal language needs no justification.","It turns an association into a universal causal prediction.","The claim is justified because Discussion is the place for interpretation.","The claim is justified as long as the association is displayed in a table."],"answer":1,"explanation":"Lecture 2 warns against overinterpretation, unwarranted speculation, and erroneous conclusions. Application beyond the slide wording: an observed association alone does not establish that changing one variable will cause the outcome, particularly for every student.","distractors":["Changing sections does not repair the unsupported inference.","Correct: the statement adds a causal and universal conclusion not established by the described result.","Interpretation still has to stay within what the evidence supports.","A table organizes findings but does not strengthen the design's causal support."],"source":{"doc":"L2","pages":"19, 22"},"concept":"Claims–evidence alignment"},{"id":"a22","topic":"articles","difficulty":"applied","prompt":"A paper tested an algorithm on one small dataset and notes that performance may differ in other settings. What role does that statement primarily play?","options":["A methodological objective to develop a new dataset.","An empirical result showing failure in all other settings.","A hypothesis that the algorithm will outperform every competitor.","A limitation on the scope of the findings."],"answer":3,"explanation":"The Discussion guidance includes acknowledging limitations. A limitation identifies a relevant boundary or weakness; it should not be converted into an unobserved result about settings the study did not examine.","distractors":["It does not state a planned study task.","No other settings were tested in the information provided.","The statement does not make that prediction.","Correct: it identifies a constraint on how broadly the observed performance can be interpreted."],"source":{"doc":"L2","pages":"19, 22"},"concept":"Limitations"},{"id":"a23","topic":"articles","difficulty":"challenge","prompt":"A paper's result is a lower error rate for a proposed algorithm on the tested benchmark. Which statement best distinguishes a possible contribution from that result?","options":["The contribution is proof that the algorithm will work in every application.","The contribution is simply the numerical score, regardless of any comparison or novelty.","The result is the authors' intention to improve accuracy; the contribution is the planned experiment.","The result is the measured reduction; the contribution is the supported advance it demonstrates."],"answer":3,"explanation":"The group tasks ask separately for empirical findings and the paper's primary contribution to the field. Application beyond the slide wording: articulating a contribution requires explaining what has been added and why the evidence supports that claim, with scope limits retained.","distractors":["That extends beyond the benchmark evidence described.","A score alone does not explain what the work adds to existing knowledge or methods.","Intention and planned methods precede the observed result and do not establish a supported contribution.","Correct: this separates the empirical observation from the advance claimed on its basis."],"source":{"doc":"L2","pages":"19, 22"},"concept":"Result versus contribution"},{"id":"a24","topic":"articles","difficulty":"applied","prompt":"After a laboratory test, a Discussion proposes evaluating a prototype in real classrooms. Which description is most accurate?","options":["The original sampling procedure used in the laboratory test.","A proposed next study, with classroom performance still untested.","An operational definition of the prototype.","A result proving that the prototype already improves classroom learning."],"answer":1,"explanation":"Lecture 2 includes real-world relevance and future research directions in Discussion. A plausible application or next study must be kept distinct from an outcome already demonstrated by the current data.","distractors":["The statement concerns a later evaluation, not how the current sample was obtained.","Correct: the proposed next study is a future step, not completed empirical evidence.","A proposed setting for later evaluation does not define how a term was used in the study.","The scenario gives no classroom evaluation."],"source":{"doc":"L2","pages":"19–20, 22"},"concept":"Application versus established finding"},{"id":"a25","topic":"articles","difficulty":"challenge","prompt":"A paper proposes a new architecture and evaluates it, but never states an explicit hypothesis. The class task asks for its 'hypothesis or proposed concept.' What is the best analysis?","options":["Treat the highest observed score as the paper's original hypothesis.","Note the absence of an explicit hypothesis and identify the proposed concept.","Conclude that the paper has no research purpose because it lacks a hypothesis heading.","Write a directional hypothesis and attribute it to the authors as a quotation."],"answer":1,"explanation":"The group task deliberately asks for a hypothesis or proposed concept. Application beyond the slide wording: accurate article analysis distinguishes an author's explicit statement from the reader's reconstruction or expectation; missing wording should not be invented.","distractors":["A result cannot be substituted for a prior stated prediction.","Correct: this answers the task without attributing an unstated prediction to the authors.","A study can have a question and proposed concept without an explicit hypothesis.","This invents an explicit claim the paper did not state."],"source":{"doc":"L2","pages":"22"},"concept":"Explicit versus inferred hypothesis"},{"id":"a26","topic":"articles","difficulty":"applied","prompt":"A group presentation describes an article's tools and algorithm accurately but never asks whether the experiment addresses the research question. Which Lecture 2 task is still incomplete?","options":["Evaluating whether the design addresses the research question.","Transcribing the article's title and author list.","Checking whether the article uses the maximum number of references.","Confirming that every future application has already been deployed."],"answer":0,"explanation":"Methodology appraisal is more than inventorying tools or architectures. Lecture 2 explicitly asks whether the methods are clearly explained and suitable for addressing the research question.","distractors":["Correct: the task asks both what was used and whether it is clear and suitable for the question.","The stated group tasks go beyond bibliographic transcription.","The lecture does not prescribe citation quantity as the appraisal target.","Potential application and future work need not already have been implemented."],"source":{"doc":"L2","pages":"22"},"concept":"Methodological suitability"},{"id":"a27","topic":"articles","difficulty":"core","prompt":"Which item listed in Lecture 2 is a supporting instrument or document that may be placed in appendices?","options":["An unsupported conclusion replacing the Discussion.","The only statement of the article's central research question.","The only presentation of the main findings.","The interview guide used during data collection."],"answer":3,"explanation":"The appendices slide lists items such as questionnaires, interview guides, and informed consent forms. Application beyond the slide wording: use the required institutional or journal format; the slide's inclusion of references under appendices is not a universal publishing rule.","distractors":["An appendix does not replace the article's interpretation or justify an unsupported conclusion.","The central question needs to be evident in the main argument, not available only as supporting material.","Key findings belong in the main research report rather than being accessible only through an appendix.","Correct: the appendices slide specifically lists an interview guide."],"source":{"doc":"L2","pages":"3"},"concept":"Supporting materials"},{"id":"a28","topic":"articles","difficulty":"applied","prompt":"A Results section contains several tables but never identifies which findings answer the study's research question. Which revision best follows Lecture 2?","options":["Order the findings and identify the patterns that address the question.","Add tables until every raw observation has a separate display.","Replace the findings with explanations of why the results matter socially.","Report only the table with the most favorable pattern."],"answer":0,"explanation":"Tables and figures support reporting; they do not organize the research argument automatically. The Results guidance emphasizes a logical sequence and important patterns while reserving evaluation and interpretation for Discussion.","distractors":["Correct: the slide asks for logical sequencing and clear reporting of important findings, supported by tables or figures.","More displays do not necessarily make the results coherent or responsive to the question.","That moves toward Discussion while leaving the findings themselves unclear.","Selecting only favorable evidence undermines an objective account of the findings."],"source":{"doc":"L2","pages":"18, 20"},"concept":"Results organization"},{"id":"a29","topic":"articles","difficulty":"challenge","prompt":"Lecture 2 suggests an introduction of around 10–15% of the paper. A journal's required format produces a shorter, clear introduction. What is the best interpretation of the slide?","options":["Treat any introduction below 10% as evidence that the research findings are invalid.","Add irrelevant background until the introduction reaches exactly 15%.","Remove the study rationale to avoid any risk of exceeding the suggested length.","Treat it as guidance; satisfy the format and the introduction's purpose."],"answer":3,"explanation":"Lecture 2 presents the percentage alongside concision and clear purpose, while noting that there is no definitive writing formula. Application beyond the slide wording: actual genre or venue requirements should guide implementation, rather than turning a teaching heuristic into an absolute rule.","distractors":["A word-count proportion does not establish the validity of empirical findings.","Padding undermines the slide's advice to be concise.","The purpose and necessity of the research are essential functions of the introduction.","Correct: the slide itself says there is no definitive way to write an introduction and emphasizes its functions."],"source":{"doc":"L2","pages":"4"},"concept":"Introduction proportion as guidance"},{"id":"a30","topic":"articles","difficulty":"challenge","prompt":"Lecture 2's green-tea example gives a trial with 200 participants and a brief statement of improved memory and attention, but supplies no citation, effect sizes, or explicit hypothesis. What can a careful student legitimately extract?","options":["The exact strength of the treatment effect in all older adults.","Proof that the intervention is ready for clinical recommendation.","The IMRAD structure, with too little detail for a real trial appraisal.","An explicit quoted hypothesis predicting a specific numerical improvement."],"answer":2,"explanation":"Page 21 is an illustrative breakdown of Introduction, Methods, Results, and Discussion. Application beyond the slide wording: treat it as a teaching example, not as a verified clinical study, and do not invent the missing hypothesis, effect sizes, or trial details.","distractors":["No effect sizes or basis for universal generalization are supplied.","The brief instructional example does not establish a basis for that recommendation.","Correct: the example illustrates section functions, but lacks the information needed for a full empirical appraisal.","The slide does not contain such a hypothesis or numerical prediction."],"source":{"doc":"L2","pages":"21"},"concept":"Limits of a teaching example"},{"id":"b01","topic":"databases","difficulty":"core","prompt":"Which description best matches an academic database as introduced in the lecture?","options":["A searchable collection of scholarly records and materials","A single journal that publishes only peer-reviewed studies","A website that guarantees free full text for every indexed item","A reference manager that stores citations but does not search sources"],"answer":0,"explanation":"An academic database organizes searchable scholarly records across journals and other materials. It may link to full text, but indexing a record does not guarantee free access.","distractors":["Correct: this captures the searchable collection function described in the lecture.","Too narrow: a journal is one publication, not a searchable collection.","False: full-text availability depends on the source and access rights.","A reference manager organizes citations; it is a different tool."],"source":{"doc":"L3","pages":"3"},"concept":"definition"},{"id":"b02","topic":"databases","difficulty":"core","prompt":"A researcher studies classroom assessment and adolescent anxiety. Which database strategy best reflects subject-specific versus multidisciplinary coverage?","options":["Search only one multidisciplinary database because it covers every discipline equally well","Use a subject database suited to each field, then add a multidisciplinary database for cross-field coverage","Use only Google Scholar because subject databases contain no abstracts","Use a publisher platform because it indexes every publisher"],"answer":1,"explanation":"Subject-focused databases can give deeper coverage and field-specific indexing, while a multidisciplinary database can help connect literatures across fields. Using more than one appropriately chosen source reduces the risk of missing relevant work.","distractors":["Multidisciplinary coverage is broad but does not mean equal depth in each subject.","Correct: combine fit-for-purpose specialist and broad sources.","Google Scholar is useful for discovery, but it does not replace curated subject databases.","A publisher platform generally centers on its own or hosted content, not all publishers."],"source":{"doc":"L3","pages":"3–4"},"concept":"database_scope"},{"id":"b03","topic":"databases","difficulty":"applied","prompt":"You need citation links, author profiles, and journal-level metrics across disciplines. Which source most directly fits the lecture’s description?","options":["PubMed","DOAJ","Scopus","ScienceDirect"],"answer":2,"explanation":"The lecture presents Scopus as a multidisciplinary abstract and citation database with author profiles and metrics. ScienceDirect is a publisher platform for articles and books, while DOAJ is a directory of open-access journals.","distractors":["PubMed is focused on biomedical and life-sciences literature.","DOAJ helps find open-access journals and article records, not broad citation metrics.","Correct: Scopus offers citation, author-profile, and analysis tools.","ScienceDirect is useful for publisher full text, not the broadest citation-analysis fit."],"source":{"doc":"L3","pages":"10"},"concept":"platform_fit"},{"id":"b04","topic":"databases","difficulty":"applied","prompt":"A historian wants older journal articles, books, and primary-source material. Which platform from the lecture is a strong starting point?","options":["PubMed","ERIC","IEEE Xplore","JSTOR"],"answer":3,"explanation":"JSTOR is a digital library with journals, books, and primary sources and is especially useful in humanities and social sciences. Specific access varies by item and institutional entitlement.","distractors":["PubMed focuses on biomedical and life-sciences citations.","ERIC focuses on education research and related materials.","IEEE Xplore centers on engineering, computing, and IEEE-related publications.","Correct: JSTOR’s collection includes these content types and relevant fields."],"source":{"doc":"L3","pages":"30–32"},"concept":"platform_fit"},{"id":"b05","topic":"databases","difficulty":"core","prompt":"What should a reader infer when a PubMed result has an abstract but no “Free in PMC” full-text link?","options":["PubMed search is free, but the article may require publisher or institutional access","The citation is invalid and should be excluded","Every PubMed article is available as a free PDF elsewhere","The record is necessarily not peer reviewed"],"answer":0,"explanation":"PubMed is a free bibliographic search resource, but PubMed itself does not include full-text articles for every citation. A full-text link may lead to a publisher, PubMed Central, or another source with access conditions.","distractors":["Correct: free discovery and free article access are separate questions.","Absence of a free link says nothing by itself about record validity.","A reader should not assume an alternative free PDF exists.","Indexing and peer-review status cannot be inferred from a missing full-text link."],"source":{"doc":"L3","pages":"16"},"concept":"access_vs_discovery"},{"id":"b06","topic":"databases","difficulty":"applied","prompt":"Which statement correctly distinguishes PubMed from PubMed Central (PMC)?","options":["PubMed is a journal publisher; PMC is its subscription citation index","PubMed is a free search resource for biomedical citations; PMC is a free full-text archive for included articles","PubMed and PMC are interchangeable names for the same full-text database","PMC contains every article cited in PubMed"],"answer":1,"explanation":"PubMed enables search across citations and abstracts; PMC is a separate archive containing full text for articles deposited or selected under its policies. Not every PubMed citation has a PMC copy.","distractors":["Neither service is described correctly here.","Correct: the search resource and full-text archive have related but distinct roles.","They are linked services, not interchangeable names.","PMC does not contain every item indexed in PubMed."],"source":{"doc":"L3","pages":"16"},"concept":"database_distinction"},{"id":"b07","topic":"databases","difficulty":"applied","prompt":"An education researcher needs both peer-reviewed journal studies and reports, and wants to limit results to available ERIC full text. What is the best approach?","options":["Assume every ERIC record is a peer-reviewed article with a free PDF","Use only a multidisciplinary citation index because ERIC is a publisher","Search ERIC for available full text, using a peer-reviewed journal search and a separate report search","Search PubMed with a medical subject heading"],"answer":2,"explanation":"ERIC includes journal and non-journal materials, and its peer-review and full-text controls address different attributes. Use an available-full-text limit for both strands, but apply the peer-review requirement to the journal-study strand so that relevant reports are not unintentionally excluded.","distractors":["ERIC includes more than peer-reviewed articles, and full text is not universal.","ERIC is not a publisher; subject fit favors using its education collection.","Correct: separate searches preserve the requested reports while requiring peer review for the journal studies.","PubMed is designed for biomedical/life-sciences literature, not education as a primary domain."],"source":{"doc":"L3","pages":"18–20"},"concept":"ERIC"},{"id":"b08","topic":"databases","difficulty":"core","prompt":"A literature review in computer engineering needs conference papers and standards as well as journal articles. Which source fits best?","options":["DOAJ","JSTOR","ERIC","IEEE Xplore"],"answer":3,"explanation":"IEEE Xplore includes journals and conference publications as well as standards and books. Whether a particular item can be read in full depends on its access status.","distractors":["DOAJ is an open-access journal directory, not a broad standards database.","JSTOR has broad library content but is not the first fit for IEEE standards.","ERIC is education-focused.","Correct: the lecture specifically includes conference papers and standards in IEEE Xplore."],"source":{"doc":"L3","pages":"21–23"},"concept":"IEEE_Xplore"},{"id":"b09","topic":"databases","difficulty":"applied","prompt":"Wh
