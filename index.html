lts across suitable studies. The same source material can support different analytic questions: open survey responses may be interpreted for meaning or systematically coded into categories whose frequencies are counted. Decide what result is needed before choosing the procedure. A software package can help implement analysis, but its availability does not establish that the method fits the research question.","example":"To ask 'How often?' count well-defined categories. To ask 'How is it understood?' examine patterns of meaning in context.","trap":"Quantitative analysis does not automatically support causality; the design still determines what causal claims are defensible.","source":{"doc":"L4","pages":"19–22"}},{"title":"Validity, reliability, and appropriate claims","body":"Practice 4 introduces validity as accuracy checking and reliability as consistency across researchers or projects. These are useful starting points rather than interchangeable labels for overall quality. Extension beyond the slides: measurement validity concerns whether evidence supports the intended interpretation of a measure, while reliability concerns its consistency. A questionnaire can consistently measure liking for a lecturer while failing to measure course understanding. The same distinction helps evaluate qualitative work: explain how interpretations are supported and how analytic decisions were made, rather than assuming that a quotation proves a conclusion. Generalizability asks another question: where else can the finding reasonably apply? A study can be careful and informative yet have a narrow scope, so conclusions should distinguish what was established from what remains uncertain.","example":"Repeatedly obtaining the same reading supports consistency. It does not prove that the instrument measures the intended concept accurately.","trap":"Reliable does not necessarily mean valid, and neither term alone guarantees a representative sample or a causal conclusion.","source":{"doc":"P4","pages":"6"}},{"title":"Bias and confounding affect different parts of a study","body":"Lecture 4 requires researchers to explain how they addressed bias and to reflect on judgments and assumptions during qualitative analysis. It also identifies control of confounding as important in experimental design. A biased question may steer a response; selective coding may favor the researcher's preferred interpretation. A confounding problem arises when another influence varies with the focal comparison and could explain the outcome difference. These problems cannot be solved simply by collecting more data of the same flawed kind. Extension beyond the slides: neutral questions, transparent coding decisions, examination of contrary evidence, and appropriate comparison groups address different threats. The remedy should match the mechanism of the problem. Standardizing a procedure may improve consistency while preserving a systematic bias if the procedure itself is misleading.","example":"If beginners all use one app and experts another, prior skill may explain the score difference. If a survey presumes improvement, its wording may steer responses.","trap":"Mentioning a confounder in the discussion does not mean it was controlled in the design or analysis.","source":{"doc":"L4","pages":"4, 15–16, 20"}},{"title":"Sampling and generalization need their own justification","body":"Practice 4 emphasizes the sampling process, questionnaire design, administration, and analysis when describing surveys. Its comparison table suggests that large quantitative samples represent the population; this should be treated as an overstatement. Extension beyond the slides: a large convenience sample can still omit relevant groups or attract respondents with unusual experiences. Correctly computing percentages from that sample does not remove those selection problems. Likewise, a non-probability sample can provide numerical observations that are summarized statistically, while supporting limited population claims. Qualitative findings often contribute contextual or conceptual understanding rather than a population percentage. Evaluate transfer to another setting by considering the question, participants, context, and evidence. The data's numerical or textual format does not settle who is represented or where the conclusion applies.","example":"Thousands of responses from one voluntary club survey do not automatically describe all university students.","trap":"Random assignment improves a treatment comparison; it does not make the recruited sample representative of the population.","source":{"doc":"P4","pages":"14, 19"}},{"title":"Make the procedure and rationale inspectable","body":"A useful methodology section connects the question to the type of research, the collection process, the analysis, the tools or materials, and the reasons for those choices. It should also explain how bias was addressed. The Methods section provides concrete procedural detail, including who or what was studied, the design, materials, and what happened. These details let readers assess the claims and allow another researcher to understand or repeat the work. Reporting only a software name, sample size, or broad label leaves important decisions hidden. Extension beyond the slides: report meaningful departures from the intended procedure and explain limitations in terms of the claims they affect. The aim is a transparent chain from the research question through the evidence to a conclusion of an appropriate scope.","example":"Instead of 'We used a survey,' explain who was recruited, how questions were administered, what was measured, how responses were analyzed, and why those choices fit the aim.","trap":"More result tables cannot compensate for missing information about how the data was produced and analyzed.","source":{"doc":"L4","pages":"2–4"}}],"glossary":[{"term":"Primary data","meaning":"Data collected originally for the current research question."},{"term":"Secondary data","meaning":"Previously collected data used for the current investigation."},{"term":"Survey","meaning":"A collection approach using questions to obtain information from respondents; its data may be numerical, textual, or both."},{"term":"Interview","meaning":"A conversation used to collect participants' accounts, often with questions and follow-up probes."},{"term":"Focus group","meaning":"A facilitated group discussion; participant interaction is part of its potential evidence, an extension beyond the lecture's brief table."},{"term":"Observation","meaning":"Systematic recording of behavior or events in a setting, potentially as counts or descriptive accounts."},{"term":"Descriptive notes","meaning":"Records of observed events, dialogue, people, and settings."},{"term":"Reflective notes","meaning":"Records of the researcher's thoughts, questions, assumptions, or interpretations."},{"term":"Thematic analysis","meaning":"Interpretation of recurring patterns of meaning in qualitative material."},{"term":"Statistical analysis","meaning":"Use of numerical methods to examine distributions, averages, relationships, or other quantitative questions."},{"term":"Meta-analysis","meaning":"Statistical synthesis of comparable numerical results from multiple studies."},{"term":"Validity","meaning":"Whether the evidence supports the intended interpretation or claim; the practice slide introduces it as accuracy checking."},{"term":"Reliability","meaning":"Consistency of measurement or procedure under relevant conditions."},{"term":"Bias","meaning":"A systematic influence that distorts collection, analysis, or interpretation."},{"term":"Confounding","meaning":"A problem where another influence related to the focal comparison can also explain the outcome."},{"term":"Generalizability","meaning":"The extent to which a finding can reasonably apply beyond the studied participants and setting."}],"corrections":[{"claim":"A survey is necessarily a qualitative approach.","clarification":"The word 'qualitative' on Practice 4 page 14 conflicts with its quantitative diagram and statistical description. Survey format can support numerical responses, open-ended responses, or both; Lecture 4 pages 19–20 explicitly permits qualitative survey analysis.","source":{"doc":"P4","pages":"14"}},{"claim":"Qualitative data cannot be analyzed statistically.","clarification":"Lecture 4 page 12 is too absolute. Lecture 4 pages 19 and 22 allow textual responses to be coded and counted; this numerical analysis differs from interpreting the meanings of the original accounts.","source":{"doc":"L4","pages":"12, 19, 22"}},{"claim":"Qualitative findings cannot have relevance beyond the original participants.","clarification":"Lecture 4 page 12 compresses several meanings of generalization. A methodological extension distinguishes unsupported population percentages from reasoned contextual or conceptual transfer; the latter still requires justification.","source":{"doc":"L4","pages":"12"}},{"claim":"Quantitative analysis requires probability sampling, and qualitative analysis requires non-probability sampling.","clarification":"The sources listed on Lecture 4 pages 20–21 are examples, not exclusive rules. Data form and the question guide analysis, while sampling and other assumptions limit the conclusions that can be drawn.","source":{"doc":"L4","pages":"20–21"}},{"claim":"Qualitative research generally ignores context.","clarification":"The disadvantage table on Practice 4 page 19 gives this misleading impression. The same practice material describes ethnography and case studies as inquiries into culture and context, so this is not a general property of qualitative research.","source":{"doc":"P4","pages":"10–11, 19"}},{"claim":"Observational research cannot address confounding in any way.","clarification":"Lecture 4 page 16 contrasts experimental control with descriptive collection too sharply. As an extension, measured alternative explanations may be addressed in observational design or analysis, but doing so does not automatically eliminate confounding or establish causality.","source":{"doc":"L4","pages":"15–16"}}]}],"cases":[{"id":"case01","title":"Retrieval practice and delayed learning","passage":"Students often reread lecture notes before exams. Earlier comparisons of retrieval practice and rereading at this university measured performance immediately after studying, so persistence of any benefit is unclear. Researchers predicted that retrieval practice would produce higher scores on a seven-day retention test. They recruited 120 volunteers from an introductory course and randomly assigned 60 to answer practice questions and 60 to reread identical material for 25 minutes. Both groups took the same delayed test, scored out of 100 by an assessor unaware of assignment. Mean scores among those tested were 78 and 70; the reported mean difference was 8 points, with a 95% confidence interval of 3 to 13. Fifteen retrieval participants and five rereading participants missed the delayed test. Only completers were analysed. The authors concluded that retrieval practice improved delayed performance in their sample and recommended examining whether the result holds in other courses.","fictional":true,"refs":[{"doc":"L2","pages":"12–19, 22"},{"doc":"L4","pages":"15–16"}],"prompts":[{"id":"case01-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Prior local comparisons measured immediate performance but did not establish seven-day retention. The practical issue is how students should study; the gap is missing evidence about persistence.","rubric":["Names delayed retention rather than a generic lack of research.","Separates a knowledge gap from the practical study problem."],"evidence":"Earlier comparisons measured performance immediately after studying."},{"id":"case01-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: Does retrieval practice, compared with equal-duration rereading, improve seven-day retention scores among students in this course? Objective: compare delayed test scores between the randomly assigned groups.","rubric":["Specifies intervention, comparison, outcome and population.","Uses a measurable objective aligned with the question."],"evidence":"Randomly assigned practice questions or rereading; same delayed test."},{"id":"case01-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"The stated directional alternative is that retrieval practice yields higher seven-day retention scores than rereading. A corresponding null is no difference in population mean scores. The null is formulated for practice, not explicitly quoted in the passage.","rubric":["Identifies the explicit directional prediction.","Does not confuse the observed 8-point difference with the prior hypothesis."],"evidence":"Researchers predicted higher scores on a seven-day retention test."},{"id":"case01-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Quantitative randomized parallel-group experiment. Researchers manipulate study method and randomly assign participants. Volunteer recruitment is not random sampling.","rubric":["Recognizes manipulation and random assignment.","Separates assignment to conditions from recruitment into the study."],"evidence":"Recruited volunteers and randomly assigned 60 to each group."},{"id":"case01-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary quantitative data: delayed test scores out of 100. Independent variable: assigned study method. Dependent variable: seven-day retention score. The initial sample is 120 course volunteers; 100 completed follow-up.","rubric":["Correctly identifies treatment and measured outcome.","Recognizes volunteer recruitment and differential attrition."],"evidence":"15 retrieval and 5 rereading participants missed the test."},{"id":"case01-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The reported means describe the 100 participants who completed testing, not all 120 assigned students. Random assignment supports causal interpretation, but differential attrition and completer-only analysis may bias that comparison. Follow up missing participants and prespecify a defensible missing-data strategy with sensitivity analysis. Evidence from one volunteer course sample does not establish an effect for all students.","rubric":["Bounds the reported comparison to observed completers.","Connects differential attrition to possible bias.","Proposes an improvement that addresses that limitation rather than only increasing sample size."],"evidence":"Mean scores were reported among those tested; only completers were analysed."}]},{"id":"case02","title":"Phone use and sleep quality","passage":"Research has linked screen use to sleep, but the relationship among first-year commuter students in this region has received little attention. Investigators asked whether daily phone use was associated with sleep quality. An online invitation attracted 280 volunteers from three universities. At one time point, students reported their average daily screen hours and completed a sleep-quality scale, where higher scores indicate better sleep. Screen hours and sleep-quality scores were negatively correlated, r = −0.42. Work schedules, caffeine intake and existing sleep difficulties were not recorded. The authors wrote that phone use causes poor sleep and that reducing screen time would improve sleep for all university students. No directional prediction was specified before analysis.","fictional":true,"refs":[{"doc":"P4","pages":"17"},{"doc":"L2","pages":"19, 22"}],"prompts":[{"id":"case02-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"The stated gap concerns evidence for first-year commuter students in this region. It is a population/context gap, not an assertion that phone use and sleep have never been studied.","rubric":["Identifies the specific population and context.","Acknowledges that prior research already exists."],"evidence":"Relationship among first-year commuter students in this region."},{"id":"case02-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: Is daily phone use associated with sleep-quality scores among first-year commuter students? Objective: estimate the direction and strength of that association.","rubric":["Uses association wording consistent with the design.","Names both measured variables and the population."],"evidence":"Asked whether daily phone use was associated with sleep quality."},{"id":"case02-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No explicit directional hypothesis is reported. A possible proposed hypothesis is that more screen hours are associated with lower sleep-quality scores, but it must be labelled a proposal rather than the authors’ stated prediction.","rubric":["States that the hypothesis is not explicitly reported.","Separates a proposed association from an observed result or causal claim."],"evidence":"No directional prediction was specified before analysis."},{"id":"case02-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Quantitative cross-sectional correlational study. Both variables are measured once, without intervention or random assignment.","rubric":["Identifies one-time observation.","Avoids classifying the study as an experiment."],"evidence":"At one time point, students reported both measures."},{"id":"case02-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary self-report quantitative data from a volunteer sample. Screen hours are a predictor and sleep quality an outcome in the analysis, but no variable was experimentally manipulated. Higher sleep scores mean better sleep, so the negative correlation indicates poorer reported sleep with more screen use.","rubric":["Interprets the scale direction and correlation correctly.","Identifies self-report and volunteer sampling."],"evidence":"Higher scores indicate better sleep; r = −0.42."},{"id":"case02-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The causal and universal claims exceed the evidence. Reverse causation and unmeasured factors such as work schedules may explain the association. A prospective study would help establish timing; a well-designed randomized intervention would provide stronger causal evidence. Broader recruitment would address generalizability separately.","rubric":["Identifies confounding or reverse causation.","Matches improvements to causality and generalizability without claiming that more participants alone solve bias."],"evidence":"Work schedules and existing sleep difficulties were not recorded."}]},{"id":"case03","title":"Receiving automated feedback","passage":"Evaluations of automated feedback have usually compared average grades or system accuracy. They say less about how first-year students experience receiving feedback that conflicts with their own judgement. This study explored the meaning of that experience. Fourteen first-year students who had encountered conflicting feedback were purposively recruited for individual semi-structured interviews. Interviews were recorded with consent, transcribed and analysed for shared meanings in descriptions of lived experience. Participants described uncertainty, embarrassment and selective trust. The researchers reflected on how their own roles as teaching assistants might shape the interviews and interpretation. They did not prespecify a statistical hypothesis. The report suggests that feedback explanations should acknowledge uncertainty; it does not estimate how common these experiences are across the university.","fictional":true,"refs":[{"doc":"P4","pages":"3–8"},{"doc":"L2","pages":"13, 19"}],"prompts":[{"id":"case03-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Existing work emphasizes grades or technical accuracy, leaving limited understanding of students’ lived experience of conflicting automated feedback.","rubric":["Identifies the missing experiential understanding.","Distinguishes it from proving that the system is inaccurate."],"evidence":"They say less about how first-year students experience conflicting feedback."},{"id":"case03-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How do first-year students experience and make sense of automated feedback that conflicts with their judgement? Objective: describe shared meanings in those experiences.","rubric":["Uses an open-ended question about meaning.","Aligns the objective with experiential qualitative data."],"evidence":"Explored the meaning of that experience."},{"id":"case03-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No statistical hypothesis was prespecified. An exploratory phenomenological study can legitimately use an open-ended question rather than a directional prediction. The reported themes are findings, not hypotheses stated in advance.","rubric":["Recognizes that no hypothesis is reported.","Does not invent a hypothesis from the eventual themes."],"evidence":"They did not prespecify a statistical hypothesis."},{"id":"case03-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Qualitative phenomenological study, indicated by the focus on lived experience and shared meanings. Semi-structured interviewing is the collection method, not by itself the research design.","rubric":["Identifies phenomenology using the study aim.","Separates the design from its interview method."],"evidence":"Shared meanings in descriptions of lived experience."},{"id":"case03-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary qualitative interview transcripts from 14 purposively selected students with relevant experience. The analytic focus is meaning and experience rather than an experimental independent/dependent variable pair.","rubric":["Identifies purposive selection and text data.","Avoids forcing manipulated variables onto this design."],"evidence":"Students who had encountered conflicting feedback were purposively recruited."},{"id":"case03-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The study supports contextual insight, not a population prevalence estimate. Participants may moderate responses because researchers are teaching assistants. Independent interviewers, a clear account of researcher influence and careful documentation of analysis could improve credibility.","rubric":["Limits claims to contextual understanding.","Links researcher role to an appropriate mitigation."],"evidence":"Researchers reflected on their own roles as teaching assistants."}]},{"id":"case04","title":"Explaining low feedback satisfaction","passage":"A university knows how many students use its feedback tool but not why some frequent users remain dissatisfied. A survey of 240 student volunteers measured usage frequency and satisfaction on a five-point scale. Frequent users showed unexpectedly low satisfaction. Researchers then selected 12 frequent users with low ratings for interviews to explain this pattern. Students described delayed responses and comments that did not match marking criteria. The team integrated these explanations with the survey results when interpreting the low satisfaction scores. It recommended checking response delays and alignment with assessment criteria. Because interviewees were selected for low satisfaction, their accounts were not used to describe all users. No prediction about the initial association had been specified.","fictional":true,"refs":[{"doc":"P4","pages":"20–22"},{"doc":"L2","pages":"22"}],"prompts":[{"id":"case04-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Usage counts and satisfaction scores do not explain why frequent users are dissatisfied. The gap concerns the explanation of an observed quantitative pattern.","rubric":["Identifies the missing explanation.","Avoids claiming that usage or satisfaction had never been measured."],"evidence":"Knows how many students use the tool but not why some remain dissatisfied."},{"id":"case04-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: Why do some frequent users report low satisfaction with the feedback tool? Objective: identify and integrate explanations for the survey pattern.","rubric":["States an explanatory question.","Connects the interview objective to the quantitative finding."],"evidence":"Interviews to explain this pattern."},{"id":"case04-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No prior prediction of the association is specified. Interview explanations are findings; they should not be relabelled as pre-existing hypotheses. They could motivate hypotheses for a future study.","rubric":["Recognizes an absent prespecified hypothesis.","Distinguishes future testable propositions from findings."],"evidence":"No prediction about the initial association had been specified."},{"id":"case04-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Mixed methods, explanatory sequential: quantitative survey first, qualitative interviews second, with integration at interpretation. The second phase is selected to explain the first.","rubric":["Identifies the quantitative-to-qualitative order.","Explains the integration rather than merely noting two methods."],"evidence":"Then selected interviewees and integrated explanations with survey results."},{"id":"case04-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary numeric usage and satisfaction data followed by interview transcripts. Survey recruitment is voluntary; interview selection is purposive for frequent low-satisfaction users.","rubric":["Identifies both data types.","Distinguishes the two recruitment stages."],"evidence":"240 volunteers; 12 frequent users with low ratings."},{"id":"case04-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The recommendations are plausible explanations to investigate, not proven causes of dissatisfaction. The selected interviews cannot estimate all-user prevalence. A follow-up could measure delays and criterion alignment across a broader sample or test a targeted change.","rubric":["Limits explanatory and population claims.","Proposes a follow-up directly linked to the findings."],"evidence":"Accounts were not used to describe all users."}]},{"id":"case05","title":"Two classes, two teaching methods","passage":"Earlier studies of structured peer feedback focused on essays, leaving uncertainty about its usefulness for short programming assignments. Researchers predicted that structured peer feedback would improve code quality compared with usual instructor comments. Two existing classes, each with 31 students, were studied for six weeks. One class used peer feedback and the other continued usual practice. The classes had different teachers and were not randomly assigned. Both took a baseline coding task and a final task scored using the same rubric. The peer-feedback class improved by 12 points on average; the comparison class improved by 5. The authors attributed the entire difference to peer feedback. They did not report whether instruction time or teacher experience differed.","fictional":true,"refs":[{"doc":"L4","pages":"15–16"},{"doc":"P4","pages":"16–18"}],"prompts":[{"id":"case05-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"The transfer of structured peer feedback from essays to short programming assignments is uncertain. This is a task/context gap.","rubric":["Names the specific untested context.","Acknowledges previous research on essays."],"evidence":"Earlier studies focused on essays."},{"id":"case05-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: Does structured peer feedback improve code-quality scores relative to usual instructor comments for short programming assignments? Objective: compare score changes between the classes.","rubric":["Aligns intervention, comparison and outcome.","Uses change over time rather than unrelated satisfaction measures."],"evidence":"Baseline and final tasks scored with the same rubric."},{"id":"case05-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"The stated directional hypothesis is that peer feedback improves code quality more than usual instructor comments. A 7-point difference in mean improvement is a result, not the original hypothesis.","rubric":["Identifies the explicit prediction.","Separates prediction from observed difference."],"evidence":"Researchers predicted improvement compared with usual comments."},{"id":"case05-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Quantitative quasi-experimental pretest/posttest comparison using existing nonequivalent classes. There is an intervention, but no random assignment.","rubric":["Identifies intervention without random assignment.","Recognizes the pretest/posttest comparison."],"evidence":"Two existing classes; not randomly assigned."},{"id":"case05-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary quantitative rubric scores before and after six weeks. Condition is the explanatory variable and code-quality change the outcome. The study uses two intact classes, one per condition, taught by different teachers; recruitment or selection of students into the classes is not described, and random sampling must not be assumed.","rubric":["Identifies measured outcome and intervention.","Identifies the class as the condition-level unit and notes that student recruitment/selection is unreported."],"evidence":"Two existing classes; each had a different teacher; random assignment was not used."},{"id":"case05-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"Attributing the entire difference to peer feedback is not justified: treatment is perfectly confounded with class and teacher, with only one class (cluster) in each condition. The student count does not provide replicated treatment-level units, so the separate treatment effect cannot be estimated from this setup. A stronger study would include multiple classes and teachers per condition, allocate at the appropriate level, and account for clustering in analysis.","rubric":["Identifies perfect class/teacher confounding and the one-cluster-per-condition problem.","Explains why treating all students as independent treatment replications is not justified.","Proposes a design and analysis improvement that addresses the stated limitation."],"evidence":"One existing class and one teacher represented each condition; instruction time and teacher experience were not reported."}]},{"id":"case06","title":"City cycling and air quality","passage":"Single-year reports describe cycling counts and air quality separately. Whether their daily patterns covary across several years in this city remains unclear. Analysts reused public daily traffic, cycling, weather and air-quality records for 2019–2024. They examined associations between cycling counts and daily particulate concentrations, accounting for recorded weather. Days with more cycling tended to have lower particulate concentrations. The analysis did not measure individual travel choices or changes in factory emissions. The authors suggested that replacing car trips with cycling caused the cleaner air and concluded that people who cycle breathe less pollution. No intervention was implemented and no directional hypothesis was stated in the report.","fictional":true,"refs":[{"doc":"L4","pages":"13–16, 21"},{"doc":"L2","pages":"19, 22"}],"prompts":[{"id":"case06-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"The gap is a multiyear joint analysis of daily cycling and air-quality patterns in this city, beyond separate single-year summaries.","rubric":["Specifies time scale and joint relationship.","Does not claim there are no existing data."],"evidence":"Single-year reports describe the measures separately."},{"id":"case06-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How are daily cycling counts associated with particulate concentrations across 2019–2024, accounting for recorded weather? Objective: estimate that association using existing city records.","rubric":["Names the daily aggregate unit and time period.","Avoids turning the question into an individual exposure claim."],"evidence":"Public daily records for 2019–2024."},{"id":"case06-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No directional hypothesis is explicitly stated. A proposed negative association could be tested, but should be distinguished from the authors’ reported findings and causal suggestions.","rubric":["Marks the hypothesis as absent.","Keeps observed association separate from proposed prediction."],"evidence":"No directional hypothesis was stated."},{"id":"case06-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Quantitative observational analysis of repeated aggregate records using secondary data. There is no experimentally assigned intervention.","rubric":["Identifies secondary observational analysis.","Recognizes the daily city-level unit."],"evidence":"Analysts reused public daily records."},{"id":"case06-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Secondary numeric daily city-level data. Cycling count is a predictor and particulate concentration an outcome; weather is measured for adjustment. Individual travel and exposure data are absent.","rubric":["Identifies the unit and variable roles.","Recognizes the missing individual-level information."],"evidence":"Did not measure individual travel choices."},{"id":"case06-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"Association does not establish replacement of car trips as the cause. Unmeasured emissions or other factors may matter. Inferring individual exposure from city-level associations is also unwarranted. Individual exposure data and a stronger causal comparison would address different parts of the claim.","rubric":["Identifies both causal overreach and aggregate-to-individual inference.","Proposes data/design changes matched to those claims."],"evidence":"Suggested replacement caused cleaner air; concluded cyclists breathe less pollution."}]},{"id":"case07","title":"How developers build trust in AI tools","passage":"Surveys have quantified trust in AI coding tools, but provide limited explanation of how trust changes through repeated use and failure. Researchers set out to develop an account of that process. They began by interviewing eight developers and comparing incidents in the transcripts. Emerging categories guided recruitment of ten further developers with contrasting experiences. Data collection and analysis proceeded together, and categories were revised through constant comparison. The final account described a cycle of trial, verification, disappointment and conditional reuse. The team presented it as a theory grounded in these accounts, with its scope tied to the participants and settings studied. They did not begin with a fixed hypothesis to test.","fictional":true,"refs":[{"doc":"P4","pages":"6, 9"},{"doc":"L2","pages":"19"}],"prompts":[{"id":"case07-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Limited process explanation of how trust develops and changes through use and failure, despite existing survey measurements.","rubric":["Identifies a process/theory gap.","Distinguishes measuring trust from explaining its development."],"evidence":"Surveys quantify trust but provide limited process explanation."},{"id":"case07-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How do developers develop and revise trust in AI coding tools through repeated use? Objective: develop an empirically grounded explanation of that process.","rubric":["Uses process-oriented wording.","Aligns the objective with theory development."],"evidence":"Set out to develop an account of that process."},{"id":"case07-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No fixed hypothesis is reported. The explanatory theory emerges from iterative analysis; it is an outcome of the study and can motivate later testing.","rubric":["Recognizes an emergent theory rather than a tested prior prediction.","Does not assume qualitative work is invalid without a hypothesis."],"evidence":"Did not begin with a fixed hypothesis to test."},{"id":"case07-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Qualitative grounded theory. Iterative collection/analysis, constant comparison and recruitment guided by emerging categories support this classification.","rubric":["Names grounded theory using procedural evidence.","Distinguishes it from a simple interview survey."],"evidence":"Categories guided further recruitment; constant comparison."},{"id":"case07-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary interview accounts from 18 developers. How the first eight were recruited is not stated; the ten additional developers were selected through emerging categories to provide contrasting experiences. The focus is a social process rather than a manipulated treatment and numeric outcome.","rubric":["Identifies the two recruitment phases.","Does not infer a recruitment method for the initial eight.","Recognizes qualitative process data."],"evidence":"The first eight developers’ recruitment method is not described; emerging categories guided selection of ten further developers."},{"id":"case07-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The proposed theory is grounded in these accounts, not automatically universal. Testing its explanatory reach in other development settings and documenting category development could strengthen the work. Recruiting only similar developers would not meaningfully test its boundaries.","rubric":["Limits the scope of the theory.","Suggests an appropriate contrasting-context or analytic improvement."],"evidence":"Scope tied to participants and settings studied."}]},{"id":"case08","title":"Shared practices in a makerspace","passage":"Formal safety policies describe how a university makerspace should operate, but reveal little about the informal practices members use to share equipment and teach newcomers. A researcher spent four months attending sessions, observing interactions and conducting informal interviews. Field notes distinguished descriptions of events from the researcher’s reflections. Analysis examined the group’s shared language, routines and rules. Members commonly watched an experienced peer before using unfamiliar equipment, even when written guidance was available. The report describes a local culture of peer learning. It does not claim that the same culture exists in every makerspace and states no statistical hypothesis.","fictional":true,"refs":[{"doc":"P4","pages":"5, 10"},{"doc":"L4","pages":"20"}],"prompts":[{"id":"case08-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Formal policy provides little evidence about actual informal cultural practices for equipment sharing and newcomer learning.","rubric":["Distinguishes written rules from lived practices.","Specifies the local cultural focus."],"evidence":"Policies reveal little about informal practices."},{"id":"case08-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How do makerspace members share equipment and socialize newcomers through everyday practices? Objective: describe and interpret shared routines in this group.","rubric":["Focuses on a culture-sharing group.","Aligns objective with prolonged observation."],"evidence":"Shared language, routines and rules."},{"id":"case08-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No statistical hypothesis is stated. The study is guided by an exploratory question about practices and culture. The peer-learning theme is a finding.","rubric":["Recognizes the absence of an explicit hypothesis.","Distinguishes a theme from a prior prediction."],"evidence":"States no statistical hypothesis."},{"id":"case08-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Qualitative ethnography of a bounded makerspace; a qualitative single-case study with an ethnographic approach is also acceptable when justified by the bounded setting and prolonged observation.","rubric":["Accepts the ethnographic focus on shared culture and practices.","Accepts a defensible case-study label when the answer explains the bounded site and ethnographic approach."],"evidence":"Four months of observation in one makerspace; analysis examined shared language, routines and rules."},{"id":"case08-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary qualitative field notes and informal interview material. Descriptive notes record events; reflective notes record the researcher’s interpretations and reactions. The passage does not state how interviewees or observed members were selected, so do not assume random recruitment or representativeness.","rubric":["Identifies the data sources.","Distinguishes observation from reflection.","Notes that participant selection is unreported rather than inventing a sampling method."],"evidence":"Interviewee/member recruitment or selection is not described; notes distinguished event descriptions from researcher reflections."},{"id":"case08-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The local cultural interpretation fits the design, but researcher presence or selective observation may influence accounts. Careful reflexive notes, multiple observation occasions and comparison across sources can improve credibility. Generalization to every makerspace is not warranted.","rubric":["Identifies a plausible observation-related limitation.","Matches a credibility improvement to the limitation."],"evidence":"Describes a local culture, not every makerspace."}]},{"id":"case09","title":"A university scheduling-system rollout","passage":"Performance reports show whether scheduling software meets technical targets, but explain little about how organizational decisions shape a difficult rollout. Researchers investigated one university’s implementation over a single academic year. They combined 22 staff interviews, meeting records and support logs. Analysis reconstructed decisions and compared accounts across sources. Conflicting ownership of timetable changes repeatedly appeared alongside delays. The authors proposed clearer responsibility for approving changes. They described their work as an in-depth investigation of this bounded implementation and did not claim a representative survey of universities. No formal hypothesis was specified.","fictional":true,"refs":[{"doc":"P4","pages":"11"},{"doc":"L4","pages":"13, 19–20"}],"prompts":[{"id":"case09-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Technical performance reports do not adequately explain the organizational decisions behind rollout difficulties.","rubric":["Identifies the explanatory organizational gap.","Separates a rollout problem from missing understanding of its mechanisms."],"evidence":"Reports explain little about organizational decisions."},{"id":"case09-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How did organizational decisions contribute to difficulties in this university’s scheduling-system rollout? Objective: explain the implementation using multiple sources within the defined case.","rubric":["Identifies the bounded case.","Aligns the objective with contextual explanation."],"evidence":"One university over a single academic year."},{"id":"case09-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No formal hypothesis is stated. The proposition about unclear ownership emerges from the analysis and may be tested or examined in later cases.","rubric":["Recognizes the absent prior hypothesis.","Does not turn the final recommendation into a tested hypothesis."],"evidence":"No formal hypothesis was specified."},{"id":"case09-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"An in-depth case study of a bounded implementation, predominantly qualitative as described. Multiple sources alone do not make it mixed methods; no distinct quantitative analysis integrated with qualitative findings is described.","rubric":["Recognizes the bounded case.","Avoids assuming that logs automatically establish mixed methods."],"evidence":"Interviews, records and logs used to reconstruct decisions."},{"id":"case09-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"New staff interviews are primary data; pre-existing meeting records and support logs are documents created outside this investigation. How the 22 staff interviewees were recruited or selected is not stated. The case is the one university’s implementation, but why this university or case was selected is also not stated.","rubric":["Distinguishes new interviews from pre-existing records without requiring a disputed primary/secondary label.","Identifies both unreported interview recruitment and unreported case-selection rationale."],"evidence":"One university and 22 staff interviewees were included; neither case selection nor interviewee recruitment is described."},{"id":"case09-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The recommendation is grounded in converging case evidence but does not establish a universal causal rule. Rival explanations such as staffing constraints should be examined. Comparing other implementations could assess where the explanation transfers.","rubric":["Limits claims beyond the single case.","Suggests examining rival explanations or contrasting cases."],"evidence":"Conflicting ownership appeared alongside delays."}]},{"id":"case10","title":"Developing a questionnaire about belonging","passage":"Available campus-belonging surveys were developed for residential students, so their content may miss commuter students’ experiences. Researchers first interviewed 20 commuter students about belonging. Themes included timetable gaps, transport reliability and opportunities to stay after class. These themes informed new questionnaire items. After a small wording pilot, 420 commuter students completed the questionnaire. The team examined patterns in the responses and consistency among items intended to measure the same construct. It integrated the interview findings and survey results when revising the instrument. The authors described this as an initial instrument-development study, not final proof that the questionnaire measures belonging accurately in every setting. No directional hypothesis was specified.","fictional":true,"refs":[{"doc":"P4","pages":"20–22"},{"doc":"L2","pages":"11"},{"doc":"L4","pages":"3–4"}],"prompts":[{"id":"case10-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Existing residential-student instruments may omit aspects of belonging relevant to commuters, creating a measurement/content gap.","rubric":["Identifies the missing commuter-specific content.","Does not equate having any existing questionnaire with adequate measurement."],"evidence":"Surveys developed for residential students may miss commuter experiences."},{"id":"case10-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: Which aspects of belonging matter to commuter students, and how can these inform an appropriate questionnaire? Objective: develop and initially evaluate an instrument informed by their experiences.","rubric":["Includes discovery and instrument development.","Aligns the objective with both phases."],"evidence":"Themes informed new questionnaire items."},{"id":"case10-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No directional hypothesis is reported. Instrument development can proceed through research questions and evaluation criteria; numerical analysis does not imply that a hypothesis must have been stated.","rubric":["Recognizes absence of a stated hypothesis.","Avoids inventing a prediction solely because quantitative data were used."],"evidence":"No directional hypothesis was specified."},{"id":"case10-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Mixed methods, exploratory sequential: qualitative interviews inform a later quantitative instrument, and findings are integrated in revision.","rubric":["Identifies qualitative-to-quantitative sequence.","Explains how one phase informs and integrates with the other."],"evidence":"First interviewed students, then developed and evaluated questionnaire items."},{"id":"case10-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary interview transcripts and quantitative questionnaire responses. Belonging is the construct; questionnaire responses operationalize aspects of it. The passage does not describe how interviewees or the 420 survey respondents were recruited or selected, so do not call either group random or representative. Internal consistency is one reliability-related property, not proof of validity.","rubric":["Identifies both data forms and the construct.","Notes that recruitment/selection is unreported and avoids assuming representativeness.","Separates consistency from measuring the intended construct."],"evidence":"The passage reports 20 interviewees and 420 respondents but gives no recruitment or sampling method."},{"id":"case10-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The cautious initial-development claim is appropriate. Consistent items can still measure the wrong construct. Further content and construct-validity evidence and testing in new groups are needed before broad use.","rubric":["Does not treat reliability as sufficient for validity.","Proposes additional relevant validation rather than only more items."],"evidence":"Not final proof of accurate measurement in every setting."}]},{"id":"case11","title":"Study spaces: combining counts and experiences","passage":"Library counts show which study areas are occupied but do not explain whether those spaces meet students’ needs. During the same four-week period, researchers counted occupied seats each hour and interviewed students about why they chose particular areas. They analysed the counts and interview themes separately, then compared them in a joint interpretation. A quiet floor had high occupancy, but interviewees said its popularity partly reflected a shortage of power outlets elsewhere. The researchers argued that high occupancy alone should not be treated as high satisfaction. They proposed examining outlet availability before redesigning noise rules. No directional hypothesis was stated.","fictional":true,"refs":[{"doc":"P4","pages":"20–22"},{"doc":"L4","pages":"19"}],"prompts":[{"id":"case11-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"Occupancy data alone do not explain whether use reflects satisfaction or constraints in alternative spaces.","rubric":["Names the missing explanation of occupancy.","Distinguishes use from satisfaction."],"evidence":"Counts do not explain whether spaces meet students’ needs."},{"id":"case11-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How do occupancy patterns relate to students’ reasons for choosing library spaces? Objective: integrate measured use with users’ explanations.","rubric":["Includes both measured pattern and experience.","Makes integration part of the objective."],"evidence":"Compared counts and interview themes in a joint interpretation."},{"id":"case11-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No directional hypothesis is stated. The outlet explanation emerged from interviews and should be tested further rather than described as a confirmed prior causal prediction.","rubric":["Identifies no stated hypothesis.","Distinguishes an explanatory finding from established causation."],"evidence":"Interviewees described shortages of power outlets elsewhere."},{"id":"case11-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Concurrent/convergent mixed methods: numeric observations and qualitative interviews are collected in the same period, analysed separately and integrated.","rubric":["Recognizes concurrency.","Identifies explicit integration of two data strands."],"evidence":"Same four-week period; separate analysis then joint interpretation."},{"id":"case11-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"Primary quantitative seat counts and primary qualitative interview accounts. Counts operationalize occupancy, not satisfaction. Recruitment details for interviews are not stated and should not be invented.","rubric":["Distinguishes occupancy from the satisfaction construct.","Acknowledges missing sampling information."],"evidence":"Counted seats and interviewed students; recruitment not described."},{"id":"case11-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"The conclusion that occupancy need not equal satisfaction is supported by contrasting evidence. The outlet explanation may be selective and is not experimentally established. Better-described interview recruitment and a targeted change with follow-up could strengthen the claim.","rubric":["Limits the causal inference from interview explanations.","Provides a targeted improvement and acknowledges sampling uncertainty."],"evidence":"Proposed examining outlets before changing noise rules."}]},{"id":"case12","title":"Representations of AI in university newsletters","passage":"Studies have examined newspaper coverage of AI, but less is known about how universities describe it in communications to students. Researchers collected all 96 newsletters published by six selected universities during one academic year. A coding guide defined categories for benefits, risks and guidance. Two coders independently classified each newsletter; disagreements were documented and resolved using the guide. Benefit-related messages appeared in 71 newsletters and risk-related messages in 28. Categories could overlap. The authors concluded that benefits received more frequent mention in this corpus. They also claimed that the newsletters made students more optimistic, although no student attitudes were measured. The report asked how AI was framed and did not state a directional hypothesis.","fictional":true,"refs":[{"doc":"P4","pages":"12"},{"doc":"L4","pages":"13, 19–22"},{"doc":"L2","pages":"19"}],"prompts":[{"id":"case12-gap","kind":"gap","prompt":"Identify the specific research gap. Separate it from the practical problem.","answer":"The gap concerns university-to-student communication about AI, compared with prior work on newspaper coverage.","rubric":["Identifies the specific communication setting.","Acknowledges existing related literature."],"evidence":"Less is known about university communications to students."},{"id":"case12-question","kind":"question","prompt":"State the research question and a matching objective.","answer":"RQ: How is AI framed in newsletters from the selected universities during the academic year? Objective: systematically describe the frequency and content of the defined categories.","rubric":["Matches the question to the document corpus.","Does not introduce an unmeasured attitude outcome."],"evidence":"Asked how AI was framed."},{"id":"case12-hypothesis","kind":"hypothesis","prompt":"Identify the stated hypothesis. If absent, say so; distinguish any hypothesis you propose.","answer":"No directional hypothesis is stated. The difference between benefit and risk mentions is an observed finding, not a prespecified prediction.","rubric":["Identifies the absent explicit hypothesis.","Separates research question from results."],"evidence":"The report did not state a directional hypothesis."},{"id":"case12-design","kind":"design","prompt":"Classify the approach and specific design. Justify using evidence from the passage.","answer":"Systematic content analysis of existing documents, with quantitative category counts as reported. Text sources can be analysed quantitatively. This is not an experiment on students.","rubric":["Recognizes quantitative coding of textual material.","Avoids equating all text sources with exclusively qualitative analysis."],"evidence":"Defined categories and counted coded newsletters."},{"id":"case12-data","kind":"data","prompt":"Identify the data, sampling or recruitment, and key variables or qualitative focus.","answer":"The 96 pre-existing newsletters form the document corpus; they are records generated outside this study and primary source material for analysing university framing. Researchers create coded variables from them. The six universities were selected, but the selection method or criteria are not reported; do not assume random selection or representativeness. The unit is the newsletter. Because categories overlap, the 71 and 28 counts are not mutually exclusive and cannot be summed to count distinct newsletters.","rubric":["Describes document provenance and why primary-source terminology can also apply, without requiring one label.","Identifies that selection criteria for universities are unreported and avoids assuming representativeness.","Identifies the unit and recognizes overlapping categories."],"evidence":"All 96 newsletters from six selected universities; the passage gives no university-selection criteria."},{"id":"case12-claims","kind":"claims","prompt":"Evaluate the conclusion. Give one limitation and a targeted improvement.","answer":"More frequent benefit mentions is supported for this corpus. Student optimism was not measured, so influence on attitudes is unsupported. Attitude data with an appropriate design would be needed. Because the six universities’ selection criteria are unstated, the corpus does not support a claim about all universities.","rubric":["Distinguishes the supported corpus claim from unmeasured effects.","Proposes data appropriate to the unsupported attitude claim.","Limits generalization in light of the unreported university selection."],"evidence":"No student attitudes were measured; the six universities were selected without a stated selection method."}]}],"verification":[{"id":"scopus_elsevier","organization":"Elsevier","url":"https://www.elsevier.com/products/scopus","verified_facts":["Scopus is described by its provider as an abstract and citation database.","Scopus provides citation, author-profile, and analytical features; Scopus Preview is available without institutional full access.","Elsevier directs users to Scopus Preview, freely accessible, for the complete list of titles indexed in Scopus; check title and coverage dates there.","Provider-record counts change; do not memorize lecture-era figures."]},{"id":"scopus_search_help","organization":"Elsevier Scopus Support","url":"https://service.elsevier.com/app/answers/detail/a_id/11365/supporthub/scopus/~/how-can-i-best-use-the-advanced-search/","verified_facts":["Advanced Search supports Boolean and proximity operators and field codes.","Documented operators include OR, AND, and AND NOT; parentheses and platform-specific precedence matter.","TITLE, ABS, and TITLE-ABS-KEY are examples of field codes; database syntax is product-specific."]},{"id":"web_of_science_core","organization":"Clarivate","url":"https://clarivate.com/academia-government/scientific-and-academic-research/research-discovery-and-referencing/web-of-science/web-of-science-core-collection/","verified_facts":["Web of Science Core Collection is described as a citation database with curated journals, conference proceedings, and scholarly books.","Clarivate provides a separate Master Journal List for checking journal indexing and coverage.","Core Collection is a component of the broader Web of Science platform; avoid conflating platform totals and Core Collection totals."]},{"id":"web_of_science_master_journal_list","organization":"Clarivate","url":"https://mjl.clarivate.com/","verified_facts":["The Master Journal List can be used to check journals across Web of Science indexes.","Indexing should be checked for the specific title and relevant coverage period."]},{"id":"pubmed_about","organization":"National Library of Medicine / NCBI","url":"https://pubmed.ncbi.nlm.nih.gov/about/","verified_facts":["PubMed is a free resource for searching and retrieving biomedical and life-sciences literature.","PubMed contains citations and abstracts; it does not itself include the full text of every journal article.","PubMed searches across resources including MEDLINE, PubMed Central citations, and Bookshelf citations."]},{"id":"pubmed_help","organization":"National Library of Medicine / NCBI","url":"https://pubmed.ncbi.nlm.nih.gov/help/","verified_facts":["Full-text links may lead to publisher sites or PMC; publisher access may require a fee or subscription.","PMC is a free full-text archive and is distinct from PubMed.","PubMed documents Boolean operators, field tags such as [ti] and [au], filters, phrase-search limits, and Search Details for reviewing query translation.","PubMed applies automatic term mapping; quotes, field tags, and wildcards can change mapping behavior."]},{"id":"eric_home","organization":"Institute of Education Sciences, U.S. Department of Education","url":"https://eric.ed.gov/","verified_facts":["ERIC is a free, searchable online collection focused on education research and related resources.","ERIC provides peer-reviewed and full-text-available filters; they describe record attributes and do not mean every ERIC record is a peer-reviewed full-text article.","ERIC provides a Thesaurus with education descriptors and synonyms."]},{"id":"ieee_xplore_search","organization":"IEEE","url":"https://ieeexplore.ieee.org/Xplorehelp/searching-ieee-xplore/search-engine","verified_facts":["IEEE Xplore indexes periodicals, conference publications, books, and standards.","The search system documents AND, OR, NOT and proximity operators, phrase search, and field-specific queries.","Full-text availability depends on the item and the user’s subscription or open-access status."]},{"id":"ieee_xplore_title_lists","organization":"IEEE","url":"https://ieeexplore.ieee.org/Xplorehelp/discovery-services/kbart-title-lists","verified_facts":["Official IEEE Xplore title lists distinguish journals, conference publications, standards, and books.","The provider states the lists are updated regularly; access to a publication collection is license-dependent."]},{"id":"ieee_xplore_access","organization":"IEEE","url":"https://ieeexplore.ieee.org/Xplorehelp/overview-of-ieee-xplore/about-ieee-xplore","verified_facts":["IEEE describes IEEE Xplore as a discovery and access platform for IEEE and partner technical content.","The platform offers institutional subscription options, individual subscriptions, and purchase of individual documents; access to full text depends on the user's entitlement or the item's access terms."]},{"id":"sciencedirect_scopus_distinction","organization":"Elsevier Support","url":"https://service.elsevier.com/app/answers/detail/a_id/28240/supporthub/evolve-simulations/","verified_facts":["ScienceDirect contains full-text articles and books, primarily from Elsevier and including some hosted societies.","Scopus indexes metadata, abstracts, and references from thousands of publishers and supplies citation and author/affiliation profile functions.","Scopus and ScienceDirect are different databases; access to a particular full-text item can depend on subscription or open-access status."]},{"id":"sciencedirect_browse","organization":"Elsevier ScienceDirect","url":"https://www.sciencedirect.com/browse/journals-and-books","verified_facts":["ScienceDirect distinguishes journals, books, and publication access types such as open access and subscribed content.","A search or browse result does not by itself guarantee that its full text is accessible to every user."]},{"id":"doaj","organization":"Directory of Open Access Journals","url":"https://doaj.org/","verified_facts":["DOAJ is an open index/directory for open-access journals and article records, and its search is freely accessible.","Open access describes availability; it is not by itself proof that an individual study is relevant or methodologically sound.","Avoid relying on volatile journal or article counts."]},{"id":"jstor_open","organization":"ITHAKA / JSTOR","url":"https://about.jstor.org/products/jstor-platform/whats-on-jstor/open-and-free/","verified_facts":["JSTOR offers a growing subset of open and free journals, books, primary sources, images, and reports.","JSTOR access options include institutional access, open content, and limited registered-user free reading; not all indexed content is freely downloadable.","Historical early journal content rules vary by region and age; the lecture’s simplified “before 1924 in the United States” claim is not a complete access rule."]},{"id":"google_scholar_help","organization":"Google Scholar","url":"https://scholar.google.com/intl/us/scholar/help.html","verified_facts":["Google Scholar supports the author: operator and documents title searching through quoted titles and Advanced Search fields.","Scholar describes date limits through its “Since Year” control and date sorting; since:YYYY is not established as a portable academic-database query operator.","Scholar offers References/cited-by exploration and links to versions or access routes, but a search result does not guarantee free full text.","A cited-by count or link is a discovery aid and does not assess methodological quality."]},{"id":"paperpile_reference_manager","organization":"Paperpile","url":"https://support.paperpile.com/features/reference-manager/","verified_facts":["Paperpile describes functions for collecting, organizing, and citing references.","Imported metadata can be incomplete and should be checked; a reference manager does not appraise a study’s quality."]}]};
</script><script>(function(root){
'use strict';
const topics=['foundations','articles','databases','design','collection'];
function shuffle(items,rng=Math.random){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selectQuestions(all,{topic='all',difficulty='all',count=20,ids=null}={}){const candidates=all.filter(q=>(topic==='all'||q.topic===topic)&&(difficulty==='all'||q.difficulty===difficulty)&&(!ids||ids.includes(q.id)));return shuffle(candidates).slice(0,count==='all'?candidates.length:Number(count));}
function examQuestions(all,count=28){const order=shuffle(topics);const result=[];let n=0;for(const topic of order){const quota=Math.floor(count/topics.length)+(n++<count%topics.length?1:0);result.push(...shuffle(all.filter(q=>q.topic===topic)).slice(0,quota));}return shuffle(result);}
function newItem(q){return {kind:'mcq',qid:q.id,order:shuffle([0,1,2,3]),selected:null,checked:false};}
function gradeMCQ(items,byId){return {correct:items.filter(x=>x.kind==='mcq'&&x.selected!==null&&x.selected===byId[x.qid].answer).length,total:items.filter(x=>x.kind==='mcq').length,answered:items.filter(x=>x.kind==='mcq'&&Number.isInteger(x.selected)).length};}
function examScore(exam,byId){const mcq=gradeMCQ(exam.items,byId);const written=exam.items.filter(x=>x.kind==='written');const graded=written.filter(x=>[0,.5,1].includes(x.selfScore));const points=graded.reduce((s,x)=>s+x.selfScore,0);return {mcq,writtenTotal:written.length,writtenGraded:graded.length,writtenPoints:points,complete:graded.length===written.length,percent:graded.length===written.length?Math.round(100*(mcq.correct+points)/exam.items.length):null};}
function remaining(deadline,now=Date.now()){return Math.max(0,Math.ceil((deadline-now)/1000));}
function topicStats(attempts,questions){return topics.map(topic=>{const q=questions.filter(q=>q.topic===topic);const seen=q.filter(q=>attempts[q.id]);return {topic,total:q.length,seen:seen.length,correct:seen.filter(q=>attempts[q.id].correct).length};});}
function readStorage(storage,key,fallback){try{const parsed=JSON.parse(storage.getItem(key));return parsed&&parsed.version===1?parsed:fallback;}catch{return fallback;}}
root.RMTCore={topics,shuffle,selectQuestions,examQuestions,newItem,gradeMCQ,examScore,remaining,topicStats,readStorage};
})(typeof window!=='undefined'?window:globalThis);
</script><script>(function(){
'use strict';

const byId=Object.fromEntries(D.questions.map(q=>[q.id,q])),caseById=Object.fromEntries(D.cases.map(c=>[c.id,c]));
let storageOK=true,storage;try{storage=window.localStorage;storage.setItem(KEY+'-check','1');storage.removeItem(KEY+'-check');}catch{storageOK=false;storage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};}
const blank=()=>({version:1,attempts:{},bookmarks:[],articles:{},practice:null,exam:null,history:[]});

// A damaged or incompatible saved state must never prevent opening the course.
if(!state.attempts||!Array.isArray(state.bookmarks)||!state.articles||!Array.isArray(state.history))state=blank();
const validMCQ=x=>x&&x.kind==='mcq'&&byId[x.qid]&&Array.isArray(x.order)&&x.order.length===4&&new Set(x.order).size===4&&x.order.every(n=>Number.isInteger(n)&&n>=0&&n<4)&&(x.selected===null||Number.isInteger(x.selected)&&x.selected>=0&&x.selected<4);

if(state.practice&&(!Array.isArray(state.practice.items)||!state.practice.items.length||!state.practice.items.every(validMCQ)||!Number.isInteger(state.practice.index)||state.practice.index<0||state.practice.index>state.practice.items.length))state.practice=null;
if(state.exam&&(!Array.isArray(state.exam.items)||state.exam.items.length!==40||!state.exam.items.slice(0,28).every(validMCQ)||!state.exam.items.slice(28).every(validWritten)||!Number.isInteger(state.exam.index)||state.exam.index<0||state.exam.index>=40||!(state.exam.deadline===null||Number.isFinite(state.exam.deadline))))state.exam=null;
let view=location.hash.slice(1)||'overview',topic='foundations',caseId=caseById[state.activeCase]?state.activeCase:D.cases[0].id,reviewMode='mistakes',search='',confirmExam=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const btn=(label,action,cls='',attrs='')=>`<button class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
function save(){try{storage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;toast('Browser storage is full or unavailable. Keep this tab open to retain this session.');}}
let toastTimer;function toast(message){const el=$('#toast');el.textContent=message;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4500);}
function go(next){view=next;location.hash=next;confirmExam=false;render();window.scrollTo({top:0,behavior:'instant'});}
function icon(name){const paths={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',learn:'M3 4h7l2 2 2-2h7v16h-7l-2 2-2-2H3z M12 6v16',practice:'M5 4h14v17H5z M8 2h8v4H8z M8 10h8 M8 15h5',articles:'M5 2h10l4 4v16H5z M14 2v5h5 M8 11h8 M8 15h8 M8 18h5',exam:'M12 8v5l3 2 M9 2h6 M12 2v3 M20 5l-2 2 M21 13a9 9 0 1 1-18 0 9 9 0 0 1 18 0',review:'M4 5h16v16H4z M8 2v6 M16 2v6 M8 13l3 3 5-6'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.learn}"/></svg>`;}
function source(s){if(!s)return '';if(Array.isArray(s))return s.map(source).join(' ');const doc=DOCS[s.doc]||s.doc||'Course application';return `<div class="source">${esc(doc)}${s.pages?' · PDF p. '+esc(s.pages):''}${s.url?` · <a href="${esc(s.url)}" target="_blank" rel="noopener">Official clarification</a>`:''}${s.note?' · '+esc(s.note):''}</div>`;}
function shell(content){const seen=Object.keys(state.attempts).filter(id=>byId[id]).length;return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">r.</span><div>Research Studio<small>Midterm preparation</small></div></div><nav class="nav" aria-label="Main navigation">${[['overview','Overview'],['learn','Topic lessons'],['allnotes','Study guide'],['practice','Question bank'],['articles','Article lab'],['exam','Mock exam'],['review','Review & progress']].map(([id,label])=>`<button data-action="nav" data-view="${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}>${icon(id)}${label}</button>`).join('')}</nav><div class="sidebar-bottom"><span class="eyebrow">Your question coverage</span><strong>${seen} / ${D.questions.length} practised</strong><div class="progress-track"><span style="width:${seen/D.questions.length*100}%"></span></div><p>Progress stays in this browser. Your answers are not sent to a server.</p></div></aside><div class="workspace"><header class="topbar"><span class="muted">Research Methods and Tools</span><span class="topnote"><i class="dot"></i>4 lectures · 2 practice sets</span></header>${!storageOK?'<div class="storage-alert" role="alert">Browser storage is unavailable. Progress will last only while this tab stays open.</div>':''}<main id="main" tabindex="-1">${content}<footer><span>Lecture-based revision · Original practice questions · Not an official exam</span><button class="link-button" data-action="nav" data-view="sources">Sources & accuracy notes</button></footer></main></div></div>`;}
